of the war, which he keeps in stalemate. Carried into the warp aboard the [[requiemship|Requiem of Virtue]].","dw":["GE","FC","SW"]},{"id":"akuryo","n":"Shas'el Akuryo","t":"person","c":"phaedra","w":["GE","FC"],"d":"Tau commander, nickname Stormlight. Mottled crimson armour with a five-armed sunburst.\n\n• _The Greater Evil_: at the end, enters the cult's hive with the Ethereal Kyuhai and two kroot, Rukh and Zeljukh, to investigate the enemy.\n• _Fire Caste_: [[gurdjief|Gurdjief]] meets a lost tau in the same armour inside [[coil|the Coil]]. He calls his caste “Smoke” and is hunting the [[canker|Canker Eaters]]. [[iverson|Iverson]] later finds the armour as a fungus-covered totem in a kroot village.\n\nIdentification confirmed by heraldry.","dw":["GE","FC"]},{"id":"canker","n":"The Canker Eaters","t":"faction","c":"phaedra","w":["FC","GE"],"d":"Kroot on [[phaedra|Phaedra]] corrupted by the fungus (kroot absorb traits from what they eat). Hunted by the lost crimson-armoured tau ([[akuryo|Akuryo]]) in _Fire Caste_.\n\nProbable origin: Rukh and Zeljukh, the kroot who entered the hive with Akuryo in _The Greater Evil_ (strong inference).","dw":["FC","GE"]},{"id":"kaul","n":"Magos Kaul / Caul","t":"person","c":"phaedra","w":["FC","VG"],"d":"Mechanicus magos. Controls the Diadem (the Iron Diadem in _Vanguard_), a promethium refinery on Lake Amrythaa. Discrepancy: _Fire Caste_ dates the rig to [[phaedra|Phaedra]]'s “first pacification”, “almost a thousand years old”; _Vanguard_ says Caul forged it around his explorator ship “nearly two centuries ago”.\n\n• _Fire Caste_: collaborates with the tau; extends [[seishin|O'Seishin]]'s life.\n• _Vanguard_ (spelled Caul): after the war stops, has rebuilt dead [[arkan|Arkan]] soldiers as skitarii, including [[roach|Roach and Van Hal]]. Needs a Navigator to leave Phaedra. The captive Navigator kills him with his warp eye (“I lied”).","dw":["FC","VG"]},{"id":"roach","n":"Roach & Van Hal","t":"person","c":"phaedra","w":["FC","VG"],"d":"Troopers of the [[arkan|19th Arkan]] in _Fire Caste_. Roach dies in the Eye; Van Hal is a sniper with 214 confirmed kills.\n\nIn _Vanguard_ both are skitarii in [[kaul|Caul]]'s cohort:\n• Ranger Rho-IR02, whose name glitches into “Rho… ach”.\n• Alpha Vhaal-FE01, a cavalry rider whose only memories are “Fire… Pain… 214”.","dw":["FC","VG"]},{"id":"reve","n":"Ysabel Reve","t":"person","c":"phaedra","w":["FC"],"d":"Cadet in _Fire Caste_; claims to be High Commissar Lomax's daughter. [[iverson|Iverson]] shoots her in the face. Her ghost, overgrown with fungus, appears to him later.\n\nPossibly the Alpha Primus of _Vanguard_: a faceless female skitarius with a mirrored silver mask, who hates the tau and wonders if she was once a collaborator (speculative).","dw":["FC","VG"]},{"id":"sleeper","n":"The Sleeper Beneath","t":"entity","c":"phaedra","w":["AM"],"d":"Krol Szaajal, “the Sunken Maw”, from Saathlaa legend: a hidden lake used for sacrificial rites.\n\nIn _Altar of Maws_ it is real: a lake filled with eyes and mouths, with green spiral irises. It eats souls and animates skeletons. The [[polycaptain|captain of the Polyphemus]] believes it is an avatar of the Emperor and wakes it by sacrificing a tau convoy.","dw":["AM"]},{"id":"polycaptain","n":"Captain of the Polyphemus","t":"person","c":"phaedra","w":["AM"],"d":"Unnamed commander of the Imperial gunboat _Polyphemus_ in _Altar of Maws_. A latent psyker. Led his crew in killing their previous captain, whose body is now a glowing fungal growth on the bridge.\n\nServes the [[sleeper|Sleeper Beneath]] and sacrifices the tau convoy to wake it. Repeats “[[m_within|As above, so below]]” and “[[m_goes|So it goes]]” without knowing where he learned them. Killed when [[jhikaara|Jhi'kaara]]'s team storms the boat.","dw":["AM"]},{"id":"brinedogs","n":"Brine Dogs of Hook's Sink","t":"faction","c":"phaedra","w":["AM"],"d":"Imperial Guard prisoners in the tau convoy in _Altar of Maws_. From the world Hook's Sink; resentful of the Imperium. Their medic, Sharkey, has an indigo spiral painted around one eye.\n\nProbably the same regiment as the 27th Halgarth Brine Dogs of _Cold Covenant_ (unread).","dw":["AM"]},{"id":"obarai","n":"Oba'rai / Oberai","t":"place","c":"phaedra","w":["OC","FC","RI","RV"],"d":"Oba'rai (_Out Caste_): dry world settled by Imperial colonists and one Guard regiment that was promised the planet. The tau conquer it with deliberately harsh terms and let kroot eat the dead. Where [[jhikaara|Jhi'kaara]] is scarred.\n\nThe name “Oberai” recurs:\n• _Fire Caste_: the 77th Oberai Redeemers defect to the tau.\n• _Requiem Infernal_: Zevraj, an Oberai Redeemer.\n• _The Reverie_: [[tarsem|Tarsem Veyd]] of the Oberai Oligarchy.\n\nWhether Oba'rai and Oberai are the same place is not stated.","dw":["OC","FC","RI","RV"]},{"id":"requiemship","n":"Requiem of Virtue","t":"entity","c":"phaedra","w":["FC"],"d":"Imperial warship over [[phaedra|Phaedra]] (Sky Marshal Kircher's flagship). At the end of _Fire Caste_ [[cutler|Cutler]] forces it into the warp with no Navigator and failing Geller fields.\n\nAboard: Cutler (with Skjoldis), [[seishin|O'Seishin]], [[iverson|Iverson]]'s body, the remainder of the [[arkan|19th Arkan]].\n\nDestination unknown. Name similarity to [[tome|_The Requiem Infernal_]] (speculative).","dw":["FC"]},{"id":"sarastus","n":"Sarastus / Hive Carceri","t":"place","c":"sarastus","w":["NB","NF","RI","WF","RV","NN"],"d":"Hive world with a dim grey sun. Five domed hive cities with artificial day/night cycles; Carceri is the largest.\n\nTimeline:\n1. _Nightbleed_: Carceri before its fall. Blackouts, doomsday cults, poor fed on [[vita|Vita Ephemera]] made from the recycled dead. [[vedas|Vedas]]'s barrel of [[vlg|VLG-01]] enters the food supply.\n2. _Nightshift Nineteen_: roughly a decade later. Many of the dome's [[sunlights|Sunlights]] are dead and nobody can fix them; most districts have walled-off “Night Zones”.\n3. [[truenight|True Night]] falls. [[jonah|Jonah Tythe]]'s sister dies on the first night (_Requiem Infernal_).\n4. _Nightfall_: True Night “had touched Sarastus three times”. Four hives are dead; Carceri is the last. A cult sends children to the top tier as tribute for the [[nightlords|Night Lords]] every 13 years. [[needle|The Needle]] stands in the plaza.\n5. _The Walker in Fire_: centuries after the fall. Carceri is dead, inhabited by blind mutant ghouls.\n\nWhich of the three visitations of True Night killed Jonah's sister is not stated.","dw":["NB","NF","RI","WF","RV","NN"]},{"id":"needle","n":"The (Black) Needle","t":"entity","c":"sarastus","w":["NF","NB","CHS"],"d":"• _Nightfall_: monolith of twisted iron and black barbs rising from [[sarastus|Carceri]]'s top plaza into the clouds. A daemonseed planted by [[yehzod|Yehzod]] and grown by the light of the [[blacksun|Black Sun]]. It “sings”, lures children and shreds them, and gives visions.\n• _Nightbleed_: Skreech predicts the “Night Below” will rise “like a titanic obsidian needle” and pierce the dome. The local myth of “Needlemen” (needles of darkness living in cracks in the dome) becomes real through [[chel|Chel Jarrow]].\n• _Cast a Hungry Shadow_ / _Cult of the Spiral Dawn_: the [[gharth|Scorched Creed]] chants “The Black Needle unweaves the world”. The phrase later comes from the Inquisition's corrupted station.","dw":["NF","NB","CHS","CSD"]},{"id":"chel","n":"Chel Jarrow / the Needleman","t":"person","c":"sarastus","w":["NB","NN"],"d":"Protagonist of _Nightbleed_. Former medicae, dismissed after accidentally killing a patient (Rozalia Temető) with the wrong injection. Works nights approving food additives at Potton Vitapax.\n\nShe tastes the additive [[vlg|VLG-01]] and develops vivid nightmares, aggression and visions (she can see the dead in the food vats). Skreech, a cultist who dresses as the Needleman, stalks her. She drinks from the source barrel; her eyes turn black; she kills Skreech and takes his iron mask. Walking the corridor of her tower block, she physically transforms into a Needleman (multi-jointed, bladed fingers, a ribbon of eyes for a head). She then kills her husband, Lyle, in their bed on the 131st floor of [[barka|Barka Tower]].\n\n_Nightshift Nineteen_ shows the aftermath from outside, without naming her: the husband was found shredded and woven back together with his own bones, still alive; the shy, quiet wife was missing. The sealed apartment is number 19. See [[nineteen|Nineteen Ascendant]].\n\nSays “[[m_legion|We are legion]]” and “As above, so below… [[m_within|As within, so without]].”","dw":["NB","NN"]},{"id":"zeth","n":"Zeth","t":"person","c":"sarastus","w":["NF"],"d":"Protagonist of _Nightfall_. Pale, grey-eyed child (“ghoul”) in [[sarastus|Carceri]]'s top tier. Latent psyker. A “scarred prophet” taught him to listen to [[needle|the Needle]].\n\nBreaks a thorn from the Needle and uses it as a dagger. Kills the Night Lord Haz'thur. Has a vision of “a black-feathered king dying from within and without”. Taken away by Lord [[nightlords|Vassaago]] over [[yehzod|Yehzod]]'s objection.","dw":["NF"]},{"id":"nightlords","n":"Vassaago's Night Lords","t":"faction","c":"sarastus","w":["NF"],"d":"Night Lords (Chaos Space Marine) warband in _Nightfall_. Collects tribute from Carceri every 13 years, at the “dawn of the [[blacksun|Black Star]]”.\n\n• Lord Vassaago: ancient, white marble-like face, black eyes. His ship's half-daemon spirit fears [[sarastus|Sarastus]].\n• [[yehzod|Yehzod]]: sorcerer.\n• Zhara'shan: talonmaster; survives, badly burned.\n• Haz'thur: mutated raptor; says “Your Long War [[m_lie|is a lie]]”. Killed by [[zeth|Zeth]].\n\nVassaago's name is one letter from Vassago (see [[blackflags|8th Vassago Black Flags]]).","dw":["NF"]},{"id":"yehzod","n":"Yehzod","t":"person","c":"sarastus","w":["NF"],"d":"Sorcerer of [[nightlords|Vassaago's Night Lords]]. Joined about a century before _Nightfall_. Claims Astartes heritage but appears Mechanicum-like: faceless iron mask, robes, no visible body. Studies the [[blacksun|Black Sun]]. Planted [[needle|the Needle]]. Objects to taking [[zeth|Zeth]], saying the boy is tainted by something he cannot measure.","dw":["NF"]},{"id":"killteam","n":"Kill Team Sabatine","t":"faction","c":"sarastus","w":["WF"],"d":"Deathwatch kill team in _The Walker in Fire_, sent to dead Carceri on [[sarastus|Sarastus]].\n\n• Garran Branatar (Salamanders): narrator; heavy flamer; haunted by the ghost of his comrade Athondar.\n• [[malvoisin|Icharos Malvoisin]] ([[resplendent|Angels Resplendent]]): wounded and lost.\n• Cato Thandios (White Consuls, Watch Sergeant): falls into a bottomless pit.\n• Sevastin, “the Black Wing” (Chapter unstated): single lightning claw; motto “Divided we endure”; killed by a skitarii assassin, cursing “Tenebrae”.\n• Anzahl-M636 (Brotherhood of A Thousand, Techmarine): crystalline irises; possibly working with Hauko; left alive with the top of his skull sliced off.\n• Contact: [[hauko|Hauko]].\n\nTarget: [[lem|Magos Lem]].","dw":["WF"]},{"id":"hauko","n":"Hauko","t":"person","c":"inq","w":["WF"],"d":"Black Shield (a Deathwatch marine who has renounced his Chapter). Sniper. Very old; shark-like teeth; black eyes without irises. Says his Chapter thought him “too soft”.\n\nHas worked for [[escher|Inquisitor Escher]] since leaving his Chapter. Tracked the Xenarites on [[sarastus|Sarastus]] for months. Knew the mission was an extraction of [[lem|Magos Lem]], not a kill, and did not tell the kill team.","dw":["WF"]},{"id":"oblazt","n":"Oblazt","t":"place","c":"inq","w":["FI","TP","CSD"],"d":"Ice world. Hive cities anchored by giant spikes into ice over a buried ocean. Economy: fish and promethium. Ruled by oligarchs (Koroleva). The tundra is called the Ghostlands.\n\n• _Fire and Ice_: the tau-inspired [[unity|Unity revolution]]; [[calavera|the Calavera]]'s train journey.\n• _The Thirteenth Psalm_: the same revolution, in the city of Zakhalin; the [[mirror|Mirror of Athanazius]].\n• _Cult of the Spiral Dawn_ (backstory): the [[blackflags|Black Flags]] were betrayed here by another Black Flag regiment.\n• _Cold Covenant_ (unread): set here.","dw":["FI","TP","CSD"]},{"id":"kliest","n":"Kliest","t":"place","c":"inq","w":["FI","GE"],"d":"World with a statue of Sanguinius Ascendant.\n\n• _Fire and Ice_: [[mordaine|Mordaine]] is hiding here at the start.\n• _The Greater Evil_: [[voyle|Voyle]] boarded the derelict _Halvorsen_ near Kliest and was implanted by a genestealer.","dw":["FI","GE"]},{"id":"escher","n":"Aion Escher","t":"person","c":"inq","w":["FI","CHS","WF"],"d":"Inquisitor; Grand Master of the Damocles Conclave, Ordo Xenos. Spelled “Aescher” in _Cast a Hungry Shadow_.\n\n• Led an Inquisition taskforce to [[phaedra|Phaedra]] (backstory in _Fire and Ice_).\n• Sanctioned the [[sarastus|Sarastus]] mission in _The Walker in Fire_, run by his agent [[hauko|Hauko]].\n• Murdered. [[mordaine|Mordaine]] was blamed.\n• _Fire and Ice_: [[calavera|the Calavera]] says Escher was his agent, and reveals that Escher's mind was imprinted into Mordaine.\n\nHis sayings become the [[calaveraC|Calavera Conclave]]'s code phrases (“War is not a binary condition”; “Nothing has changed”; “Everything has changed”).","dw":["FI","CHS","WF","CSD"]},{"id":"mordaine","n":"Haniel Mordaine","t":"person","c":"inq","w":["FI","CSD"],"d":"• _Fire and Ice_: disgraced interrogator and protégé of [[escher|Escher]], blamed for Escher's murder. Travels using Escher's stolen seal. Learns he was raised to host Escher's mind. The [[calavera|Calavera]] says he will be an inquisitor within two years.\n• _Cult of the Spiral Dawn_: Inquisitor Mordaine, head of the [[calaveraC|Calavera Conclave]]. Looks about 40 but is older. Has watched [[vytarn|Redemption]] for over a century. Ends the novel allied with [[cross|Cross]].","dw":["FI","CSD","CHS","WF"]},{"id":"calaveraC","n":"Calavera Conclave","t":"faction","c":"inq","w":["CSD","FI"],"d":"Ordo Xenos cell led by [[mordaine|Mordaine]] on [[vytarn|Redemption]], named after [[calavera|the Calavera]]. Uses [[escher|Escher]]'s sayings as challenge codes.\n\nActivities: bought and destroyed Redemption's promethium exports; killed cult missionaries in orbit; lured pilgrims to the planet as “supplementary subjects”. Agents include Clavel (“Calavera Five”), who retrieves an azure-leather tome from the [[thorn|Thorn Eternal]] vault and is eaten by the Patriarch.\n\nBy the end of the novel its orbital station is corrupted and broadcasting the [[gharth|Scorched Creed]]'s liturgy.","dw":["CSD","FI"]},{"id":"calavera","n":"The Calavera / Iho'nen","t":"person","c":"inq","w":["FI","RI","CHS"],"d":"Space Marine of unstated origin in _Fire and Ice_. Tau name: Iho'nen (“Eater of Sins”).\n\n• Grey robes; silent power armour. A bronze skull mask riveted to his own skull. The eye sockets are fused into one opening holding a crystal orb, which he says is “the [[aphelion|Aphelion]]” and “not a lens”.\n• “I have no Chapter… for [[m_legion|I am Legion]]” (suggests the Alpha Legion; not stated).\n• Infiltrated the Damocles Conclave two decades earlier; Grand Master [[escher|Escher]] was his agent.\n• Escorts [[farsight|Farsight]]; controls [[ujurakh|Ujurakh]]; heals [[mordaine|Mordaine]].\n• Says he fights for “the greater Greater Good” against “the Primordial Annihilator” (Chaos).\n\nProbably the “one-eyed ancient” of _Requiem Infernal_'s afterword and [[gharth|Gharth]]'s “one-eyed herald” (strong inference).","dw":["FI","RI","CHS"]},{"id":"farsight","n":"O'Shovah (Farsight)","t":"person","c":"inq","w":["FI"],"d":"Commander Farsight, travelling as the Calavera's “prisoner” in _Fire and Ice_. Admits his identity. He and [[calavera|the Calavera]] are on the vash'yatol (a long walk between worlds). The Calavera calls him Mont'shasaar, “the Terror That Burns Dark”. When Farsight says that is not his name, the Calavera answers: “Not yet and perhaps never.” Farsight says he walks to decide what he will do after he has won. Says “[[m_goes|So it goes]]”.","dw":["FI"]},{"id":"ujurakh","n":"Ujurakh Sourblood","t":"person","c":"inq","w":["FI"],"d":"Kroot shaper in _Fire and Ice_. [[calavera|The Calavera]] fed him a captured Possessed (described as coral-fleshed with pincers), which got him expelled from his kindred and left his mind bound to the Calavera. Cuts loose a carriage from the train; is shot and falls, but survives on [[oblazt|Oblazt]].","dw":["FI"]},{"id":"iwujii","n":"Iwujii Sharks","t":"faction","c":"inq","w":["FI","FC"],"d":"Imperial Guard regiment from Iwujii Secundus. Religion includes Grandfather Death and Father Terra.\n\n• _Fire Caste_: “Jungle Sharks”, pinned down in [[phaedra|Phaedra]]'s Mire.\n• _Fire and Ice_: Third Company, under the unstable Captain Uzochi, escorts the train on [[oblazt|Oblazt]]. [[omazet|Omazet]] is one of its lieutenants.","dw":["FI","FC"]},{"id":"voyle","n":"Ulver Voyle","t":"person","c":"phaedra","w":["GE"],"d":"Former member of the Eleventh [[exordio|Exordio Void Breachers]]. Boarded the derelict _Halvorsen_ near [[kliest|Kliest]]; kissed by a genestealer (circular scar under the jaw). Survived three months in a silo by eating a squadmate. Recovered by the tau; became a gue'vesa (human auxiliary).\n\nIn _The Greater Evil_ the [[cogeternal|Cog Eternal]]'s Patriarch can only partly control him because a different brood infected him. When it takes over, he kills himself by driving a truck into a building.","dw":["GE"]},{"id":"exordio","n":"Exordio Void Breachers","t":"faction","c":"ring","w":["RI","GE"],"d":"Imperial Guard boarding regiment.\n\n• Darkstar Company (_Requiem Infernal_): destroyed at [[aphelion|the Razor]]; survivors including [[feizt|Feizt]] reach the [[vytarn|Koronatus Ring]].\n• Eleventh, Squad Indigo (_The Greater Evil_, backstory): boarded the _Halvorsen_; [[voyle|Voyle]] was implanted.","dw":["RI","GE"]},{"id":"providence","n":"Providence & Trinity","t":"place","c":"prov","w":["RI","FC"],"d":"Homeworld of the [[arkan|Arkan]]. Pre-Imperial industrial republic (the Arkan Union) that had officially declared its gods dead. Conquered by the Imperium about two centuries before _Fire Caste_ in the crusade led by [[deliverance|Father Deliverance]], with [[asenath|Asenath]] and [[resplendent|Angels Resplendent]] (_Requiem Infernal_).\n\nTrinity: frontier township (population 487). Rainbow-lit temple; scrap sculptures in exact geometric piles; a [[bell|daemon bell]] inscribed “The bell tolls, the world unfolds”. Site of the confrontation with [[darkman|the scarred dark man]]. Covered up by the authorities.","dw":["RI","FC"]},{"id":"arkan","n":"19th Arkan Confederates","t":"faction","c":"prov","w":["FC"],"d":"Imperial Guard regiment from [[providence|Providence]]. Shipped to [[phaedra|Phaedra]] after the Trinity incident was covered up. Commander: [[cutler|Cutler]]. Members include [[iverson|Iverson]], [[templeton|Templeton]], [[roach|Roach and Van Hal]].\n\nThe surname of [[etelka|Etelka Arkanto]] may refer to the Arkan.","dw":["FC"]},{"id":"sunken","n":"Sunken Worlds","t":"place","c":"ring","w":["FC","CSD","CT"],"d":"Group of ocean worlds including Lethe (or Lethea), Verzante, Szilar, Cantico and Ctholl.\n\n• Lethe supplies the Imperial fleet, the Penitents and [[gurdjief|Confessor Gurdjief]] in _Fire Caste_. Lethean creed: “[[m_condemns|The Emperor condemns]].” The epigraphs of _The Crown of Thorns_ are from the Lethean Revelation.\n• Recruiting ground of the [[blackflags|Black Flags]].","dw":["FC","CSD","CT"]},{"id":"m_lie","n":"“It's a lie”","t":"motif","c":"motif","w":["NB","NF","FC","FI","WF","CHS","NN"],"d":"Recurring phrase. Used by:\n• [[chel|Skreech]], as graffiti (“ITZ A LY”) (_Nightbleed_).\n• Haz'thur: “Your Long War is a lie” (_Nightfall_).\n• [[malvoisin|Malvoisin]], wounded on [[sarastus|Sarastus]] (_The Walker in Fire_).\n• [[iverson|Iverson]], to [[abel|Abel]] as the ship enters the warp (_Fire Caste_).\n• [[darkman|The scarred dark man]], to [[mordaine|Mordaine]] (_Fire and Ice_).\n• [[gharth|Gharth]], about [[vytarn|Redemption]] (_Cast a Hungry Shadow_).\n• [[bosch|Bryn Bosch]]: “That's a lie. That's not how it went down” (_Nightshift Nineteen_).\n\nIt originates as a Sarastus creed.","dw":["NB","NF","FC","FI","WF","CHS","NN"]},{"id":"m_within","n":"“As within, so without”","t":"motif","c":"motif","w":["RI","CSD","SB","AA","NB","AM","NN"],"d":"Often paired with “As above, so below”. Used by:\n• The [[arc|Arc Resplendent]] ([[athanazius|Athanazius]], [[verlaine|Verlaine]]).\n• [[vedas|Vedas]]; engraved on the VLG barrel on [[sarastus|Sarastus]].\n• The [[spiraldawn|Spiral Dawn]]'s liturgy.\n• The [[canopic|Canopic Congregation]] of Carceri (“As above, so below”); in _Nightshift Nineteen_ it closes their canticle. [[mothersneddon|Mother Sneddon]] preaches seeing “the Inside clear” and cleaning up “the Outside”.\n• The [[polycaptain|Polyphemus captain]], who doesn't know where he heard it.","dw":["RI","CSD","SB","AA","NB","AM","NN"]},{"id":"m_chance","n":"“Nothing is chance”","t":"motif","c":"motif","w":["RI","CSD","FC","SB","AA"],"d":"Used by [[vedas|Vedas]], [[satori|Satori]], [[athanazius|Athanazius]], [[cross|Cross]] and [[talasca|Talasca]]. [[iverson|Iverson]]'s version: “Nothing is chance or else chance is broken.”","dw":["RI","CSD","FC","SB","AA"]},{"id":"m_circle","n":"“The circle closes”","t":"motif","c":"motif","w":["RI","GE"],"d":"[[jonah|Jonah]]: “The circle closes, then spins anew” (his time-looped bullet). Bhoral's last words in _The Greater Evil_. Genestealer implantation leaves circular scars ([[voyle|Voyle]]).","dw":["RI","GE"]},{"id":"m_goes","n":"“So it goes”","t":"motif","c":"motif","w":["SB","FI","AM","AA"],"d":"Used by [[athanazius|Athanazius]], [[satori|Satori]], [[farsight|Farsight]], the [[polycaptain|Polyphemus captain]] and [[verlaine|Verlaine]].","dw":["SB","FI","AM","AA"]},{"id":"m_wings","n":"“We rise on burning wings”","t":"motif","c":"motif","w":["RV","RI","CT","SB","WF","AA"],"d":"Battle cry of the reformed [[resplendent|Angels Resplendent]]. Used by [[athanazius|Athanazius]] (facing [[purge|the Purge]]), [[malvoisin|Malvoisin]] (in the Deathwatch) and [[verlaine|Verlaine]]. [[satori|Satori]]'s private inversion: “We descend on torn wings.”","dw":["RV","RI","CT","SB","WF","AA"]},{"id":"m_unfold","n":"Unfolding","t":"motif","c":"motif","w":["FC","CSD","GE"],"d":"• Trinity's bell: “The bell tolls, the world unfolds” (_Fire Caste_).\n• [[spiraldawn|Spiral Dawn]] congregations: “the Unfolded”.\n• [[cogeternal|Cog Eternal]]'s hive: “the [[yuxa|Unfolding Nexus]]”.","dw":["FC","CSD","GE"]},{"id":"m_mirror","n":"Mirrors","t":"motif","c":"motif","w":["OC","RI","RV","TP","SB"],"d":"• [[jhikaara|Jhi'kaara]]: “the mirror”, then “the broken mirror”.\n• [[jonah|Jonah]]: “Mirror Breaker”; carries mirror shards.\n• The Angels' aspirant trial: the Mirrored Path.\n• [[satori|Satori]]'s mirror; the [[mirror|Mirror of Athanazius]].\n• [[rathana|Rathana]]'s “mirror-brother”.","dw":["OC","RI","RV","TP","SB"]},{"id":"m_legion","n":"“I am / We are legion”","t":"motif","c":"motif","w":["FI","NB"],"d":"[[calavera|The Calavera]]: “I have no Chapter… for I am Legion.” The Needleman ([[chel|Chel]]): “We are legion.”","dw":["FI","NB"]},{"id":"m_eye","n":"One eye","t":"motif","c":"motif","w":["FI","CHS","RI","FC","AM"],"d":"[[calavera|The Calavera]]'s single crystal orb. [[gharth|Gharth]]'s “one-eyed herald”. The “one-eyed ancient” of _Requiem Infernal_'s afterword. [[darkman|The scarred dark man]]'s dead eye. The gunboat _Polyphemus_ (named for the cyclops).","dw":["FI","CHS","RI","FC","AM"]},{"id":"tristesse","n":"Tristesse","t":"entity","c":"angels","w":["RI","RV","CT"],"d":"The name is used twice.\n• The River Tristesse at Kanvolis on [[malpertuis|Malpertuis]]. Few Space Marines can swim it (_The Crown of Thorns_). The [[martyr|Undying Martyr]] crawls out of it.\n• Tristesse, a bolt pistol (_Requiem Infernal_). A relic of the [[thorn|Thorn Eternal]], given by the Canoness Excruciant to [[deliverance|Father Deliverance]], who passed it to [[asenath|Asenath]] (“It means sorrow”). Asenath gives it to the boy [[athanazius|Athanazius]] on the Watchspire's bridge: “She is yours now, but never forget that you are also hers.”\nNo connection between the two is stated.","dw":["RI","RV","CT"]},{"id":"absolution","n":"Absolution Company","t":"faction","c":"angels","w":["TP"],"d":"Company of the [[penitent|Angels Penitent]] tasked with finding and destroying (“redacting”) the artworks of the old [[resplendent|Angels Resplendent]] across the Imperium. Ship: the strike cruiser _Severance of Glory_. Ranks and groups include Redactors, Thornguard, and the Muted (tongueless brothers who communicate by clicks).\n\nIn _The Thirteenth Psalm_ a squad under [[rathana|Rathana]] retrieves the [[mirror|Mirror of Athanazius]] from [[oblazt|Oblazt]]. Several of its members are shown to have kept painting in secret.","dw":["TP"]},{"id":"crown","n":"The Crown of Thorns (council)","t":"faction","c":"angels","w":["CT","TP","SB"],"d":"Ruling council of the [[penitent|Angels Penitent]], made up of Chaplains Castigant. Members wear iron skull masks riveted to their skulls; [[malvoisin|Malvoisin]] was the first to rivet his. The council replaced the Chapter Master's authority while [[czervantes|Czervantes]] was declared lost.\n\nNot to be confused with the story _The Crown of Thorns_, which is named after it.","dw":["CT","TP","SB"]},{"id":"paladins","n":"Paladins Luminous","t":"faction","c":"angels","w":["RV","SB"],"d":"Secret inner circle of mystics in the [[resplendent|Angels Resplendent]], serving the [[arc|Arc Resplendent]]. Members do not age while connected to the [[reverie|Reverie]] and are exempt from memory conditioning. Known members: [[satori|Satori]], Zorastro, and secretly [[athanazius|Athanazius]]. They speak of history as “spins of the Great Wheel”.","dw":["RV","SB"]},{"id":"arc","n":"The Arc Resplendent","t":"entity","c":"angels","w":["RV","SB","AA"],"d":"The text written by [[castaneda|Castaneda]] that replaced the Codex Astartes for the [[resplendent|Angels Resplendent]]. It is part doctrine and part riddle; its most hidden passages are read only by the [[paladins|Paladins Luminous]]. [[athanazius|Athanazius]] says those passages required the Chapter's fall.\n\nRecurring formulas from it: “As above, so below… [[m_within|As within, so without]]… [[m_goes|So it goes]].” [[verlaine|Verlaine]] quotes it repeatedly in _Aria Arcana_.","dw":["RV","SB","AA"]},{"id":"mirror","n":"Mirror of Athanazius","t":"entity","c":"angels","w":["TP"],"d":"Mirror forged by [[athanazius|Athanazius]] in the Librarium. It has a silver wave-patterned frame, cannot be broken from the front, and shows the truth of a soul more clearly than reality. Found in the mansion of [[esseker|Konteza Esseker]] in Zakhalin on [[oblazt|Oblazt]] and retrieved by [[rathana|Rathana]] in _The Thirteenth Psalm_. In it Rathana sees and speaks to his “mirror-brother”.","dw":["TP"]},{"id":"purge","n":"The Great Purge","t":"event","c":"angels","w":["CT","SB"],"d":"The destruction of the [[resplendent|Angels Resplendent]]'s art and Librarium at [[malpertuis|Kanvolis]], within about two years of the [[martyr|Undying Martyr]]'s arrival (_The Sins of My Brothers_ is set “scarcely two years” after it, after the Purge). Led by [[malvoisin|Malvoisin]]. [[athanazius|Athanazius]] and his Librarians met the zealots unarmoured and were killed. Afterwards the Chapter became the [[penitent|Angels Penitent]].\n\nAccording to _The Sins of My Brothers_, Athanazius had deliberately prepared the conditions for it.","dw":["CT","SB"]},{"id":"caravaggio","n":"Yukio Caravaggio","t":"person","c":"angels","w":["RV"],"d":"Born Andrei Vyntala. Former Knight Exemplar of the [[rhapEternal|Rhapsody Eternal]]. Corrupted by the painting “[[aphelion|Aphelion]]”, bought from [[esseker|Alina Esseker]]. Killed Chaplain Haas and two Librarians. Kept caged aboard the _Persistence of Vision_. Borges's verdict: there is no daemon inside him except his own.","dw":["RV"]},{"id":"darkcoil","n":"The Dark Coil (Talasca's painting)","t":"entity","c":"ring","w":["CSD"],"d":"The swirling pattern Colonel [[talasca|Talasca]] paints across the walls of his tower on [[vytarn|Redemption]] in _Cult of the Spiral Dawn_. He believes it maps the hidden pattern behind events. He sees a face in it, described as noble and malevolent, “elevated and tormented by the sea of thorns it ruled and rued”, and hears a voice from it: reality is only the illusion that prevails; mind, not matter.\n\nReaders adopted “the Dark Coil” as the name for Fehervari's whole interconnected setting. Compare the [[coil|Dolorosa Coil]] on [[phaedra|Phaedra]], which is unrelated in-story.","dw":["CSD"]},{"id":"incarnates","n":"Seven Virtues Incarnate","t":"entity","c":"ring","w":["RI"],"d":"Constructs made by the Bronze Candle palatines of the [[lastcandle|Last Candle]] to embody the sect's Seven Virtues in flesh and machine. The palatine Akaishi Bhatori built them.\n\n• [[tornprophet|Torn Prophet]] (Veritas): built from a dismantled tech-priest.\n• Blind Watchman (Vigilans): [[feizt|Feizt]] after death (Nurgle).\n• Harrowed Artisan (Humilitas): Bhatori herself, revived (Nurgle). [[athanazius|Athanazius]] was originally intended for this role.\n• Others: Bleeding Angel, Penitent Knight, Burning Martyr, Mute Witness.\nIn _The Reverie_, Idryss Glass ends as a silver “penitent knight”, an echo only.","dw":["RI","RV"]},{"id":"vlg","n":"VLG-01","t":"entity","c":"sarastus","w":["NB"],"d":"Food additive in _Nightbleed_. Tarry black liquid. Passes every toxicology test but is psychoactive: it causes vivid nightmares, aggression and visions, and in concentrated form physical transformation. Supplied from an ancient rune-banded barrel engraved “[[m_within|AS WITHIN, SO WITHOUT]]”, on a requisition signed “Vedas” (see [[vedas|Olber Vedas]]). [[chel|Chel Jarrow]] approves it for distribution to [[sarastus|Carceri]]'s poor.\n\n“VLG” is never expanded.","dw":["NB"]},{"id":"blacksun","n":"The Black Sun / Black Star","t":"entity","c":"sarastus","w":["NF"],"d":"Anomaly in _Nightfall_: a rift in space that reality contains as a black star radiating poisonous light. It corrodes a planet's soul. Its “dawn” every 13 years brings the [[nightlords|Night Lords]] to [[sarastus|Sarastus]]. [[yehzod|Yehzod]] studies it; it fed the growth of [[needle|the Needle]]. Associated with [[truenight|True Night]].","dw":["NF"]},{"id":"truenight","n":"True Night","t":"event","c":"sarastus","w":["RI","NF","NB","NN"],"d":"Darkness that falls on [[sarastus|Sarastus]].\n• _Nightfall_ describes it as recurring: “True Night had touched Sarastus three times”, and four of the five hives are dead. It is also the name of the cult that governs Carceri (“The Blind and the Bound”, _The Revelations of True Night_); Haz'thur sets it against the Long War.\n• _Nightbleed_ ends with it approaching.\n• _Requiem Infernal_: [[jonah|Jonah]]'s sister dies on its first night. Those who die in it (the “Sacred Damned”) do not decay.\n• _Nightshift Nineteen_: set before it. The dome's Sunlights are failing one by one.","dw":["RI","NF","NB","NN"]},{"id":"unity","n":"The Unity revolution","t":"event","c":"inq","w":["FI","TP"],"d":"Uprising on [[oblazt|Oblazt]] inspired by the tau. Its members call themselves “the Many of One” and wear blue concentric circles on the forehead. It wrecks the Vyshodd Anchor Hive in _Fire and Ice_. _The Thirteenth Psalm_ takes place in the city of Zakhalin during the same revolution.","dw":["FI","TP"]},{"id":"bell","n":"The daemon bell of Trinity","t":"entity","c":"prov","w":["FC","FI"],"d":"Bell in the temple of Trinity on [[providence|Providence]], inscribed “THE BELL TOLLS, THE WORLD UNFOLDS”. It “carries the blight of [[phaedra|Phaedra]]”. Kjordal cuts its chain during the fight with [[darkman|the dark man]]. [[iverson|Iverson]] hears a bell as he dies; in _Fire and Ice_ the dark man is pulled away to a place where a daemon bell rings.","dw":["FC","FI"]},{"id":"abel","n":"Shas'el Aabal ('Abel')","t":"person","c":"phaedra","w":["FC","AM"],"d":"Tau fire caste commander on [[phaedra|Phaedra]]; the Imperials call him Abel.\n• _Altar of Maws_: cadre commander of [[jhikaara|Jhi'kaara]]'s convoy.\n• _Fire Caste_: betrays [[seishin|O'Seishin]] to restart a real war, kills Sky Marshal Kircher, and is killed by [[iverson|Iverson]] aboard the [[requiemship|Requiem of Virtue]].","dw":["FC","AM"]},{"id":"ariken","n":"Ariken Skarth","t":"person","c":"ring","w":["CSD"],"d":"Pilgrim from Khostax who becomes a medicae and [[omazet|Omazet]]'s aide in _Cult of the Spiral Dawn_. Gutted by the cult's Primus. A voice calling itself “[[vytarn|Redemption]]” ([[aveline|Aveline]]) asks if she wants to live. She wakes in the [[underspire|Underspire]] and is told to rise in the Crucible Aeterna. She sees earlier keepers of the Ring, including an Angel Resplendent, and is told: “We who watch over Redemption do not watch alone.”","dw":["CSD"]},{"id":"kreeger","n":"Franz Kreeger","t":"person","c":"inq","w":["FI"],"d":"Former storm trooper (Cadian Gate) who served on [[escher|Escher]]'s Inquisition taskforce to [[phaedra|Phaedra]]. In _Fire and Ice_ he works for [[calavera|the Calavera]]. Killed by a harpoon.","dw":["FI"]},{"id":"m_condemns","n":"“The Emperor condemns”","t":"motif","c":"motif","w":["FC","CT"],"d":"First Psalm of the Lethean Revelation; creed of the [[sunken|Lethean]] Penitents. Used by [[gurdjief|Gurdjief]] in _Fire Caste_, by [[martyr|the Undying Martyr]], and by [[malvoisin|Malvoisin]] when he orders the attack on the Librarium.","dw":["FC","CT"]},{"id":"izaq","n":"Izaq Sneddon","t":"person","c":"sarastus","w":["NN"],"d":"Protagonist of _Nightshift Nineteen_. Raised by [[mothersneddon|Mother Sneddon]] in a basement apartment in [[barka|Barka Tower]], [[sarastus|Hive Carceri]]. After five years' training with the [[canopic|Canopic Congregation]] he is ordained Apprentice Lightkeeper and assigned to Nightshift 19 under [[bosch|Bryn Bosch]].\n\n• Avoids stepping on cracks, and bites the inside of his cheek until it bleeds as penance when he breaks one of his own rules. (In _Nightbleed_, Skreech bites his tongue as penance.)\n• Reads numbers as omens, as his mother taught him. “19” is “the Violator”, the most dangerous number of all.\n• As a boy he killed vermin, stray dogs and finally a vagrant in failed rituals to wake a psychic gift like his mother's.\n• His mother carved “PURITY” into his back when he turned thirteen.\n• At eleven he investigated the murder on floor 131 of his tower (see [[chel|Chel Jarrow]]) and entered apartment 19, where he met what he calls [[nineteen|Nineteen Ascendant]]. He came away knowing he “must become a keeper of the lights, for better and for worse”.\n• His crew number is 19. In the lift up to the sling station a spiderlike thing strips one of his fingers to the bone. He denies that it is real and decides the finger is intact “on the Inside”. When Bosch shakes his hand, it feels as if a finger is missing.\n• On why he joined: “Something inside me… It's always wanted the stars… I don't think I ever had a choice.”","dw":["NN","NB"]},{"id":"mothersneddon","n":"Mother Sneddon","t":"person","c":"sarastus","w":["NN"],"d":"[[izaq|Izaq Sneddon]]'s mother, known in the tower as the “crazy lady downstairs”, of [[barka|Barka Tower]]. Appears in _Nightshift Nineteen_ only in Izaq's memories and as a voice in his head.\n\n• Psychic. She moves objects without touching them and can make people obey. After “a word” from her, a gang that had moved into the tower leapt from the top floor.\n• Worships the “Golden God-Emperor”. Teaches that time “don't run in a straight line”: on the “Inside” everything happens at once, and the righteous must “clean up the Outside”.\n• Teaches Izaq number omens, and how to banish phantoms through “Conviction”.\n• Becomes addicted to [[vita|Vita Ephemera]] and builds a shrine to the brand's can-built mascot. By the time Izaq leaves she is enormous and cannot walk, served by followers from across the block whom she has bound with her gift. Izaq wonders “who was their true god”.\n• Her sayings include “So it flows”, “Accursed are the meek!” and “Seeing don't gotta mean believing… Outside ain't always In.”","dw":["NN"]},{"id":"bosch","n":"Bryn Bosch","t":"person","c":"sarastus","w":["NN"],"d":"Shift chief of Nightshift 19 in _Nightshift Nineteen_. Has spent thirty-three years “walking the sky” for the [[canopic|Canopic Congregation]]. His wife Beah paints. He promises that every tour will be his last.\n\nCrew: Frye (“gramps”), Sztan Vlodek (the exterminator) and, until the previous tour, Renny. Each tour also carries a Sanitary Priest.\n\n• On the last tour, Renny and the Sanitary Priest Brother Pleyl died in the socket shrine of a dead [[sunlights|Sunlight]]. Bosch reported that the shrine had collapsed. In his memory, lurks swarmed them, Renny burned them blindly and set Pleyl alight, and Pleyl sank in the coolant pool.\n• Renny's ghost now haunts him: “There's worse coming our way”, “Kill your light and you'll see it too”, “Darkness calls to darkness”.\n• A drawing in the watchtower lift (see [[nineteen|Nineteen Ascendant]]) shows him a second version: no lurks, a black core that takes Renny, and the pool swallowing Pleyl without a ripple. Bosch feels the drawing is rewriting not only his memory but the past itself.\n• Ends the story believing “This is my last shift”.","dw":["NN"]},{"id":"canopic","n":"The Canopic Congregation","t":"faction","c":"sarastus","w":["NB","NN"],"d":"Order of priests, adepts, administrators and labourers who maintain the dome of Hive Carceri on [[sarastus|Sarastus]] and its [[sunlights|Sunlights]]. Its credo is “[[m_within|As above, so below]]”. Carceri is nominally ruled by a council of industry magnates, but they rarely question the Congregation: “Everyone knew who kept the Sunlights burning.”\n\n• _Nightbleed_: [[chel|Chel]]'s husband Lyle is a minor functionary who preaches “The Balance”.\n• _Nightshift Nineteen_: its seat is the pentagonal Cathedral of Ablution. Ten Canopic Deacons, masked and said to be mostly machine, each oversee a district and answer to the “eternal Arch Deacon”. Lightkeepers in orange coveralls work eighty-day tours inside the dome, reached by sky slings (jet-propelled capsules on vertical tracks) from five watchtowers in each district. Each crew carries a Sanitary Priest (“Nit”). The order's symbol is an open hand with a star in its palm; the star turns into an eye.\n• Its “dirtiest secret”, according to [[bosch|Bosch]]: nobody knows how to repair the Sunlights. The districts' “Night Zones” of perpetual darkness are walled off with promises of repairs that never come.","dw":["NB","NN"]},{"id":"sunlights","n":"The Sunlights","t":"entity","c":"sarastus","w":["NB","NN"],"d":"Artificial suns set in a curved grid across the dome of [[sarastus|Hive Carceri]], dimmed at night. Kept by the [[canopic|Canopic Congregation]].\n\n• _Nightbleed_: blackouts are increasing. In the [[chel|Needleman]] myth, needles of darkness live in the dome's cracks and come out when the sunlights dim.\n• _Nightshift Nineteen_: many Sunlights are dead, some in clusters of three or four. Each has a “socket shrine” above it, with a plasma core in a pool of coolant. Most districts now have “Night Zones” of perpetual darkness, walled off by the Congregation. Lightkeepers sense darkness “growing” in the dome's tunnels. Nobody knows how to repair them.\n\nTheir failure presumably ends in [[truenight|True Night]]; the stories don't say so directly.","dw":["NB","NN"]},{"id":"vita","n":"Vita Ephemera","t":"entity","c":"sarastus","w":["NB","NN"],"d":"Grey protein gruel fed to [[sarastus|Carceri]]'s poor.\n\n• _Nightbleed_: the base stock of Potton Vitapax, where [[chel|Chel]] works. Piped in from underground and refined into countless products; rumoured not to be entirely synthetic. Chel sees the dead in its vats. [[vlg|VLG-01]] is a new additive submitted to the same plant.\n• _Nightshift Nineteen_: sold in “cheerily labelled cans”. [[mothersneddon|Mother Sneddon]] is addicted; it turns her teeth grey and her body swells “like the gruel that nourished it”. Izaq calls it “slow poison”, and thinks: “That filth made you stronger, mother.”","dw":["NB","NN"]},{"id":"barka","n":"Barka Tower","t":"place","c":"sarastus","w":["NB","NN"],"d":"Hab-tower in Hive Carceri on [[sarastus|Sarastus]].\n\n• _Nightbleed_: [[chel|Chel Jarrow]] and her husband Lyle live on the 131st floor. The fire-gutted top seven floors (“The Warren”) are full of squatters. Black drawings appear on its walls: a spiny flower-mandala with a vertical eye, and a multi-jointed figure. Chel becomes the Needleman in a corridor and kills Lyle in their bed. She means to claim the derelict heights next, “taking some as worshippers, others as sacrifices”.\n• _Nightshift Nineteen_: [[izaq|Izaq Sneddon]] grows up in a basement apartment with [[mothersneddon|Mother Sneddon]], who gathers followers from the block. A man is butchered in his bed on floor 131 and his wife disappears; the Law Keepers (Warden Shreve) investigate and seal the apartment, number 19. The flower drawing grows on its door and “around the tower”.","dw":["NB","NN"]},{"id":"nineteen","n":"Nineteen Ascendant","t":"entity","c":"sarastus","w":["NB","NN"],"d":"What [[izaq|Izaq Sneddon]] calls the presence he met at eleven in apartment 19, floor 131, [[barka|Barka Tower]]: “the shadow of Nineteen Ascendant”.\n\n• Seen as a spider, or as a flower, or as “the shattered pieces of a man reassembled into a spider. Or a spider straining to be a man.” Its voice is like “nails rending metal”.\n• Its sign is a spiny black flower drawn in fine strokes, with an eye (or a mouth) at its centre. The sign appears on the sealed door of apartment 19, around the tower, and in the watchtower lift, where it rewrites [[bosch|Bosch]]'s memory of Renny's death.\n• It recites the Needleman's rhyme: “Will you, won't you bleed to feed the night?”\n• It waits “within” Izaq “for the day when he'll grow up and carry it to the stars it loathes”, wanting “a way to make darkness and doubt last forever”.\n\nConnection to _Nightbleed_: the flower matches the spiny mandala with a vertical eye drawn in Barka Tower, and the body matches the multi-jointed figure that [[chel|Chel]] becomes. _Nightbleed_ also treats the Needleman as the imitation of a greater “supernal entity”. Whether Nineteen is Chel, that entity, or both is not stated.","dw":["NB","NN"]},{"id":"m_flows","n":"“So it flows”","t":"motif","c":"motif","w":["RV","SB","AM","NB","NN"],"d":"Refrain. Used by:\n• The Postludium of _The Reverie_, ending “So it flows and always will, until the Wheel of Fate is broken”.\n• [[athanazius|Athanazius]]'s ritual chant in _The Sins of My Brothers_, alongside “So mote it be” and “So it goes”.\n• Tal'hanzo, in _Altar of Maws_.\n• Skreech as the [[chel|Needleman]], in _Nightbleed_: “So it flows… Until all the world's bled dry.”\n• [[mothersneddon|Mother Sneddon]], [[izaq|Izaq]] and [[nineteen|Nineteen]], in _Nightshift Nineteen_, where it is also a line of the Canopic canticle.\n\nCompare [[m_goes|'So it goes']].","dw":["RV","SB","AM","NB","NN"]}];
const LINKS=[["templeton","cross","C","id","Stated in the text: the voice in the bronze icon and the [[spiralfather|Spiral Father]] both call Cross “Ambrose Templeton”. Consistent details: left hand infected by a parasite on a jungle world; former scholar and poet; swears by the Seven Hells; repeats the verse from Templeton's notebook (“Damned if you do… All's one”). He left [[phaedra|Phaedra]] through the coral temple.",["FC","CSD"]],["gurdjief","martyr","S","id","Not stated, but: both very large and black-haired; the Martyr has a stomach wound matching [[cutler|Cutler]]'s sabre thrust; Gurdjief's last words are “Is this a dream?” and the Martyr's first are “Do I still dream?”; both preach “[[m_condemns|The Emperor condemns]]” ([[sunken|Lethean]] creed). Gurdjief sinks into water on [[phaedra|Phaedra]]; the Martyr emerges from water on [[malpertuis|Malpertuis]].",["FC","CT"]],["iverson","darkman","S","id","Not stated, but: same scar lattice; one dead eye and one augmetic (Iverson loses an eye on [[phaedra|Phaedra]]); [[cutler|Skjoldis]] recognises Iverson as a younger version of the man at Trinity and warns him not to go home; Iverson's words as he dies (“It's a lie”, “[[m_lie|It's all a lie]]”) are the dark man's words to [[mordaine|Mordaine]]; both are associated with a ringing bell.",["FC","FI"]],["tarsem","deliverance","S","id","Not stated, but: identical physical description (copper skin, amber eyes, wooden aquila). [[satori|Satori]] predicts “a darker, farther deliverance” for Tarsem.",["RV","RI"]],["deliverance","vedas","S","id","Vedas's memory fragments in _Requiem Infernal_ include a man betrayed by the woman he bound to a false crusade ([[asenath|Asenath]]) and a blinded man walking into the cold (Deliverance's fate). The name Olber Vedas appears to combine “Veyd” and “Olba” ([[tarsem|Tarsem]]'s surname and nickname).",["RI","RV"]],["escher","mordaine","C","id","Stated in _Fire and Ice_: Mordaine was raised as a host for Escher's mind, which was imprinted into him.",["FI"]],["calavera","tornprophet","S","r","The narrator of _Requiem Infernal_'s afterword (a Torn Prophet) says: “I glimpsed the one-eyed ancient in a parable of fire and ice some years back and he's been tracking me ever since.” The Calavera, of _Fire and Ice_, is one-eyed and ancient.",["RI","FI"]],["castaneda","tornprophet","P","id","Speculative. Castaneda removed himself from space and time ([[satori|Satori]]: “This is where the First Magister tore himself from the thread of being… Or was torn.”). One [[lastcandle|Last Candle]] origin myth describes the Prophet as a fallen Space Marine who defeated a daemon. Satori follows a vision of [[vytarn|the Ring]] believing it is Castaneda's trail.",["RV","SB","RI"]],["montaig","athanazius","S","r","In _The Sins of My Brothers_, Athanazius notes a blunt-faced grey-haired veteran hesitating during [[purge|the Purge]]; the same veteran later kills him. Montaig (_The Crown of Thorns_) stormed the Librarium, was affected by Athanazius's words, and vowed to “make my stand another day”.",["SB","CT"]],["reve","kaul","P","r","Speculative. Caul's Alpha Primus in _Vanguard_ is a woman whose face is hidden behind a mirrored mask and described as horrific; she hates the tau and wonders if she was once a gue'vesa. Reve was shot in the face by [[iverson|Iverson]] in _Fire Caste_.",["FC","VG"]],["chel","sarastus","C","r","_Nightbleed_ is set in Hive Carceri before [[truenight|True Night]].",["NB"]],["marisol","tarsem","C","r","As Euryale she gave Tarsem his winged-eye tattoo before Marisol had met him (time loop through the [[reverie|Reverie]]).",["RV"]],["jonah","sarastus","C","r","Born in Hive Carceri. Twin sister Mina died on the first night of [[truenight|True Night]].",["RI"]],["jonah","vytarn","C","r","Main setting of his story in _Requiem Infernal_.",["RI"]],["jonah","vedas","C","r","Jonah kills Vedas. The bullet travels back in time and becomes the one that scarred Jonah.",["RI"]],["jonah","tome","C","r","Forced to write it.",["RI"]],["jonah","scorched","C","r","His rage creates the Scorched God.",["RI"]],["tome","polycaptain","C","r","_Altar of Maws_'s epigraph is quoted from “Crossing the Mire World”, a section of _The Requiem Infernal_.",["AM"]],["tome","verlaine","C","r","_Aria Arcana_'s epigraph is quoted from “Resplendent Shadows”, a section of _The Requiem Infernal_.",["AA"]],["tome","calaveraC","P","r","Speculative. The Inquisition agent Clavel takes an azure-leather tome from the [[thorn|Thorn Eternal]] vault on Castitas. Not identified.",["CSD"]],["asenath","vytarn","C","r","Born on Vytarn; trained as an Iron Candle Battle Sister there.",["RI"]],["asenath","deadrock","C","r","Sealed inside with Mercy at the end of _Requiem Infernal_.",["RI"]],["asenath","deliverance","C","r","His “Vigilant Paladin” on the [[providence|Providence]] crusade. He named her second personality, Mercy. She blinded him.",["RI"]],["asenath","thorn","C","r","Served as a Thorn Eternal Repentia.",["RI"]],["asenath","athanazius","C","r","Gives him the relic pistol [[tristesse|Tristesse]].",["RI"]],["etelka","asenath","E","r","Both are Sisters on [[vytarn|the Ring]] who are taken over by something: Asenath by Mercy, Etelka by “Redemption's shadow”.",["CHS","RI"]],["vedas","lastcandle","C","r","Inserted himself into the sect's history as the Theologus Exegessor.",["RI"]],["vedas","sarastus","S","r","The [[vlg|VLG-01]] requisition in _Nightbleed_ is signed “Vedas”, and the barrel is engraved with his saying “[[m_within|As within, so without]]”. Implies Vedas, or the same Tzeentchian agency, helped bring about Sarastus's fall.",["NB","RI"]],["vedas","aphelion","E","r","Shared Tzeentch imagery: indigo and silver, crystal discs.",["RI"]],["tornprophet","lastcandle","C","r","Founder.",["RI"]],["lastcandle","vytarn","C","r","Ruled the Ring for about 1,000 years until the storm.",["RI","AA"]],["thorn","vytarn","C","r","The Third Mission guarded the ruined Ring for over three centuries under a covenant with  “the Lays of Vassago”) versus the Night Lord “Vassaago”. One letter apart.",["CSD","NF"]],["gharth","scorched","C","r","Leader of the Scorched Creed, the cult of the Scorched God predicted in _Requiem Infernal_'s afterword.",["CHS","RI"]],["gharth","deadrock","C","r","His axe is cut from the Deadrock; he kneels on it.",["CHS"]],["calavera","gharth","S","r","Gharth was led to the fire by “his god's one-eyed herald” (also called “the ancient”), who promised he would “bring forth annihilating, irrefutable fire”. The Calavera has a single crystal eye and is ancient. In _Fire and Ice_ the voices in [[mordaine|Mordaine]]'s head (the [[escher|Escher]] imprint, which the Calavera controlled) urge him to embrace “an annihilating, irrefutable truth”.",["CHS","FI"]],["needle","gharth","S","r","The Scorched Creed's chant: “The Black Needle unweaves the world.” Broadcast by the Inquisition's corrupted station in _Cult of the Spiral Dawn_.",["CHS","CSD"]],["feizt","exordio","C","r","Breach sergeant, Darkstar Company.",["RI"]],["feizt","vytarn","C","r","Becomes the [[incarnates|Blind Watchman]] on the Ring.",["RI"]],["feizt","aphelion","C","r","[[exordio|Darkstar Company]] was destroyed at the Razor by crystal discs. _The Reverie_ shows an unnamed battle inside the Aphelion's web, swarmed by discs; probably the same one (inference).",["RI","RV"]],["castaneda","resplendent","C","r","Led the Reformation; wrote the [[arc|Arc Resplendent]].",["RV"]],["castaneda","reverie","C","r","Created it through the Ritual of Severance.",["RV"]],["satori","castaneda","C","r","First disciple.",["RV"]],["satori","resplendent","C","r","[[paladins|Paladin Luminous]].",["RV","SB"]],["satori","aphelion","C","r","Hunts in the [[reverie|Reverie]]'s core; calls the web “a cancer of the firmament”.",["RV"]],["satori","vytarn","C","r","Leaves [[malpertuis|Malpertuis]] following a vision of seven spires around a mountain. In _Aria Arcana_ he has chosen Vytarn as the Ninth's garrison and charted the storm in n visor shaped like a five-armed sun. Akuryo's heraldry is a five-armed sunburst.",["AA","GE"]],["czervantes","resplendent","C","r","Chapter Master (“the Knight Resplendent”).",["CT","SB"]],["czervantes","rhapEternal","C","r","Knight Exemplar.",["RV","AA"]],["czervantes","vytarn","C","r","On Vigilans in _Requiem Infernal_; on the Ring in _Aria Arcana_.",["RI","AA"]],["czervantes","athanazius","C","r","Took in the boy Athanazius on [[vytarn|Vytarn]]. Athanazius later manoeuvred him into the Mastership expecting him to fail.",["RI","SB"]],["athanazius","vytarn","C","r","Escaped the [[lastcandle|Last Candle]]'s schola on Vytarn as a boy.",["RI"]],["athanazius","deadrock","S","r","His vision in _The Sins of My Brothers_: himself on an obsidian monolith among seven spires in a lava sea, “where my journey began and must someday end”. Matches the Deadrock.",["SB"]],["athanazius","resplendent","C","r","Chief Librarian. Engineered the Chapter's fall.",["SB","CT"]],["malvoisin","penitent","C","r","Master Chaplain. Credited in _Requiem Infernal_'s epigraph as Chaplain Castigant of the Angels Penitent.",["CT","SB","RI"]],["malvoisin","killteam","C","r","Member.",["WF"]],["malvoisin","sarastus","S","r","Wounded on Sarastus (crown-shaped wound); says “[[m_lie|It's a lie]]… We condemn ourselves”; body disappears. The story's ending connects this to the end of the [[resplendent|Angels Resplendent]].",["WF"]],["malvoisin","martyr","C","r","Spent 19 days with him; proclaimed him a prophet.",["CT"]],["malvoisin","athanazius","C","r","Led the attack on the Librarium during [[purge|the Purge]].",["CT","SB"]],["martyr","malpertuis","C","r","Emerged from the River [[tristesse|Tristesse]] at Kanvolis.",["CT"]],["martyr","penitent","C","r","His teaching is the basis of the Angels Penitent.",["CT"]],["montaig","penitent","C","r","Brother-sergeant.",["CT"]],["rathana","penitent","C","r","Chaplain Castigant, [[absolution|Absolution Company]].",["TP"]],["rathana","athanazius","C","r","Retrieves the [[mirror|Mirror of Athanazius]].",["TP"]],["rathana","esseker","C","r","Finds the Mirror in Konteza Esseker's mansion.",["TP"]],["rathana","oblazt","C","r","Mission to Zakhalin during the [[unity|Unity revolution]].",["TP"]],["esseker","aphelion","S","r","Alina Esseker sold the painting “Aphelion”. The family name is attached to two corrupting Resplendent artefacts (the painting and the Mirror).",["RV","TP"]],["esseker","oblazt","C","r","Konteza Urzelka Esseker lives in Zakhalin on Oblazt.",["TP"]],["tarsem","reverie","C","r","Loses 41 years inside.",["RV"]],["tarsem","obarai","S","r","Noble of the Oberai Oligarchy.",["RV"]],["deliverance","providence","C","r","Led the crusade that conquered Providence.",["RI"]],["deliverance","resplendent","C","r","Angels Resplendent, including [[satori|Satori]], were in his retinue.",["RI","RV"]],["reverie","sarastus","S","r","From the river, [[tarsem|Tarsem]] sees a domed city whose lights are going out one by one into total darkness. Matches Carceri in _Nightbleed_.",["RV","NB"]],["phaedra","yuxa","C","r","Phaedra is in the Yuxa system.",["GE"]],["coil","phaedra","C","r","Region of Phaedra's Dolorosa archipelagos.",["FC"]],["coil","malpertuis","S","r","[[gurdjief|Gurdjief]] sinks in the Coil and reappears in the River [[tristesse|Tristesse]] (if he is [[martyr|the Martyr]]). The Coil's water appears to connect worlds.",["FC","CT"]],["cogeternal","yuxa","C","r","Controls the skyhive; renamed it the Unfolding Nexus.",["GE"]],["voyle","cogeternal","C","r","Partly controlled by its Patriarch (he was infected by a different brood).",["GE"]],["voyle","exordio","C","r","Former member of the Eleventh Exordio Void Breachers.",["GE"]],["voyle","kliest","C","r","Implanted aboard the derelict _Halvorsen_ near Kliest.",["GE"]],["cogeternal","spiraldawn","P","r","Speculative. Parallel details: the Animus-Alpha is “a traveller who became a god”, the [[spiralfather|Spiral Father]] arrived as “the Seeker”; “the [[yuxa|Unfolding Nexus]]” and ,["WF"]],["lem","spiralfather","P","r","Speculative. Lem's specimens: four arms, glossy blue exoskeleton, gills, elongated skull. Compare the four-armed blue-chitin creature in the [[aphelion|Aphelion]] (_The Reverie_) and the indigo Spiral Father.",["WF","RV","CSD"]],["lem","sarastus","C","r","Her lab is in dead Carceri.",["WF"]],["escher","phaedra","C","r","Led an Inquisition taskforce to Phaedra ([[kreeger|Kreeger]] served in it).",["FI"]],["polycaptain","sleeper","C","r","Sacrifices the convoy to wake it.",["AM"]],["sleeper","coil","C","r","The convoy moves from the river into its lake, which is not on any map.",["AM"]],["brinedogs","oblazt","S","r","_Cold Covenant_ (not yet covered here) concerns the 27th Halgarth Brine Dogs on Oblazt.",["AM"]],["kaul","phaedra","C","r","Controls the Diadem refinery.",["FC","VG"]],["roach","kaul","C","r","Rebuilt as skitarii in his cohort.",["VG"]],["roach","arkan","C","r","Troopers of the 19th Arkan.",["FC"]],["reve","iverson","C","r","Shot by him; her ghost appears to him.",["FC"]],["iverson","arkan","C","r","Regimental commissar.",["FC"]],["iverson","requiemship","C","r","Dies fighting [[abel|Abel]] aboard as it enters the warp.",["FC"]],["cutler","arkan","C","r","Colonel.",["FC"]],["cutler","requiemship","C","r","Forces it into the warp with no Navigator.",["FC"]],["cutler","gurdjief","C","r","Kills him.",["FC"]],["cutler","providence","C","r","Fought the [[darkman|dark man]] at Trinity with Skjoldis and Kjordal.",["FC"]],["templeton","arkan","C","r","Captain, 4th Company.",["FC"]],["templeton","coil","C","r","Disappears into a coral temple.",["FC"]],["templeton","needle","E","r","Speaks of “the needle-storm that unstitched time”.",["FC"]],["obarai","arkan","E","r","The 77th Oberai Redeemers defect to the tau on [[phaedra|Phaedra]] during the Arkan's campaign.",["FC"]],["iwujii","phaedra","C","r","Fighting in the Mire.",["FC"]],["iwujii","oblazt","C","r","Third Company escorts the train in _Fire and Ice_.",["FI"]],["requiem
