<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapping the Dark Coil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/CaslonAntique.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"Caslon Antique";src:url("fonts/CaslonAntique.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Caslon Antique";src:url("fonts/CaslonAntique-Italic.ttf") format("truetype");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Caslon Antique";src:url("fonts/CaslonAntique-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Caslon Antique";src:url("fonts/CaslonAntique-BoldItalic.ttf") format("truetype");font-weight:700;font-style:italic;font-display:swap}

:root{
  /* One visual world: the murk of the Coil. Graph on the left, dossier on the right. */
  --bg:#0d1210; --surface:#151c19; --raised:#1c2521; --line:#2b3732;
  --ink:#e8e1cd; --muted:#929c92; --faint:#5f6b64;
  --c-conf:#ece3c9; --c-strong:#e3a43f; --c-spec:#a98ee4; --c-echo:#4fb3a9; --c-motif:#6d7c74;
  --t-person:#d8ceb2; --t-place:#6fa082; --t-faction:#c45a3f; --t-entity:#8676e6; --t-motif:#56635c; --t-event:#c98d5a;
  --display:"Caslon Antique",Georgia,serif;
  --title:"Caslon Antique",Georgia,serif;
  --serif:"Caslon Antique",Georgia,serif;
  --body:"EB Garamond",Garamond,Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.5;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
h1{font-family:var(--title);font-weight:400;font-size:31px;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);margin-left:8px;letter-spacing:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--raised);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;user-select:none}
.chip[aria-pressed="false"]{opacity:.42}
.chip:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--c-strong);outline-offset:2px}
.sw{width:22px;height:0;border-top:2px solid currentColor}
.sw.conf{color:var(--c-conf)} .sw.strong{color:var(--c-strong);border-top-style:dashed} .sw.spec{color:var(--c-spec);border-top-style:dotted;border-top-width:3px} .sw.echo{color:var(--c-echo);border-top-style:dashed;opacity:.8} .sw.motif{color:var(--c-motif)}
select,input[type=search]{font:inherit;font-size:13px;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input[type=search]{width:170px}
main{display:grid;grid-template-columns:1fr 380px;min-height:0}
#graphWrap{position:relative;min-height:0;overflow:hidden}
svg#graph{width:100%;height:100%;display:block;cursor:grab}
svg#graph:active{cursor:grabbing}
.cluster-label{font-family:var(--display);fill:var(--muted);font-size:21px;letter-spacing:.06em;text-anchor:middle;cursor:pointer;opacity:.75}
.cluster-label:hover{fill:var(--ink);opacity:1}
.link{fill:none;stroke-linecap:round;transition:opacity .15s}
.link.C{stroke:var(--c-conf);stroke-width:1.3;opacity:.32}
.link.S{stroke:var(--c-strong);stroke-width:1.6;stroke-dasharray:6 4;opacity:.6}
.link.P{stroke:var(--c-spec);stroke-width:1.8;stroke-dasharray:1.5 4.5;opacity:.7}
.link.E{stroke:var(--c-echo);stroke-width:1.2;stroke-dasharray:3 6;opacity:.5}
.link.m{stroke:var(--c-motif);stroke-width:1;opacity:.45}
.link.id{stroke-width:3.2}
.link.far{opacity:.12}
.link.hi{opacity:1 !important;stroke-width:2.2}
.link.id.hi{stroke-width:3.6}
.node circle{stroke:var(--bg);stroke-width:2;cursor:pointer}
.node.person circle{fill:var(--t-person)} .node.place circle{fill:var(--t-place)} .node.faction circle{fill:var(--t-faction)} .node.entity circle{fill:var(--t-entity)} .node.motif circle{fill:var(--t-motif)} .node.event circle{fill:var(--t-event)}
.node.motif circle{stroke:var(--c-motif);stroke-dasharray:2 2}
.node text{font-family:var(--body);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.motif text{font-family:var(--serif);font-style:italic;fill:var(--muted)}
.node.sel circle{stroke:var(--c-strong);stroke-width:3}
.dim{opacity:.08 !important}
.node.dim text{opacity:0}
.hint{position:absolute;left:12px;bottom:10px;font-size:13.5px;color:var(--faint);pointer-events:none}
.zoombtns{position:absolute;right:12px;bottom:10px;display:flex;gap:6px}
.zoombtns button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-size:16px;cursor:pointer}
aside{border-left:1px solid var(--line);background:var(--surface);display:grid;grid-template-rows:auto 1fr;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:14.5px;padding:10px 4px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c-strong)}
.panel{overflow-y:auto;padding:16px 18px 28px}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 4px;line-height:1.15;text-wrap:balance}
.panel h3{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.panel p{margin:6px 0;max-width:65ch}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.works{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.wtag{font-size:13.5px;padding:2px 7px;border-radius:4px;background:var(--raised);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-family:var(--body)}
.wtag:hover{border-color:var(--muted)}
ul.conns{list-style:none;padding:0;margin:0;display:grid;gap:7px}
ul.conns li{padding:7px 9px 8px;border-left:3px solid var(--line);background:var(--raised);border-radius:0 6px 6px 0}
ul.conns li.C{border-left-color:var(--c-conf)} ul.conns li.S{border-left-color:var(--c-strong)} ul.conns li.P{border-left-color:var(--c-spec)} ul.conns li.E{border-left-color:var(--c-echo)} ul.conns li.m{border-left-color:var(--c-motif)}
.conns a{color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px;cursor:pointer}
.conns a:hover{text-decoration-color:var(--ink)}
.conns .why{font-size:13.5px;color:var(--muted);margin-top:2px}
.conns .src{font-size:13px;color:var(--faint);margin-top:3px}
.pill{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:1px;border:1px solid currentColor}
.pill.C{color:var(--c-conf)} .pill.S{color:var(--c-strong)} .pill.P{color:var(--c-spec)} .pill.E{color:var(--c-echo)} .pill.m{color:var(--c-motif)} .pill.id{color:var(--c-strong)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stat{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.legend{display:grid;gap:6px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:9px}
.worklist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.worklist li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;padding:7px 9px;background:var(--raised);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.worklist li:hover,.worklist li.on{border-color:var(--c-strong)}
.worklist .yr{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.worklist .k{font-size:12px;color:var(--faint)}
.worklist li.unread{cursor:default;border-style:dashed;opacity:.8;grid-template-columns:1fr}
.worklist li.unread:hover{border-color:var(--line)}
.q{padding:9px 0;border-bottom:1px solid var(--line)}
.q b{font-family:var(--serif);font-weight:400;font-size:17px}
.q p{color:var(--muted);font-size:14px}
.tour-card{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.tour-card:hover,.tour-card:focus-visible{border-color:var(--c-strong)}
.tour-card b{font-family:var(--serif);font-weight:400;font-size:18px;display:block}
.tour-card span{font-size:13.5px;color:var(--muted)}
.tour-card i{font-style:normal;font-size:12px;color:var(--faint);float:right;margin-top:4px}
.tours{display:grid;gap:8px;margin:12px 0 6px}
.step-n{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-strong)}
.step-h{font-family:var(--serif);font-size:21px;margin:4px 0 6px;line-height:1.2}
.stepnav{display:flex;gap:8px;margin:14px 0 6px}
.stepnav button{flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:inherit;cursor:pointer}
.stepnav button.primary{border-color:var(--c-strong);background:#2a2416}
.stepnav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:5px;margin:6px 0 10px}
.dots button{width:9px;height:9px;border-radius:50%;border:none;padding:0;background:var(--line);cursor:pointer}
.dots button.on{background:var(--c-strong)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer;font-family:var(--body)}
.fchip:hover{border-color:var(--muted)}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-family:var(--display);color:var(--muted);letter-spacing:.05em}
.lede{font-size:15.5px}
.rich p{margin:8px 0;max-width:65ch}
.rich-list{margin:6px 0 8px;padding-left:20px}
.rich-list li{margin:3px 0}
a.xref{color:var(--ink);text-decoration:underline;text-decoration-color:var(--c-strong);text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
a.xref:hover,a.xref:focus-visible{color:var(--c-strong)}
.why a.xref,.q a.xref{color:inherit}
ul.conns li.ref{border-left-color:var(--c-echo)}
ul.conns li.ref.C{border-left-color:var(--c-conf)} ul.conns li.ref.S{border-left-color:var(--c-strong)} ul.conns li.ref.P{border-left-color:var(--c-spec)}
.rcat{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pill.rC{color:var(--c-conf)} .pill.rS{color:var(--c-strong)} .pill.rP{color:var(--c-spec)} .pill.rT{color:var(--muted)}
.views{position:absolute;left:12px;top:12px;z-index:3;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raised)}
.views button{background:none;border:none;color:var(--muted);font:inherit;font-size:13.5px;padding:7px 14px;cursor:pointer}
.views button[aria-pressed="true"]{background:#2a2416;color:var(--ink)}
#altview{position:absolute;inset:0;overflow-y:auto;background:var(--bg);z-index:2;padding:58px 24px 40px}
#graphWrap.alt .hint,#graphWrap.alt .zoombtns{display:none}
.alt-inner{max-width:860px;margin:0 auto}
.alt-inner h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px}
.alt-inner .lede{color:var(--muted);max-width:72ch}
.era{margin:26px 0 0}
.era-h{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.era-h h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.era-h .when{font-variant-numeric:tabular-nums;color:var(--c-strong);font-size:14px}
ol.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:grid;gap:12px}
.tl-item{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.tl-item::before{content:"";position:absolute;left:-25px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--c-strong);border:2px solid var(--bg)}
.tl-item.unplaced{border-style:dashed}.tl-item.unplaced::before{background:var(--faint)}
.tl-t,.doc-t{font-family:var(--serif);font-weight:400;font-size:18px;display:block}
.dating{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);margin-top:6px;padding-top:5px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:16px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.gate{border:1px dashed var(--line);border-radius:6px;padding:8px 10px;color:var(--muted);font-size:13.5px}
.gate p{margin:0 0 6px}
.reveal{background:var(--raised);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
a.ext{color:var(--c-strong)}
#spoilDlg{position:fixed;inset:0;background:rgba(5,8,7,.72);z-index:50;display:grid;place-items:center;padding:16px}
#spoilDlg[hidden]{display:none}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
.dlg h2{font-family:var(--display);font-weight:400;margin:0 0 6px}
.dlg p{color:var(--muted);font-size:14px}
.spl{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0}
.spl label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
@media (max-width:860px){#altview{padding:58px 14px 30px}.spl{grid-template-columns:1fr}}
.back{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;margin-bottom:8px}
@media (max-width:860px){
  body{overflow:auto;display:block}
  main{grid-template-columns:1fr}
  #graphWrap{height:68vh}
  aside{border-left:none;border-top:1px solid var(--line)}
  .controls{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

</head>
<body>
<header>
  <h1>Mapping the Dark Coil</h1>
  <div class="controls" role="group" aria-label="Filters">
    <button class="chip" id="f-C" aria-pressed="true" data-k="C"><span class="sw conf"></span>Confirmed</button>
    <button class="chip" id="f-S" aria-pressed="true" data-k="S"><span class="sw strong"></span>Strong</button>
    <button class="chip" id="f-P" aria-pressed="true" data-k="P"><span class="sw spec"></span>Speculative</button>
    <button class="chip" id="f-E" aria-pressed="true" data-k="E"><span class="sw echo"></span>Echo</button>
    <button class="chip" id="f-m" aria-pressed="false" data-k="m"><span class="sw motif"></span>Motifs</button>
    <label for="workSel" class="kind" style="margin-left:4px">Work</label>
    <select id="workSel"><option value="">All works</option></select>
    <input type="search" id="search" list="names" placeholder="Find a name…" aria-label="Find a name">
    <button class="chip" id="spoilBtn" aria-haspopup="dialog">Spoilers: showing all</button>
    <datalist id="names"></datalist>
  </div>
</header>
<main>
  <div id="graphWrap">
    <div class="views" role="group" aria-label="View"><button data-v="map" aria-pressed="true">Map</button><button data-v="timeline" aria-pressed="false">Timeline</button><button data-v="docs" aria-pressed="false">Documents</button></div>
    <div id="altview" hidden></div>
    <svg id="graph" aria-label="Network map of characters, places and factions"></svg>
    <div class="hint">Click a dot to read about it · click a region name to zoom in · drag and scroll to move around</div>
    <div class="zoombtns"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit map">⤢</button></div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-tour" aria-selected="true">Start here</button>
      <button role="tab" id="t-dossier" aria-selected="false">Entry</button>
      <button role="tab" id="t-works" aria-selected="false">Works</button>
      <button role="tab" id="t-refs" aria-selected="false">References</button>
      <button role="tab" id="t-open" aria-selected="false">Questions</button>
    </div>
    <div class="panel" id="panel"></div>
  </aside>
</main>
<div id="spoilDlg" hidden role="dialog" aria-modal="true" aria-label="Spoiler settings"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const AUTHOR=[{"s":"tow2019","f":["coil","darkcoil"],"x":"Fehervari calls “the [[darkcoil|Dark Coil]]” the unofficial name for all of his stories. It began on a fan forum, the Bolthole."},{"s":"hho","f":["darkcoil"],"x":"He dropped the term in a few conversations; it spread online and Black Library eventually adopted it."},{"s":"tow2019","f":["coil","darkcoil"],"x":"He describes [[coil|the Coil]] as a tangle of plot threads running across space and time. Characters “slip” from one story into another, sometimes through fissures in reality, which is why [[phaedra|Phaedra]], [[vytarn|Vytarn]], [[sarastus|Sarastus]] and [[oblazt|Oblazt]] keep recurring. He also calls it an expression of Chaos that has got into our universe through the stories."},{"s":"tow2019","f":["coil","darkcoil"],"x":"The concept goes back to the [[coil|Dolorosa Coil]] in _Fire Caste_, where some characters vanished in ways that remain unresolved."},{"s":"hachi2015","f":["coil"],"x":"He glosses the [[coil|Dolorosa Coil]] as “Sorrow's Coil”, an image of the soul's downward spiral: the river's paths twist back on themselves."},{"s":"tow2019","f":["resplendent","penitent"],"x":"Some threads are planned in advance, especially those of the [[resplendent|Angels Resplendent]] and Penitent, but he mostly sees himself as an explorer of [[coil|the Coil]] rather than its architect."},{"s":"tow2019","f":["tome","vytarn","jonah"],"x":"He calls _Requiem Infernal_ the most central Coil story, a “philosophical nexus”, and recommends it as the place to start. It is a tangential prequel to _Cult of the Spiral Dawn_. [[jonah|Jonah]]'s cursed tome is a reality-breaching device and, he says, a metaphor for his own struggle to finish the book."},{"s":"tow2019","f":["vytarn"],"x":"The main literary inspiration for _Requiem Infernal_ was Umberto Eco's _The Name of the Rose_."},{"s":"tow2019","f":["vytarn"],"x":"Several names in _Requiem Infernal_ are deliberately vampiric: the Sisters Camille, Marcilla and Genevieve, and the Breacher Grout."},{"s":"tow2019","f":["exordio"],"x":"The [[exordio|Exordio Void Breachers]] first appeared in _The Greater Evil_."},{"s":"tow2019","f":["resplendent","rhapEternal"],"x":"The [[resplendent|Angels Resplendent]]'s painted shoulder pads go back to _The Crown of Thorns_; he chose each painting while writing the scene it appears in."},{"s":"tow2019","f":["resplendent","verlaine"],"x":"Asked about his next novel in 2019, he said it concerned a faction that is “a key player in the [[darkcoil|Dark Coil]] mythology” and quoted the line “Bright they were, but shadow-bound”. That line, credited to “Resplendent Shadows” in _The Requiem Infernal_, is the epigraph of _Aria Arcana_. The novel was _The Reverie_."},{"s":"tow2019","f":[],"x":"All the stories were commissioned as standalones and can be read in any order, though the [[phaedra|Phaedra]] stories are “definitely best read in chronological order”. Time “doesn't run entirely linearly” in [[coil|the Coil]], and characters can slip backwards."},{"s":"towguide","f":[],"x":"Track of Words' guide extends the chronological reading order Fehervari gave in 2019 to eighteen stories, from _Nightbleed_ to _Cult of the Spiral Dawn_."},{"s":"tow2018","f":["m_within"],"x":"He reads the metaphysics of 40K as a variant of “[[m_within|as above, so below]]”: the warp is “a realm of the mind gone wild”, the gods are formed from mortal emotion, and the soul is the foundation of reality."},{"s":"tow2018","f":["calavera","killteam"],"x":"His favourite Legions are the Thousand Sons and the Alpha Legion."},{"s":"tow2018","f":[],"x":"His influences include H. P. Lovecraft, the horror era of Doctor Who, Alan Dean Foster's _Alien_ novelisation and _The Thing_; more recently Ballard, Robert Aickman, Caitlin Kiernan and VanderMeer's _Annihilation_. He aims for ambiguity on purpose, and admits _Cult of the Spiral Dawn_ needed another hundred pages."},{"s":"hachi2015","f":["coil","phaedra"],"x":"_Apocalypse Now_ was a loose inspiration for the river journey in _Fire Caste_, and he recommends Herzog's _Aguirre, the Wrath of God_. _Heart of Darkness_ was not a direct influence: he dislikes Conrad's style and Kurtz."},{"s":"hachi2015","f":["iverson","darkman"],"x":"In 2015 he said there was “unfinished business” between himself and [[iverson|Iverson]], and that he expected to return to him one day."},{"s":"hachi2015","f":["arkan"],"x":"_Fire Caste_ was pitched as “The Long Road to Hell” and written under the title “Thunderground”. He did not choose the final title."},{"s":"hho","f":[],"x":"Parts of a roleplaying-game setting he created earlier have “seeped into the [[darkcoil|Dark Coil]]”."}];
const AUTHOR_SOURCES={"tow2019":{"t":"Peter Fehervari Talks Requiem Infernal and The Dark Coil","by":"Track of Words","y":2019,"url":"https://www.trackofwords.com/2019/10/04/peter-fehervari-talks-requiem-infernal-and-the-dark-coil/"},"tow2018":{"t":"Peter Fehervari Talks 40k and the Dark Coil – Part One","by":"Track of Words","y":2018,"url":"https://www.trackofwords.com/2018/05/19/peter-fehervari-talks-40k-and-the-dark-coil-part-one/"},"towguide":{"t":"A Traveller's Guide to Peter Fehervari's Dark Coil","by":"Track of Words","y":2020,"url":"https://www.trackofwords.com/2020/10/31/a-travellers-guide-to-the-dark-coil/"},"hachi2015":{"t":"HachiSnax Interviews: Peter Fehervari (Part I)","by":"HachiSnax Reviews","y":2015,"url":"http://hachisnaxreads.blogspot.com/2015/05/hachisnax-interviews-peter-fehervari.html"},"hho":{"t":"The Dark Coil in contact with Gestalt Therapy – First Entry","by":"Horus Heresy Omnibus Project","y":2022,"url":"https://www.heresyomnibus.com/article/gestalt-therapy-and-the-dark-coil-first-entry"}};
const TIMELINE=[{"era":"Deep past","when":"before c. M39.4","items":[{"t":"The Eldar build the Koronatus Ring","w":["RI"],"f":["vytarn"],"x":"The spires' cores are wraithbone. [[vedas|Vedas]] claims [[vytarn|the Ring]] was built to filter spiritual waste from the webway.","d":"Undated; Vedas's claim."},{"t":"The Last Candle is founded","w":["RI"],"f":["lastcandle","tornprophet"],"x":"The [[tornprophet|Torn Prophet]] founds the sect about a thousand years before _Requiem Infernal_.","d":"About 1,000 years before M40.419."}]},{"era":"The Reformation","when":"c. M39.7","items":[{"t":"Castaneda's Reformation","w":["RV"],"f":["castaneda","resplendent","arc"],"x":"[[castaneda|Castaneda]] remakes the [[resplendent|Angels Resplendent]] and writes the [[arc|Arc Resplendent]]: “the Chapter's reformation six centuries ago” (_The Reverie_).","d":"Six centuries before _The Reverie_."},{"t":"The Reverie is created","w":["RV"],"f":["reverie","satori"],"x":"The Ritual of Severance opens the [[reverie|Reverie]]. The boy [[satori|Satori]] kills the raging champion Gyguerre; [[castaneda|Castaneda]] takes him as first disciple.","d":"Relative only."}]},{"era":"Before the fall of the Ring","when":"c. M40.0–M40.4","items":[{"t":"Nightbleed","w":["NB"],"f":["chel","vlg","sarastus"],"x":"[[sarastus|Hive Carceri]] before [[truenight|True Night]]. [[vlg|VLG-01]] enters the food supply. First in the author's reading order.","d":"Author's reading order; no date in the text."},{"t":"Nightshift Nineteen","w":["NN"],"f":["izaq","bosch","nineteen","sunlights"],"x":"Izaq is eleven when the floor-131 murder from the end of _Nightbleed_ happens. The main story follows his five-year apprenticeship, while [[sarastus|Carceri]]'s Sunlights are failing.","d":"Roughly a decade after _Nightbleed_: Izaq is still at home at fifteen, then trains for five years. Not in the author's 2019/2020 reading orders, which predate it."},{"t":"Jonah's sister dies; his hunt begins","w":["RI"],"f":["jonah","truenight"],"x":"Mina dies on the first night of [[truenight|True Night]]. By M40.419 [[jonah|Jonah]] has counted 358 years since “the night his hunt began”.","d":"Hunt began c. M40.06. How long after Mina's death is not stated."},{"t":"The Reverie","w":["RV"],"f":["tarsem","marisol","czervantes","satori"],"x":"[[tarsem|Tarsem Veyd]] enters the [[reverie|Reverie]] and emerges 41 years later, in M40.386.","d":"Dated in the text: M40.386."},{"t":"The Providence crusade","w":["RI"],"f":["deliverance","asenath","providence","resplendent"],"x":"[[deliverance|Father Deliverance]] arrives on [[vytarn|Vytarn]] with [[resplendent|Angels Resplendent]], takes [[asenath|Asenath]] as his paladin, and leads the crusade that crushes the [[arkan|Arkan]].","d":"Before M40.419; after M40.386 if Deliverance is Tarsem."}]},{"era":"The storm","when":"M40.419","items":[{"t":"Requiem Infernal","w":["RI"],"f":["vytarn","jonah","asenath","vedas","feizt"],"x":"The [[vytarn|Koronatus Ring]] is destroyed. [[asenath|Asenath and Mercy]] are sealed in the [[deadrock|Deadrock]]. [[czervantes|Czervantes]] takes in the boy [[athanazius|Athanazius]].","d":"Dated in the text: M40.419."},{"t":"Aria Arcana","w":["AA"],"f":["verlaine","rhapArcane","satori"],"x":"The same storm seen from the [[rhapEternal|Rhapsody Eternal]]. [[verlaine|Verlaine]] becomes the herald of the [[rhapArcane|Rhapsody Arcane]].","d":"Same event."}]},{"era":"After the storm","when":"M40.4 onward","items":[{"t":"Nightfall","w":["NF"],"f":["needle","zeth","nightlords"],"x":"[[truenight|True Night]] has “touched [[sarastus|Sarastus]] three times”. Carceri is the last living hive.","d":"Author's reading order."},{"t":"The Walker in Fire","w":["WF"],"f":["killteam","malvoisin","lem"],"x":"Centuries after Carceri's fall. [[malvoisin|Malvoisin]] is wounded and disappears on [[sarastus|Sarastus]], while the [[resplendent|Angels Resplendent]] still exist.","d":"Author's reading order. Before the Purge."},{"t":"The Undying Martyr arrives; the Great Purge","w":["CT","SB"],"f":["martyr","purge","athanazius","malvoisin"],"x":"The [[martyr|Martyr]] crawls out of the [[tristesse|Tristesse]]. The [[purge|Great Purge]] follows within about two years. If he is [[gurdjief|Gurdjief]], he arrives before his own death on [[phaedra|Phaedra]] in story order, which fits the author's remark that time in [[coil|the Coil]] is not linear.","d":"Relative only."},{"t":"The Sins of My Brothers","w":["SB"],"f":["athanazius","montaig"],"x":"Set “scarcely two years” after [[martyr|the Martyr]]'s arrival. [[athanazius|Athanazius]], living as Carriére, is killed.","d":"About two years after the Martyr."},{"t":"The Crown of Thorns","w":["CT"],"f":["montaig","penitent","crown"],"x":"About a decade after [[martyr|the Martyr]]'s arrival. (The author's reading order places it before _The Sins of My Brothers_; in-story dates put it after.)","d":"About ten years after the Martyr."}]},{"era":"The Phaedran war","when":"Undated; about fifty years","items":[{"t":"The Greater Evil","w":["GE"],"f":["yuxa","cogeternal","seishin","akuryo","voyle"],"x":"The war begins at [[yuxa|Yuxa]] when the tau embassy meets the [[cogeternal|Cog Eternal]].","d":"Author's reading order."},{"t":"Out Caste","w":["OC"],"f":["jhikaara","obarai"],"x":"[[jhikaara|Jhi'kaara]] is scarred on [[obarai|Oba'rai]], before her posting to [[phaedra|Phaedra]].","d":"Author's reading order."},{"t":"A Sanctuary of Wyrms","w":["SW"],"f":["asharil","bunker"],"x":"[[asharil|Asharil]] enters [[coil|the Coil]] and finds the Inquisition bunker.","d":"Author's reading order."},{"t":"Altar of Maws","w":["AM"],"f":["sleeper","jhikaara","brinedogs"],"x":"[[jhikaara|Jhi'kaara]]'s convoy and the [[sleeper|Sleeper Beneath]].","d":"Author's reading order."},{"t":"Trinity","w":["FC"],"f":["providence","bell","darkman","cutler"],"x":"The [[arkan|19th Arkan]] fight the [[darkman|dark man]] at Trinity, and the regiment is shipped off-world.","d":"Shortly before _Fire Caste_."},{"t":"Fire Caste","w":["FC"],"f":["iverson","cutler","templeton","gurdjief","requiemship"],"x":"About fifty years into the war. Ends with the [[requiemship|Requiem of Virtue]] entering the warp.","d":"Relative only."},{"t":"Vanguard","w":["VG"],"f":["kaul","roach"],"x":"The war has stopped without explanation; a warp storm gathers over [[phaedra|Phaedra]].","d":"After _Fire Caste_."}]},{"era":"The Damocles years","when":"c. M41.79 onward","items":[{"t":"Fire and Ice","w":["FI"],"f":["calavera","mordaine","farsight","omazet","unity"],"x":"The [[unity|Unity revolution]] on [[oblazt|Oblazt]], “fifty years” after the Damocles Gulf Crusade. In wider 40K background that crusade is dated 742–745.M41.","d":"Fifty years after the Damocles Gulf Crusade (date from wider 40K)."},{"t":"The Thirteenth Psalm","w":["TP"],"f":["rathana","mirror","esseker"],"x":"The [[absolution|Absolution Company]] retrieves the [[mirror|Mirror of Athanazius]] during the same revolution.","d":"Same revolution."},{"t":"The Black Flags betrayed on Oblazt","w":["CSD"],"f":["blackflags","omazet"],"x":"Another Black Flag regiment betrays the 8th Vassago; [[omazet|Omazet]] saves them. Probably the subject of _Cold Covenant_.","d":"Between _Fire and Ice_ and _Cult of the Spiral Dawn_ (inference)."},{"t":"Cast a Hungry Shadow","w":["CHS"],"f":["etelka","gharth","aveline"],"x":"About eighty years before _Cult of the Spiral Dawn_.","d":"Relative only."},{"t":"Cult of the Spiral Dawn","w":["CSD"],"f":["spiraldawn","talasca","cross","mordaine"],"x":"Last in the author's reading order. The [[thorn|Thorn Eternal]] had watched [[vytarn|the Ring]] “for over three centuries”; the [[calaveraC|Calavera Conclave]] for over a century.","d":"After _Fire and Ice_ (Mordaine is by then a long-serving inquisitor)."}]},{"era":"Not yet placed","when":"","items":[{"t":"Cold Covenant","w":[],"f":["brinedogs","oblazt"],"x":"Not yet covered. Set on [[oblazt|Oblazt]], following the 27th Halgarth [[brinedogs|Brine Dogs]].","d":""},{"t":"Blindsight","w":[],"f":[],"x":"Not yet covered.","d":""}]}];
const DOCS=[{"n":"The Requiem Infernal","k":"Heretical tome","by":"Jonah Tythe (under compulsion)","w":["RI","AM","AA"],"f":["tome","jonah"],"x":"The blue-leather book [[jonah|Jonah]] is forced to write. Its sections are quoted as epigraphs elsewhere: “Crossing the Mire World” (_Altar of Maws_, on [[phaedra|Phaedra]]) and “Resplendent Shadows” (_Aria Arcana_, on the Angels). Fehervari calls it a reality-breaching device."},{"n":"The Arc Resplendent","k":"Chapter codex","by":"Xøren Castaneda, First Magister","w":["RV","SB","AA"],"f":["arc","castaneda"],"x":"The [[resplendent|Angels Resplendent]]'s replacement for the Codex Astartes. Quoted as epigraphs in _The Reverie_; its formulas recur in _The Sins of My Brothers_ and _Aria Arcana_."},{"n":"The Testament of Thorns","k":"Scripture","by":"Angels Penitent","w":["TP","SB"],"f":["penitent","crown"],"x":"Scripture of the [[penitent|Angels Penitent]]. The Thirteenth Psalm (beauty as the Archenemy's lure) is the epigraph of _The Thirteenth Psalm_; the Sixteenth Psalm (curiosity as worse than beauty) is the epigraph of _The Sins of My Brothers_."},{"n":"The Lethean Revelation","k":"Scripture","by":"Lethean Penitents","w":["CT","FC"],"f":["sunken","m_condemns","gurdjief","martyr"],"x":"Scripture of the [[sunken|Sunken Worlds]]' Penitents. Its First Psalm is “[[m_condemns|The Emperor condemns]].” Psalms 451, 31, 27 and 19 are epigraphs in _The Crown of Thorns_; in _Fire Caste_ Admiral Karjalan and Zsombor preach it."},{"n":"The Gospels Illuminant","k":"Scripture","by":"The Torn Prophet","w":["RI","RV"],"f":["lastcandle","tornprophet"],"x":"Scripture of the [[lastcandle|Last Candle]]. Sayings of the [[tornprophet|Torn Prophet]] open _Requiem Infernal_ (four epigraphs) and _The Reverie_."},{"n":"The Revelations of True Night","k":"Cult scripture","by":"The cult of True Night","w":["NF"],"f":["truenight","nightlords"],"x":"[[sarastus|Carceri]]'s cult text (“The Blind and the Bound”). Its epigraph opens _Nightfall_, describing the Lords' descent every thirteenth year."},{"n":"The Needlesong","k":"Rhyme","by":"Unknown (Sarastus folklore)","w":["NB","NF"],"f":["needle","chel"],"x":"The “Needle-bright, needle-dark” rhyme. Epigraph of _Nightbleed_; [[chel|Skreech]] sings it, and in _Nightfall_ the [[needle|Needle]]'s song is called the Needlesong."},{"n":"The Canopic Testament","k":"Scripture","by":"The Canopic Congregation","w":["NN"],"f":["canopic"],"x":"Scripture of [[sarastus|Carceri]]'s dome-keepers. Its First Canticle of Ablution (“Ours is the hand that wipes away the stain betwixt the stars… So it flows, from dirt to dome. [[m_within|As above, so below]]!”) is the epigraph of _Nightshift Nineteen_ and is chanted when Lightkeepers are ordained."},{"n":"The Apotheosis of the Spiral Wyrm","k":"Cult scripture","by":"The Spiral Dawn","w":["CSD"],"f":["spiraldawn"],"x":"The genestealer cult's doctrine. Its passages are chapter epigraphs in _Cult of the Spiral Dawn_. The cult's preaching is also called the Spiral Gospel."},{"n":"The Lays of Vassago","k":"Regimental lore","by":"Black Flag regiments","w":["CSD"],"f":["blackflags","nightlords"],"x":"Studied by Black Flag officers when they take the oath of command. The source of the bogeyman Tizheruk."},{"n":"The Yasu'caor","k":"Philosophy","by":"Tau Seekers","w":["GE"],"f":["cogeternal","akuryo"],"x":"The Seekers' philosophy (“Evil grows from within, not without”). Epigraph of _The Greater Evil_; its axioms guide the Ethereal Kyuhai. The story's chapter titles (“circles”, ending with “the Spiral”) appear to follow it."},{"n":"The Tau'va","k":"Philosophy","by":"Tau Empire","w":["OC"],"f":["jhikaara"],"x":"The Greater Good (established 40K). Epigraph of _Out Caste_, on true names."},{"n":"Escher's sayings","k":"Inquisitorial maxims","by":"Inquisitor Aion Escher","w":["FI","CHS","CSD"],"f":["escher","calaveraC","mordaine"],"x":"Epigraphs of _Fire and Ice_ and _Cast a Hungry Shadow_ (spelled [[escher|Aescher]]). Lines from them (“War is not a binary condition”, “Nothing has changed”, “Everything has changed”) are the [[calaveraC|Calavera Conclave]]'s challenge codes in _Cult of the Spiral Dawn_, which also has an epigraph by [[mordaine|Mordaine]]."},{"n":"The Calavera's sayings","k":"Epigraphs","by":"The Calavera","w":["FI"],"f":["calavera"],"x":"Each section of _Fire and Ice_ opens with a saying of [[calavera|the Calavera]]."},{"n":"The memoirs of Lord Commissar Artemiev","k":"Memoir","by":"Lord Commissar Artemiev","w":["RI"],"f":["exordio"],"x":"Quoted by Commissar Lemarché in _Requiem Infernal_."},{"n":"The Testimony of Asenath Hyades","k":"Confession","by":"Asenath Hyades","w":["RI"],"f":["asenath"],"x":"[[asenath|Asenath]]'s statements to her canoness, dated M40.419, form part of _Requiem Infernal_."},{"n":"Iverson's Journal","k":"Journal","by":"Holt Iverson","w":["FC"],"f":["iverson"],"x":"[[iverson|Iverson]]'s first-person entries in _Fire Caste_, addressed to an unnamed “you”. He hides it on a shuttle at the end."},{"n":"The Canticle of Crows","k":"Epic poem (unfinished)","by":"Ambrose Templeton","w":["FC"],"f":["templeton"],"x":"[[templeton|Templeton]]'s war poem. After his disappearance his notebook passes to Captain Machen, who hears its verses (“Damned if you do or don't…”) in his head."},{"n":"Asharil's log","k":"Recorded log","by":"Por'ui Vior'la Asharil","w":["SW"],"f":["asharil"],"x":"_A Sanctuary of Wyrms_ is her final log, carried out of [[coil|the Coil]] by [[jhikaara|Jhi'kaara]]."},{"n":"Phylacteries Ephemeral","k":"Memoirs","by":"Angels Resplendent aspirants","w":["RV"],"f":["resplendent"],"x":"Each aspirant writes an account of his mortal life before Ascension. [[czervantes|Varzival]]'s records a “bloodborn name” he does not remember living under."},{"n":"Lord Po, “Ancient Terran Heretic”","k":"Poetry (real-world)","by":"Edgar Allan Poe","w":["RV","RI"],"f":["reverie","tome"],"x":"_The Reverie_ quotes “The Raven” as the work of “Lord Po, Ancient Terran Heretic”. _Requiem Infernal_ quotes “A Dream Within a Dream” as an “Antediluvian Terran heresy”."},{"n":"Recorded testimonies in The Reverie","k":"Logs","by":"Juan Borges and others","w":["RV"],"f":["reverie"],"x":"Much of _The Reverie_ is presented as recordings (“BEGIN RECORDING”). Epigraphs are also attributed to [[marisol|Marisol]] Charbonneau (“Muse Eternal”), Yukio [[caravaggio|Caravaggio]] (“Exemplar Eternal”) and [[castaneda|Castaneda]]."},{"n":"Aveline's warning","k":"Recorded transmission","by":"Canoness Aveline","w":["CSD"],"f":["aveline","thorn"],"x":"A century-old recording warning of four-armed indigo creatures, intercepted by the Inquisition and replayed in _Cult of the Spiral Dawn_."}];

const UNREAD=[{"t":"Cold Covenant","k":"Novella","note":"Subject: the 27th Halgarth Brine Dogs on Oblazt. Probably covers the Black Flag betrayal mentioned in _Cult of the Spiral Dawn_ and the Brine Dogs' home world, Hook's Sink (_Altar of Maws_)."},{"t":"Blindsight","k":"Short story","note":"Included with the special edition of _Cold Covenant_. Shares its title with Peter Watts's novel _Blindsight_ (2006), whose vampire Jukka Sarasti may be the source of the name Sarastus. Not yet covered."}];
const NODES=[{"id":"vytarn","n":"Vytarn / Redemption 219","t":"place","c":"ring","w":["RI","CSD","CHS","AA","SB"],"d":"Shrine world. Also called the Candleworld; renamed Redemption 219 after its fall. Two suns: Salvation (gold) and Damnation (red, dying).\n\nSite of the Koronatus Ring: seven spires, one for each of the Seven Virtues (Veritas, Clementia, Temperans, Vigilans, Humilitas, Caritas, Castitas), around a central mount called the Perihelion. The Perihelion holds the Candelabrum cathedral and the city of Sophia Argentum. In _Requiem Infernal_, [[jonah|Jonah]] finds three layers to the Ring: Imperial buildings, older shrines built by the native Ikiryu, and Eldar wraithbone at the core. [[vedas|Vedas]] says the Eldar built it to filter spiritual waste from their webway.\n\nA warp storm destroys the Ring at the end of _Requiem Infernal_ (seen from the air in _Aria Arcana_). Afterwards the ocean is molten and the Perihelion is a sheared mesa called the Slab. Later _Cast a Hungry Shadow_ and _Cult of the Spiral Dawn_ are set here.\n\nKeepers of the Ring, in order: the [[lastcandle|Last Candle]]; the [[resplendent|Angels Resplendent]] (who held Vigilans) and the [[thorn|Thorn Eternal]]; the [[spiraldawn|Spiral Dawn]] genestealer cult; the [[blackflags|Black Flags]] and the [[calaveraC|Calavera Conclave]].","dw":["RI","CSD","CHS","AA","SB"]},{"id":"deadrock","n":"The Deadrock","t":"place","c":"ring","w":["RI","CHS","SB"],"d":"Obsidian monolith in the lava sea of [[vytarn|Redemption]], left after the storm sheared off the Perihelion.\n\n• _Requiem Infernal_: [[asenath|Asenath and Mercy]] are sealed inside. Surviving cults call them the Sisters Discordant.\n• _Cast a Hungry Shadow_: [[gharth|Gharth]]'s axe is cut from it. He kneels on it to “read” the world.\n• _The Sins of My Brothers_: [[athanazius|Athanazius]] has a vision of himself on an obsidian monolith surrounded by seven spires in a lava sea. He is performing a ritual with eight acolytes, binding a crystal lens, while something below him stirs. He calls it the place where his journey began and must end.","dw":["RI","CHS","SB"]},{"id":"underspire","n":"The Underspire","t":"place","c":"ring","w":["CSD","CHS"],"d":"A single space beneath all seven spires of the Ring. Reached by portals, or by slipping through “a crack in the firmament” (Aveline to [[ariken|Ariken]]: “[[vytarn|Redemption]] is riddled” with them). Contains a large ticking engine and the Crucible Aeterna.\n\nAt the Ring's core is a prisoner the books call “the Other” or “the Dark Beneath the Spires”. It feeds on slaughter. Whoever controls the Ring inherits the job of keeping it bound, knowingly or not. When the [[spiralfather|Spiral Father]] dies, the Other is described as “not unbound, but uncoiled”.\n\nCharacters who go down: Ariken Skarth and [[talasca|Talasca]] (_Cult of the Spiral Dawn_); possibly [[etelka|Etelka]] in her vision (_Cast a Hungry Shadow_). The ghost of [[aveline|Canoness Aveline]] speaks from here.","dw":["CSD","CHS"]},{"id":"lastcandle","n":"The Last Candle","t":"faction","c":"ring","w":["RI","AA"],"d":"Breakaway Ecclesiarchy sect ruling the [[vytarn|Koronatus Ring]]. Founded about 1,000 years before _Requiem Infernal_ by the [[tornprophet|Torn Prophet]].\n\nThree orders: Iron (Battle Sisters), Bronze (hospitallers; its palatines secretly build the [[incarnates|Seven Virtues Incarnate]] as flesh-and-machine constructs) and Silver (scholars). The sect claims its beacon on the Perihelion is a flame lit by the Prophet and fed by faith alone.\n\nIn _Aria Arcana_ [[satori|Satori]] has close ties with the sect's scholars. [[vedas|Vedas]] has written himself into its history as one of its officials.","dw":["RI","AA"]},{"id":"tornprophet","n":"The Torn Prophet","t":"person","c":"ring","w":["RI","RV"],"d":"Founder of the [[lastcandle|Last Candle]]. Referred to as “They”. The sect deliberately keeps nine conflicting origin stories, including: twins descended from a saint; an archmagos split into seven personalities; a fallen Space Marine who defeated a daemon.\n\nA Torn Prophet quotation is the epigraph of _The Reverie_. The afterword of _Requiem Infernal_ is narrated by “a Torn Prophet” who moves between stories and is hunted by a “one-eyed ancient” (probably [[calavera|the Calavera]]).\n\nCandidate identity: [[castaneda|Castaneda]] (speculative).","dw":["RI","RV","SB","AA"]},{"id":"thorn","n":"Thorn Eternal","t":"faction","c":"ring","w":["RI","CSD","CHS"],"d":"Order of the Adepta Sororitas.\n\n• _Requiem Infernal_: [[asenath|Asenath]] served as one of its Repentia. Its relic bolt pistol [[tristesse|Tristesse]] passes from the Canoness Excruciant to [[deliverance|Father Deliverance]], to Asenath, and finally to [[athanazius|Athanazius]].\n• _Cult of the Spiral Dawn_ / _Cast a Hungry Shadow_: its Third Mission guarded the ruined Ring for more than three centuries under a covenant with the [[resplendent|Angels Resplendent]]. Last canoness: [[aveline|Aveline]]. The genestealer cult destroyed the mission.\n\nSign-off: “Throne of Thorns”. Its vault on Castitas holds a bronze Emperor face pierced by stars and thorns.","dw":["RI","CSD","CHS"]},{"id":"asenath","n":"Asenath Hyades & Mercy","t":"person","c":"ring","w":["RI"],"d":"Protagonist of _Requiem Infernal_. Born on [[vytarn|Vytarn]]. Career:\n1. Iron Candle Battle Sister.\n2. “Vigilant Paladin” to [[deliverance|Father Deliverance]] on the [[providence|Providence]] crusade.\n3. Repentia of the [[thorn|Thorn Eternal]].\n4. Hospitaller of the Eternal Candle.\n\nMercy is a second personality. Deliverance gave her the name. Mercy tortures and murders, usually by stabbing through the eye; her victims include Canoness Sanghata. During the storm Mercy takes a separate physical form: dark skin, needle fingers, long legs. The novel codes her as Slaaneshi.\n\nEnding: Asenath and Mercy are sealed together inside the [[deadrock|Deadrock]].","dw":["RI"]},{"id":"jonah","n":"Jonah Tythe","t":"person","c":"ring","w":["RI"],"d":"Protagonist of _Requiem Infernal_. Nicknames: Three-Eyes, Mirror Breaker.\n\n• Born in Hive Carceri on [[sarastus|Sarastus]]. His twin sister Mina died on the first night of [[truenight|True Night]]; he keeps her alive as a voice in his head.\n• A bullet from the warp hit him between the eyes, leaving a circular silver scar. He has not aged since. He has counted about 358 years.\n• He is forced to write in a blue-leather tome. The tome becomes [[tome|_The Requiem Infernal_]].\n• His rage on [[vytarn|the Ring]] creates the [[scorched|Scorched God]].\n• He kills [[vedas|Vedas]]. The bullet travels back in time and becomes the bullet that scarred him.","dw":["RI"]},{"id":"tome","n":"The Requiem Infernal (the tome)","t":"entity","c":"ring","w":["RI","AM","AA"],"d":"The book [[jonah|Jonah Tythe]] is forced to write. Blue leather, twin-lightning glyph.\n\nOther stories quote it as an in-universe text:\n• _Altar of Maws_: epigraph from its section “Crossing the Mire World” (about [[phaedra|Phaedra]]).\n• _Aria Arcana_: epigraph from its section “Resplendent Shadows” (about the [[resplendent|Angels Resplendent]]).\n\nPossible further appearance: in _Cult of the Spiral Dawn_ an Inquisition agent takes an azure-leather tome from the [[thorn|Thorn Eternal]] vault. Not identified.","dw":["RI","AM","AA","CSD"]},{"id":"feizt","n":"Toland Feizt","t":"person","c":"ring","w":["RI"],"d":"Breach sergeant, Darkstar Company, [[exordio|Exordio Void Breachers]]. Physically deformed from overdosing on combat enhancement drugs.\n\nIn _Requiem Infernal_ he is thrown back in time into the Razor (see [[aphelion|the Aphelion]]). He changes the past, erasing one of his own soldiers from existence. He is infected by Nurgle and, after being killed by [[asenath|Asenath]], returns as the Blind Watchman, one of the [[incarnates|Seven Virtues Incarnate]].","dw":["RI"]},{"id":"spiraldawn","n":"The Spiral Dawn","t":"faction","c":"ring","w":["CSD","CHS"],"d":"Genestealer cult on [[vytarn|Redemption]]. Arrived on the freighter Obariyon, which crashed at the edge of the old landing field “over a century ago”.\n\n• Patriarch: [[spiralfather|the Spiral Father]].\n• Icons: a flowing spiral; in war, the “Spiral Wyrm” (a spiny worm).\n• Congregations are called “the Unfolded”. Liturgy includes “[[m_within|As within, so without]]”.\n• Founding figures: [[etelka|Etelka Arkanto]] and her son Aziah (_Cast a Hungry Shadow_).\n\nEnd of the novel: the cult steals a freighter and escapes with three Purestrains. In the epilogue, salvagers board the drifting ship and one Purestrain infects them.","dw":["CSD","CHS"]},{"id":"spiralfather","n":"The Spiral Father","t":"person","c":"ring","w":["CSD"],"d":"Patriarch of the [[spiraldawn|Spiral Dawn]]. Titles in sequence: the Seeker, the Prophet, the Spiral Father. Indigo chitin with a golden spiral etched on the forehead.\n\nBy overthrowing the [[thorn|Thorn Eternal]] he unknowingly inherited the binding of the Other in the [[underspire|Underspire]].\n\nKilled on top of the Mandira Veritas by [[talasca|Talasca]], [[cross|Cross]] and ogryns. His head is missing afterwards.","dw":["CSD"]},{"id":"etelka","n":"Etelka Arkanto","t":"person","c":"ring","w":["CHS"],"d":"Former [[thorn|Thorn Eternal]] sister who joined the genestealer cult. Revered by it as the “Saint of Castitas”. Mother of Aziah (a hybrid, the cult's Chosen Claw) and of the deformed Cicatryx.\n\nIn _Cast a Hungry Shadow_ a [[gharth|Scorched Creed]] truck bomb hits her convoy on the bridge road to Vigilans; a metal shard impales her through the belly and she falls into a coma. In a vision of total darkness she crawls from something vast while [[aveline|Aveline]]'s ghost questions her. Asked why she betrayed them, she answers “Because I still could!” and “Redemption's shadow” fills her body. She emerges in the Vigilans entrance tunnel as a daemon: crimson-scaled, horned, skipping between moments, with scraps of her white armour and the shard still in its abdomen. An unseen psychic force (implied to be the Teller) hurls it toward the molten sea.\n\nThe dark place is not named; it may be the [[underspire|Underspire]] (speculative).\n\nShe shares the surname of the [[arkan|Arkan]] people of [[providence|Providence]].","dw":["CHS"]},{"id":"gharth","n":"Gharth & the Scorched Creed","t":"person","c":"ring","w":["CHS"],"d":"Former slab-miner. His eyes burst when the cult's taint was burned out of him. Messiah of the Scorched Creed, the cult of the [[scorched|Scorched God]]. Titles: Blind Pilgrim, Burning Man, Fire Bearer.\n\n• His axe is cut from the [[deadrock|Deadrock]].\n• He was led to an “immolating wellspring” by “his god's one-eyed herald”, whom the text then calls “the ancient”. The herald promised he would “bring forth annihilating, irrefutable fire”. This is probably [[calavera|the Calavera]].\n• The Creed's chant: “The Black Needle unweaves the world” (see [[needle|the Needle]]).\n• He says [[vytarn|Redemption]] “[[m_lie|is a lie]]”.\n\nDies from plasma fire in _Cast a Hungry Shadow_.","dw":["CHS"]},{"id":"scorched","n":"The Scorched God","t":"entity","c":"ring","w":["RI","CHS"],"d":"A fire deity created by [[jonah|Jonah]]'s rage during the destruction of [[vytarn|the Ring]] in _Requiem Infernal_. The novel's afterword predicts a future cult dedicated to it. That cult is the Scorched Creed of [[gharth|Gharth]] in _Cast a Hungry Shadow_.","dw":["RI","CHS"]},{"id":"talasca","n":"Kangre Talasca","t":"person","c":"ring","w":["CSD"],"d":"Colonel of the [[blackflags|8th Vassago Black Flags]]. Silver augmetic eyes. Nickname: the Retriever.\n\nHe paints a swirling, spiral-like pattern across the walls of his tower and calls it “the [[darkcoil|Dark Coil]]”. To him it is a hidden pattern connecting events on [[vytarn|Redemption]]; he sees a face in it and hears a voice from it. The fandom's name for Fehervari's shared setting, “the Dark Coil”, comes from this.\n\nHe drives a Taurox 500 miles in impossibly little time. He kills the [[spiralfather|Spiral Father]], then goes through a portal into the [[underspire|Underspire]] with the ogryn Karolus. Fate unknown.","dw":["CSD"]},{"id":"cross","n":"Cross","t":"person","c":"ring","w":["CSD"],"d":"Captain in the [[blackflags|8th Vassago Black Flags]]. Eye patch; armoured gauntlet over a left hand infected by a parasite from a jungle world. Says “[[m_chance|Nothing is chance]]”.\n\nTrue name: Ambrose Templeton (stated in the text). He is [[templeton|Captain Templeton]] of _Fire Caste_, who disappeared into a coral temple on [[phaedra|Phaedra]].\n\nEnds the novel allied with [[mordaine|Mordaine]] on Vigilans.","dw":["CSD","FC"]},{"id":"omazet","n":"Adeola Omazet","t":"person","c":"inq","w":["FI","CSD"],"d":"• _Fire and Ice_: lieutenant in the [[iwujii|Iwujii Sharks]]. Priestess of Father Terra in his aspect as the Midnight Judge; her regiment calls her “Le Mal Kalfu”. [[calavera|The Calavera]] offers her death or “a leap of faith”. She spits in his eye and jumps from the train onto the Ghostlands of [[oblazt|Oblazt]].\n• _Cult of the Spiral Dawn_: captain in the [[blackflags|Black Flags]], nicknamed the Witch Captain. She saved the regiment on Oblazt when another Black Flag regiment betrayed it. She ends the novel in a coma, dreaming of walking Oblazt's tundra beside a shadowy figure with a face of “harrowed geometry” (probably [[darkman|the scarred dark man]]).","dw":["FI","CSD"]},{"id":"blackflags","n":"8th Vassago Black Flags","t":"faction","c":"ring","w":["CSD"],"d":"Imperial Guard regiment from the [[sunken|Sunken Worlds]]. The Inquisition chose it for [[vytarn|Redemption]] for its belligerence and paranoia.\n\n• Officers: [[talasca|Talasca]], [[cross|Cross]], [[omazet|Omazet]].\n• History: betrayed on [[oblazt|Oblazt]] by another Black Flag regiment. Probably the subject of _Cold Covenant_.\n• Folklore: “the Lays of Vassago”. The cult names its assassin after one of their bogeymen.","dw":["CSD"]},{"id":"aveline","n":"Canoness Aveline","t":"person","c":"ring","w":["CSD","CHS"],"d":"Vetala Persis Aveline. Canoness of the [[thorn|Thorn Eternal]]'s Third Mission for about 30 years. Over a century before _Cult of the Spiral Dawn_ she recorded a warning about four-armed indigo creatures; the Inquisition intercepted it.\n\nAfter death she remains active:\n• The bronze Emperor face in the Castitas vault opens its eyes.\n• Her ghost questions [[etelka|Etelka]] in a vision of darkness (_Cast a Hungry Shadow_).\n• She speaks to [[ariken|Ariken]] Skarth as “[[vytarn|Redemption]]” and tells her to rise in the Crucible Aeterna.","dw":["CSD","CHS"]},{"id":"malpertuis","n":"Malpertuis & Kanvolis","t":"place","c":"angels","w":["RV","CT","TP","SB"],"d":"Malpertuis (“the Painted World”): homeworld of the [[resplendent|Angels Resplendent]], hidden in the Veil Radiant on the Imperium's eastern fringe.\n\nKanvolis: the Chapter's fortress-monastery, a six-tier ziggurat over the River [[tristesse|Tristesse]]. Features include a large waterwheel, art galleries, and the Colonnade of One Hundred Dragons, where heartbroken human artists (Muses) killed themselves until [[czervantes|Czervantes]] closed it.\n\nEvents here: the [[reverie|Reverie]] lies downriver. The [[martyr|Undying Martyr]] crawls out of the Tristesse. The [[purge|Great Purge]] burns the art and kills the Librarians. The [[penitent|Angels Penitent]]' [[absolution|Absolution Company]] keeps a monastery here.","dw":["RV","CT","TP","SB"]},{"id":"reverie","n":"The Reverie","t":"place","c":"angels","w":["RV","SB"],"d":"A forest valley downriver from [[malpertuis|Kanvolis]] that is also a warp rift. Created deliberately by [[castaneda|Castaneda]] and eight others through the Ritual of Severance, performed around a dead champion's body, as a way to control the Black Rage. The ritual also let in a daemon, the Anima Torquentor.\n\n• Aspirants cross it as their trial (the Mirrored Path).\n• Time runs unpredictably: one crossing took 82 years; [[tarsem|Tarsem]] loses 41.\n• Eye-shaped idols infest its outposts. The dead village of Vindarnas is at its centre.\n• At its core is [[aphelion|the Aphelion]].","dw":["RV","SB"]},{"id":"aphelion","n":"The Aphelion / the Razor","t":"entity","c":"angels","w":["RV","RI","FI","AA"],"d":"A crystal web in a black void, inhabited by disc-shaped entities that make a keening sound. Tzeentch-associated (indigo and silver, crystal).\n\nAppearances:\n• _Requiem Infernal_: “the Razor”, a crystal sphere where the [[exordio|Darkstar Company]] was destroyed by discs called Razor Lights.\n• _The Reverie_: the core of [[reverie|the Reverie]]. [[satori|Satori]] calls it “a cancer of the firmament” that leaks into other worlds and times. Things visible inside it include an unidentified battle swarmed by discs (probably the Darkstar Company at the Razor), a four-armed blue-chitin creature, and a wrecked Resplendent shuttle.\n• _The Reverie_: also the name of a painting sold by [[esseker|Alina Esseker]] that corrupted Exemplar [[caravaggio|Caravaggio]].\n• _Fire and Ice_: [[calavera|the Calavera]] says the crystal in his eye is “the Aphelion” and “not a lens”.\n• _Aria Arcana_: [[verlaine|Verlaine]] is carried up to it on a crystal disc.","dw":["RV","RI","FI","AA"]},{"id":"resplendent","n":"Angels Resplendent","t":"faction","c":"angels","w":["RV","RI","CT","SB","TP","AA","WF","CSD"],"d":"Space Marine Chapter, Blood Angels successor. Homeworld: [[malpertuis|Malpertuis]].\n\nHistory:\n1. Originally orange and conventional.\n2. About 600 years before _The Reverie_, [[castaneda|Castaneda]]'s Reformation. The Codex Astartes is replaced by his [[arc|Arc Resplendent]]; colours change to azure; the Chapter becomes warrior-artists organised into nine Battle Rhapsodies. Battle cry: “[[m_wings|We rise on burning wings]]”.\n3. Take part in the [[providence|Providence]] crusade and the massacre of the [[arkan|Arkan]] (_Requiem Infernal_).\n4. Garrison Vigilans spire on the [[vytarn|Koronatus Ring]].\n5. [[athanazius|Athanazius]] deliberately weakens the Chapter. The [[martyr|Undying Martyr]] arrives. [[malvoisin|Malvoisin]] leads the [[purge|Great Purge]].\n6. The Chapter becomes the [[penitent|Angels Penitent]].","dw":["RV","RI","CT","SB","TP","AA","WF","CSD"]},{"id":"penitent","n":"Angels Penitent","t":"faction","c":"angels","w":["CT","TP","SB","RI"],"d":"The [[resplendent|Angels Resplendent]] after the [[purge|Great Purge]].\n\n• Armour: black streaked with umber.\n• Rule: the [[crown|Crown of Thorns]], a council of Chaplains Castigant who wear iron skull masks riveted to their heads.\n• Now has a Death Company (the Resplendent were previously free of the Black Rage).\n• Sinners choose the Path of Chains (become a chained hermit) or the Path of Thorns (self-destruction in the Hall of Thorns).\n• The [[absolution|Absolution Company]] hunts and destroys the old Chapter's artworks across the Imperium (_The Thirteenth Psalm_).","dw":["CT","TP","SB","RI"]},{"id":"rhapEternal","n":"Rhapsody Eternal","t":"faction","c":"angels","w":["RV","SB","RI","AA"],"d":"Ninth Battle Rhapsody (company) of the [[resplendent|Angels Resplendent]]. Commander for many years: [[czervantes|Czervantes]].\n\n• Led into the heart of the [[reverie|Reverie]]; lost half its men.\n• Survivors wear the Umbra Scintillant, armour that constantly shifts colour. This is the rainbow armour seen in _Requiem Infernal_.\n• Garrisoned on the [[vytarn|Koronatus Ring]]. Not informed of the Chapter's fall.\n• In _Aria Arcana_, its Squad Mythodea becomes the [[rhapArcane|Rhapsody Arcane]].","dw":["RV","SB","RI","AA"]},{"id":"rhapArcane","n":"Rhapsody Arcane","t":"faction","c":"angels","w":["AA"],"d":"New formation created at the end of _Aria Arcana_. Squad Mythodea of the [[rhapEternal|Rhapsody Eternal]] is destroyed in the storm over [[vytarn|the Ring]]; its members, living and dead, are taken into the warp and remade. [[verlaine|Verlaine]] is its herald and now has wings of blue fire. The story codes this as Tzeentchian.\n\n[[satori|Satori]] says they will be kept “in the substrata” until required and will one day return to carry a message “back into the Grey”. No later story shows this.","dw":["AA"]},{"id":"castaneda","n":"Xøren Castaneda","t":"person","c":"angels","w":["RV","SB","AA"],"d":"Chief Librarian of the [[resplendent|Angels Resplendent]]; title First Magister. Author of the [[arc|Arc Resplendent]].\n\n• Led the Reformation: abolished the Codex, made art central, changed the colours to azure.\n• Performed the Ritual of Severance with eight others, creating [[reverie|the Reverie]] on purpose.\n• Later “transcended” from the top of [[malpertuis|Kanvolis]]. The [[paladins|Paladins Luminous]] believe he removed himself from space and time.\n• The Chapter badge (a robed figure with raised arms) depicts him.\n\nPossibly the [[tornprophet|Torn Prophet]] (speculative).","dw":["RV","SB","AA","RI"]},{"id":"satori","n":"Satori","t":"person","c":"angels","w":["RV","RI","SB","AA"],"d":"[[paladins|Paladin Luminous]] (member of the Chapter's secret inner circle of mystics). Over 600 years old. First disciple of [[castaneda|Castaneda]]. Exempt from memory conditioning. Heraldry: silver lattice sphere on black.\n\n• _The Reverie_: as a boy he killed the raging champion Hanzo Gyguerre with a stab through the right eye. Hunts the Inheritors. At the end walks through his mirror into the [[reverie|Reverie]], following a vision of seven spires around a mountain (the [[vytarn|Koronatus Ring]]).\n• _Requiem Infernal_: probably the unnamed fourth Astartes in indigo and azure, with “a geometric sphere of intricate silver lines” as heraldry, whom [[asenath|Asenath]] sees in a procession on the Perihelion alongside [[czervantes|Czervantes]] and [[deliverance|Father Deliverance]]. Not named; identified by heraldry.\n• _The Sins of My Brothers_: mentor of [[athanazius|Athanazius]]; left [[malpertuis|Malpertuis]] permanently.\n• _Aria Arcana_: chose Vytarn as the Ninth's garrison. Mentally rides [[verlaine|Verlaine]] through the storm and directs him onto the disc that transforms him. Says he did not cause the storm but charted it.\n\nSayings: “[[m_chance|Nothing is chance]]”; “[[m_wings|We descend on torn wings]]”.","dw":["RV","RI","SB","AA"]},{"id":"czervantes","n":"Varzival Czervantes","t":"person","c":"angels","w":["RV","RI","CT","SB","AA"],"d":"Born Darioc Graal.\n\n• _The Reverie_: as an aspirant, pulled the blade from Gyguerre's eye. Knight Exemplar of the [[rhapEternal|Rhapsody Eternal]].\n• _Requiem Infernal_: captain on Vigilans; takes in the boy [[athanazius|Athanazius]].\n• _The Sins of My Brothers_: Athanazius manoeuvred him into the post of Chapter Master, expecting him to fail.\n• _The Crown of Thorns_: Chapter Master, “the Knight Resplendent”. Absent on campaign; [[malvoisin|Malvoisin]] has declared him lost.\n• _Aria Arcana_: on [[vytarn|the Ring]] with the Ninth.","dw":["RV","RI","CT","SB","AA"]},{"id":"athanazius","n":"Athanazius Calvino","t":"person","c":"angels","w":["RI","CT","SB","TP"],"d":"• _Requiem Infernal_: white-haired psyker boy who escapes the [[lastcandle|Last Candle]] schola. Taken in by [[czervantes|Czervantes]]. The epigraph names him Chief Librarian Illuminant of the [[resplendent|Angels Resplendent]].\n• _The Sins of My Brothers_: Chief Librarian, nicknamed Whisperlight, secretly a [[paladins|Paladin Luminous]]. Admits he deliberately engineered the Chapter's fall because the [[arc|Arc Resplendent]] required it. During [[purge|the Purge]] he transfers his soul into a young zealot, Tomaz Carriére. Later he is stabbed and thrown off the colonnade by a grey-haired veteran (probably [[montaig|Montaig]]).\n• Foresaw himself performing a ritual on the [[deadrock|Deadrock]]. This conflicts with his death and is unresolved.\n• _The Thirteenth Psalm_: forged the [[mirror|Mirror of Athanazius]].","dw":["RI","CT","SB","TP"]},{"id":"malvoisin","n":"Icharos Malvoisin","t":"person","c":"angels","w":["WF","CT","SB","RI"],"d":"Angel Resplendent, later Master Chaplain of the [[penitent|Angels Penitent]].\n\n• _The Walker in Fire_: swordsman in Deathwatch [[killteam|Kill Team Sabatine]]. Tells Branatar he has “an iron barb” in his soul. On [[sarastus|Sarastus]] an irradiated bullet cuts a crown-shaped wound across his forehead. He says “[[m_lie|It's a lie]]… We condemn ourselves” and passes out. His body later disappears. The epilogue says the [[resplendent|Angels Resplendent]] were gone by the time dark stories about him spread.\n• _The Sins of My Brothers_: Master Chaplain, radiation-scarred, first to rivet on the iron mask.\n• _The Crown of Thorns_: spends 19 days with the [[martyr|Undying Martyr]] and declares him a prophet. Leads the [[purge|Great Purge]].\n• _Requiem Infernal_: an epigraph is credited to Icharos Malvoisin, Chaplain Castigant, Angels Penitent.","dw":["WF","CT","SB","RI"]},{"id":"montaig","n":"Brother-Sergeant Montaig","t":"person","c":"angels","w":["CT","SB"],"d":"Narrator of _The Crown of Thorns_. Took part in storming the Librarium during [[purge|the Purge]] but hesitated when [[athanazius|Athanazius]] spoke. Keeps a forbidden illuminated book hidden. Tries to help the neophyte Phelion escape; Phelion betrays him and Montaig kills him. Resolves to “make my stand another day”.\n\nProbably the veteran who kills Athanazius in _The Sins of My Brothers_.","dw":["CT","SB"]},{"id":"rathana","n":"Bjargo Rathana","t":"person","c":"angels","w":["TP"],"d":"Narrator of _The Thirteenth Psalm_. Formerly the Chapter's most famous sculptor. Now a Chaplain Castigant of the [[penitent|Angels Penitent]] with a riveted iron mask.\n\nLeads an [[absolution|Absolution Company]] squad to [[oblazt|Oblazt]] during the [[unity|Unity revolution]] to retrieve the [[mirror|Mirror of Athanazius]] from the mansion of [[esseker|Konteza Esseker]]. In the mirror he sees and talks to his “mirror-brother”, a version of himself on the other side of the glass. At the end he tears off his mask.","dw":["TP"]},{"id":"martyr","n":"The Undying Martyr","t":"person","c":"angels","w":["CT","SB"],"d":"Prophet of the [[penitent|Angels Penitent]]. Appeared about ten years before _The Crown of Thorns_ by crawling out of the River [[tristesse|Tristesse]] at [[malpertuis|Kanvolis]]. Physically: very large, long black hair, boils, a stomach wound that looks fatal, a crude aquila pendant. First words: “Do I still dream?”\n\nTeaching: the Astartes are corrupt; there is no ascension, only penitence and pain; “[[m_condemns|The Emperor condemns]].” [[malvoisin|Malvoisin]] proclaims him a prophet and the [[purge|Great Purge]] follows.\n\nAlmost certainly [[gurdjief|Confessor Gurdjief]] from _Fire Caste_.","dw":["CT","SB","FC"]},{"id":"verlaine","n":"Ignacio Verlaine","t":"person","c":"angels","w":["AA"],"d":"Protagonist of _Aria Arcana_. Epistolary (Librarian) of the [[rhapEternal|Rhapsody Eternal]]; disciple of [[satori|Satori]], whom he has begun to distrust.\n\nHis gunship, the _Aria Arcana_, is destroyed over [[vytarn|the Ring]] by a crystal disc daemon. He tries to dominate a daemon psychically and partly absorbs its hunger. He walks through the storm-warped city to the Candelabrum (his helmet counts eleven days; his chronometer runs backwards). Satori speaks in his head and directs him onto the disc. He becomes the winged herald of the [[rhapArcane|Rhapsody Arcane]].","dw":["AA"]},{"id":"esseker","n":"The Esseker family","t":"person","c":"inq","w":["RV","TP"],"d":"Two characters share the surname:\n• Alina Esseker (_The Reverie_): rogue trader in the Calixis Sector. Sold the painting “[[aphelion|Aphelion]]” to Exemplar [[caravaggio|Caravaggio]], which corrupted him.\n• Konteza Urzelka Esseker (_The Thirteenth Psalm_): Slaaneshi sorceress in Zakhalin on [[oblazt|Oblazt]]. Kept the [[mirror|Mirror of Athanazius]]. Sacrificed her followers and merged with her mansion, which now grows and distorts time.\n\nRelationship between them not stated.","dw":["RV","TP"]},{"id":"tarsem","n":"Tarsem Veyd","t":"person","c":"angels","w":["RV"],"d":"Noble (omyr) of the [[obarai|Oberai]] Oligarchy, visiting [[malpertuis|Malpertuis]] in _The Reverie_. Copper skin, amber eyes, wooden aquila. Member of a society called the Winged Eye.\n\nLoses 41 years in [[reverie|the Reverie]] without ageing. The painter Euryale ([[marisol|Marisol]]) calls him “Seigneur Olba”. [[satori|Satori]] predicts “a darker, farther deliverance” for him.\n\nProbably becomes [[deliverance|Father Deliverance]] and then [[vedas|Olber Vedas]].","dw":["RV","RI"]},{"id":"deliverance","n":"Father Deliverance","t":"person","c":"prov","w":["RI"],"d":"Confessor who led the Imperial crusade on [[providence|Providence]] (backstory in _Requiem Infernal_). Described by Asenath as a young preacher of about thirty-five. Self-flagellant. Copper skin, amber eyes, wooden aquila.\n\n• [[asenath|Asenath]] was his “Vigilant Paladin”. He named her second personality Mercy.\n• Asenath first sees him on [[vytarn|Vytarn]], walking behind a procession of three [[resplendent|Angels Resplendent]] (one of them [[czervantes|Czervantes]]) and a fourth in indigo (probably [[satori|Satori]]). The Resplendent then joined his crusade.\n• Asenath (“she took his sight”) blinded him. He walked into the frozen north of Providence and disappeared.\n\nProbably the later identity of [[tarsem|Tarsem Veyd]] and an earlier identity of [[vedas|Olber Vedas]].","dw":["RI","RV","NB"]},{"id":"vedas","n":"Olber Vedas","t":"person","c":"ring","w":["RI","NB"],"d":"Antagonist of _Requiem Infernal_. Servant of Tzeentch; describes himself as an “addict eternal”. His eyes are borrowed from others and he has no eyelids.\n\n• Has inserted himself into the [[lastcandle|Last Candle]]'s past as one of its officials (Theologus Exegessor).\n• Says that “over the millennia” he has been “many lost souls”; this incarnation was “delivered to my calling a mere nineteen years ago” but has been searching “for over a thousand”.\n• Woke the Shadow Orrery two years before the novel.\n• Killed by [[jonah|Jonah]].\n• _Nightbleed_: the requisition for the barrel of [[vlg|VLG-01]] on [[sarastus|Sarastus]] is signed “Vedas”.\n\nSayings: “[[m_chance|Nothing is chance]]”; “[[m_within|As within, so without]]”. Probably formerly [[tarsem|Tarsem Veyd]] and [[deliverance|Father Deliverance]].","dw":["RI","NB","RV"]},{"id":"marisol","n":"Marisol / Euryale","t":"person","c":"angels","w":["RV"],"d":"Marisol Charbonneau: poet and [[czervantes|Czervantes]]' Muse in _The Reverie_. Becomes the ninth Inheritor (called the Mistress Radiant): crystal skin, six fingers, consumes other Muses. Escapes into [[reverie|the Reverie]].\n\nEmerges in the capital, Charlemagne, as Euryale, an ageless painter. As Euryale she gave [[tarsem|Tarsem]] his winged-eye tattoo before Marisol had ever met him (a time loop).","dw":["RV"]},{"id":"phaedra","n":"Phaedra","t":"place","c":"phaedra","w":["FC","SW","AM","VG","GE","FI"],"d":"Water world on the Eastern Fringe, in the [[yuxa|Yuxa system]]. Tau name: Fi'draah. Terrain: living coral islands, fungal jungle (the Mire), ancient coral temples that sterilise surrounding ground. Natives: the Saathlaa, descendants of an old human colony.\n\nThe Imperium and the tau fought here for about 50 years. The Imperial commander (Kircher) and the tau ([[seishin|O'Seishin]]) secretly kept the war in stalemate.\n\nStories: _The Greater Evil_ (how the war began), _Out Caste_ (background), _A Sanctuary of Wyrms_, _Altar of Maws_, _Fire Caste_, _Vanguard_ (after the war). In _Vanguard_ both sides have been abandoned: supplies and communications stopped without explanation, and a warp storm (the Ghostblight) is forming.","dw":["FC","SW","AM","VG","GE","FI","OC"]},{"id":"coil","n":"The Dolorosa Coil","t":"place","c":"phaedra","w":["FC","SW","AM"],"d":"Region of [[phaedra|Phaedra]] where the Qalaqexi River splits into a maze of channels. Tau designation: Sector O-31. Time and space are unstable inside.\n\n• [[gurdjief|Gurdjief]] spent what he experienced as decades in it; less than a year passed outside.\n• Patrols are reported “still fighting older wars”.\n• _Altar of Maws_: a convoy moves from the river into a lake that does not exist on maps.\n• Gurdjief sinks into its water on Phaedra and reappears in a river on [[malpertuis|Malpertuis]] (see [[martyr|the Undying Martyr]]).","dw":["FC","SW","AM"]},{"id":"yuxa","n":"Yuxa / the Unfolding Nexus","t":"place","c":"phaedra","w":["GE"],"d":"Star system containing [[phaedra|Phaedra]]. Eleven planets; two inhabited: Phaedra and the gas giant Scitalyss.\n\nScitalyss-Altus is a skyhive (nickname: the Rat's Cradle), renamed “the Unfolding Nexus” by the [[cogeternal|Cog Eternal]]. In _The Greater Evil_ a tau embassy arrives to accept the hive's apparent conversion to the Greater Good. The hive is controlled by a genestealer cult. This is the origin of the Phaedran war.","dw":["GE"]},{"id":"cogeternal","n":"The Cog Eternal","t":"faction","c":"phaedra","w":["GE"],"d":"Full name: the Illumismatic Order of the Ever-Turning Cog. Symbol: four-toothed cog with an infinity loop. A genestealer cult that presents itself to the tau as converts to the Greater Good.\n\n• Patriarch: the Animus-Alpha, who calls himself “a traveller who became a god”.\n• Has implanted the previous tau emissary; his mate is raising tau–genestealer hybrid children.\n• Partly controls [[voyle|Ulver Voyle]].","dw":["GE"]},{"id":"bunker","n":"Ordo Xenos bunker","t":"place","c":"phaedra","w":["SW"],"d":"Octagonal Imperial bunker marked with the Inquisition's “I”, on an island in [[coil|the Coil]] overgrown with stinging “wyrmtrees”. Explored by [[asharil|Asharil]] in _A Sanctuary of Wyrms_.\n\nContents: tanks of tyranid specimens; mass graves of hybrids (elongated skulls, wrist blades, stinger tongues that spread spores); a dead Mechanicus magos with a bronze mask riveted to his skull; a dead kill team of Space Marines in black armour with a silver left arm and an 'I'-and-skull shoulder pad (Deathwatch, though the tau narrator does not use the name). Asharil's conclusion: the tyranid strain consumed [[phaedra|Phaedra]]'s fungus and merged with it.\n\nPossibly the “sanctuary” built for [[lem|Magos Lem]] (strong inference).","dw":["SW"]},{"id":"lem","n":"Magos Nedezdha Lem","t":"person","c":"inq","w":["WF"],"d":"Magos Biologis from the forge world Stygies VIII. Appears in _The Walker in Fire_.\n\nSet up an apparently rogue research facility in dead Hive Carceri on [[sarastus|Sarastus]]. The Deathwatch were told to kill her; the real mission was to extract her, because she was defecting to the Ordo Xenos. Her guardian, Secutor Strochan, was loyal to the forge and had to be destroyed.\n\nHer specimens: four arms, glossy blue exoskeleton, gilled elongated skull, tendrils. Probably a genestealer or tyranid strain. The Inquisition is building her a new “sanctuary” on a backwater world to continue the work.","dw":["WF"]},{"id":"gurdjief","n":"Yosiv Gurdjief","t":"person","c":"phaedra","w":["FC"],"d":"[[sunken|Lethean]] confessor in _Fire Caste_. Very large, black-haired. Creed: “[[m_condemns|The Emperor condemns]].”\n\nWalked [[coil|the Coil]] for what felt like decades. There he met a lost tau warrior in crimson armour ([[akuryo|Akuryo]]). [[cutler|Cutler]] runs him through the stomach; he sinks into a canal asking “Is this a dream?” Audie Joyce insists the saint is only sleeping.\n\nAlmost certainly reappears as [[martyr|the Undying Martyr]].","dw":["FC","CT","SB"]},{"id":"iverson","n":"Holt Iverson","t":"person","c":"prov","w":["FC"],"d":"Narrator of _Fire Caste_. Commissar of the [[arkan|19th Arkan Confederates]]. Born on [[providence|Providence]]; taken off-world as a boy by Commissar Bierce.\n\n• Razorvine scars across his body. Talks to the ghosts of people he has killed.\n• Loses his right arm and eye to [[jhikaara|Jhi'kaara]]; given old augmetics.\n• Finds [[akuryo|Akuryo]]'s armour as a kroot totem.\n• Murders Cadet [[reve|Reve]].\n• Aboard the [[requiemship|Requiem of Virtue]] as it enters the warp, tells the tau commander [[abel|Abel]] “It's a lie” (meaning the Greater Good), then “[[m_lie|It's all a lie]]” as he kills him. Dying, he sees Reve's ghost (“That is just the beginning of the road”) and hears a bell tolling.\n\nProbably becomes [[darkman|the scarred dark man]].","dw":["FC","FI"]},{"id":"darkman","n":"The Scarred Dark Man","t":"person","c":"prov","w":["FC","FI"],"d":"Recurring unnamed figure. Tall; black greatcoat and wide-brimmed hat; face covered in a lattice of glowing scars; one dead eye and one augmetic eye.\n\n• _Fire Caste_ (Trinity, on [[providence|Providence]]): central to the town's corruption and its [[bell|daemon bell]]. Says he is “just a man who found his way back home”. Fought by Cutler, [[cutler|Skjoldis]] and Kjordal.\n• _Fire and Ice_: appears at [[mordaine|Mordaine]]'s sickbed, says “[[m_lie|It's a lie]]”, and is pulled away to a place where a daemon bell rings.\n• _Cult of the Spiral Dawn_: probably the figure [[omazet|Omazet]] dreams of walking beside.\n• Possibly the “scarred prophet” in _Nightfall_ (speculative).\n\nIdentity: an older [[iverson|Holt Iverson]] (strong inference; Skjoldis recognises Iverson's face).","dw":["FC","FI","CSD","NF"]},{"id":"templeton","n":"Ambrose Templeton","t":"person","c":"prov","w":["FC"],"d":"Captain, 4th Company, [[arkan|19th Arkan Confederates]] (_Fire Caste_). Historian and poet; wears glasses. Insect bites infect his left hand. Talks of hidden paths between the stars and “the needle-storm that unstitched time”, walks into a coral temple on [[phaedra|Phaedra]], and disappears.\n\nReappears as [[cross|Cross]] in _Cult of the Spiral Dawn_ (confirmed by name).","dw":["FC","CSD"]},{"id":"cutler","n":"Ensor Cutler & Skjoldis","t":"person","c":"prov","w":["FC"],"d":"Colonel Ensor Cutler, commander of the [[arkan|19th Arkan Confederates]]. Nickname: the Whitecrow (his hair turned white at Trinity).\n\nSkjoldis: Norland witch who fought with him at Trinity. On [[phaedra|Phaedra]] a daemon from Trinity possesses her body; her soul moves into Cutler, who then has one grey and one green eye.\n\nCutler kills [[gurdjief|Gurdjief]], allows himself to be captured, and at the end forces the [[requiemship|Requiem of Virtue]] into the warp with no Navigator. Fate unknown.","dw":["FC"]},{"id":"jhikaara","n":"Jhi'kaara","t":"person","c":"phaedra","w":["OC","FC","SW","AM"],"d":"Tau fire warrior (pathfinder).\n\n• _Out Caste_: named J'kaara (“the mirror”) at the academy. On [[obarai|Oba'rai]] she disobeys orders; a burned man in a smouldering greatcoat and high-peaked cap (a commissar, by his dress) rises from among the dead and scars her helmet and face with a chainblade. She renames herself Jhi'kaara, “the broken mirror”.\n• _A Sanctuary of Wyrms_: guide to [[asharil|Asharil]]; carries Asharil's log out.\n• _Altar of Maws_: survives the [[sleeper|Sleeper Beneath]]. Recalls Asharil's opening line without knowing its source.\n• _Fire Caste_: takes [[iverson|Iverson]]'s arm and eye; survives.","dw":["OC","FC","SW","AM"]},{"id":"asharil","n":"Asharil","t":"person","c":"phaedra","w":["SW"],"d":"Por'ui Vior'la Asharil, tau water caste envoy from [[farsight|Farsight]]'s home sept. Narrator of _A Sanctuary of Wyrms_ (written as her final log). [[seishin|O'Seishin]] dislikes her and sends her to “unravel [[coil|the Coil]]”.\n\nShe finds the [[bunker|Ordo Xenos bunker]]. After a spore release mutates her team, she goes down with a surviving Iron Hands marine to destroy “the Root”. Her log opens with a line about walking blindly along a knife edge; [[jhikaara|Jhi'kaara]] later recalls it.","dw":["SW"]},{"id":"seishin","n":"Por'o Seishin","t":"person","c":"phaedra","w":["GE","FC","SW"],"d":"Tau water caste diplomat.\n\n• _The Greater Evil_: young High Ambassador. Sends the embassy to [[yuxa|Yuxa]].\n• _A Sanctuary of Wyrms_: sends [[asharil|Asharil]] into [[coil|the Coil]].\n• _Fire Caste_: aged 83, kept alive by Magos [[kaul|Kaul]]'s treatments. Actual controller of the tau side
