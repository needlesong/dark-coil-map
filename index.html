const THREADS=[{"id":"angels","t":"The Angels Resplendent","s":"Reformation, fall, and what came after. 9 stops across 7 stories.","steps":[{"f":["castaneda","resplendent","reverie","arc","paladins","m_wings"],"h":"Castaneda's Reformation","x":"Source: _The Reverie_.\n\nAbout 600 years before _The Reverie_, Chief Librarian [[castaneda|Xøren Castaneda]] reforms the [[resplendent|Angels Resplendent]]. He replaces the Codex Astartes with his own text, the [[arc|Arc Resplendent]], changes the Chapter's colours to azure, and makes art a central duty.\n\nTo control the Black Rage, he and eight others perform the Ritual of Severance. This deliberately creates [[reverie|the Reverie]], a warp rift near the fortress-monastery. Castaneda later disappears; the Chapter's mystics believe he removed himself from space and time.","w":["RV"]},{"f":["satori","aphelion","reverie","paladins","caravaggio","esseker"],"h":"The Reverie and the Aphelion","x":"Source: _The Reverie_.\n\nThe [[reverie|Reverie]] is used for the aspirant trial. At its core is [[aphelion|the Aphelion]], a crystal web in a void that leaks into other worlds and times.\n\n[[satori|Satori]], [[castaneda|Castaneda]]'s first disciple and over 600 years old, hunts in the Reverie. At the end of the novel he enters it through his mirror, following a vision of seven spires around a mountain. That is the Koronatus Ring on [[vytarn|Vytarn]].","w":["RV"]},{"f":["rhapEternal","czervantes","vytarn","athanazius","incarnates"],"h":"The Ninth Rhapsody posted to Vytarn","x":"Sources: _The Sins of My Brothers_, _Requiem Infernal_.\n\nThe [[rhapEternal|Rhapsody Eternal]] (Ninth Company, commanded by [[czervantes|Czervantes]]) is led into the heart of the [[reverie|Reverie]] and loses half its men. The survivors' armour constantly changes colour. They are posted to the [[vytarn|Koronatus Ring]] on Vytarn, which is where [[asenath|Asenath]] sees them in _Requiem Infernal_.\n\nOn Vytarn Czervantes takes in a runaway psyker boy, [[athanazius|Athanazius]].","w":["SB","RI"]},{"f":["athanazius","czervantes","resplendent","arc","paladins","purge"],"h":"Athanazius sabotages the Chapter","x":"Source: _The Sins of My Brothers_.\n\n[[athanazius|Athanazius]] becomes Chief Librarian. In his own account he deliberately prepares the Chapter's fall, because the [[arc|Arc Resplendent]] says it is necessary:\n• He manoeuvres [[czervantes|Czervantes]] into the post of Chapter Master, expecting him to fail.\n• He sends the best warriors away from the homeworld.\n• He destabilises the Chaplains.\n• He vetoes resistance when [[purge|the Purge]] comes.","w":["SB"]},{"f":["malvoisin","sarastus","killteam","m_lie","m_wings","crown"],"h":"Malvoisin wounded on Sarastus","x":"Source: _The Walker in Fire_. Takes place before [[purge|the Purge]].\n\n[[malvoisin|Icharos Malvoisin]] serves in a Deathwatch kill team sent to dead Hive Carceri on [[sarastus|Sarastus]]. He tells a comrade he has “an iron barb” in his soul. An irradiated bullet cuts a crown-shaped wound across his forehead. He says “[[m_lie|It's a lie]]… We condemn ourselves” and passes out. His body later disappears.\n\nThe story's last line says the [[resplendent|Angels Resplendent]] no longer existed by the time stories about him spread. He returns home and becomes Master Chaplain.","w":["WF"]},{"f":["gurdjief","martyr","coil","malpertuis","tristesse","m_condemns","sunken"],"h":"Gurdjief becomes the Undying Martyr","x":"Sources: _Fire Caste_, _The Crown of Thorns_.\n\nOn [[phaedra|Phaedra]], the [[sunken|Lethean]] confessor [[gurdjief|Gurdjief]] is stabbed through the stomach by [[cutler|Cutler]] and sinks into the water of [[coil|the Coil]], asking “Is this a dream?”\n\nA man matching his description, with the same wound, crawls out of the River [[tristesse|Tristesse]] at [[malpertuis|Kanvolis]] asking “Do I still dream?” He is called [[martyr|the Undying Martyr]]. He preaches that the Astartes are corrupt and that “[[m_condemns|The Emperor condemns]].” Master Chaplain [[malvoisin|Malvoisin]] talks with him for 19 days and proclaims him a prophet.\n\nThe identification is not stated but is strongly implied.","w":["FC","CT"]},{"f":["malvoisin","athanazius","montaig","penitent","purge","m_wings","m_condemns","crown","tristesse"],"h":"The Great Purge","x":"Sources: _The Crown of Thorns_, _The Sins of My Brothers_.\n\n[[malvoisin|Malvoisin]] leads the zealots against the Chapter's art and its Librarians. [[athanazius|Athanazius]] and his Librarians meet them unarmed and unarmoured, answering only “[[m_wings|We rise on burning wings]]”. They are killed.\n\nAthanazius survives by transferring his soul into one of the attackers, Tomaz Carriére. Later a grey-haired veteran (probably [[montaig|Montaig]]) stabs him and throws him off the colonnade.\n\nThe Chapter is renamed the [[penitent|Angels Penitent]].","w":["CT","SB"]},{"f":["penitent","rathana","esseker","oblazt","absolution","mirror","crown","unity"],"h":"The Angels Penitent","x":"Sources: _The Crown of Thorns_, _The Thirteenth Psalm_.\n\nThe [[penitent|Angels Penitent]] are ruled by a council of Chaplains in iron masks (the [[crown|Crown of Thorns]]) and, unlike the old Chapter, suffer the Black Rage. Their [[absolution|Absolution Company]] destroys the old Chapter's art across the Imperium.\n\nIn _The Thirteenth Psalm_ the former sculptor [[rathana|Rathana]], now a Chaplain, retrieves the [[mirror|Mirror of Athanazius]] from [[esseker|Konteza Esseker]]'s mansion on [[oblazt|Oblazt]].","w":["CT","TP"]},{"f":["verlaine","rhapArcane","satori","vytarn","aphelion","arc","lastcandle"],"h":"The Ninth Rhapsody becomes the Rhapsody Arcane","x":"Source: _Aria Arcana_. Set on Vytarn during the storm of _Requiem Infernal_.\n\nThe [[rhapEternal|Rhapsody Eternal]], still on Vytarn, has not been told about the Chapter's fall. When the warp storm hits [[vytarn|the Ring]], [[satori|Satori]] sends Squad Mythodea into it. Their gunship is destroyed. The Librarian [[verlaine|Verlaine]] reaches the summit, steps onto a crystal disc, and is transformed into a winged, fire-wreathed herald (Tzeentch-coded). His squad, living and dead, is remade with him as the [[rhapArcane|Rhapsody Arcane]].\n\nSatori says they will be kept until needed. No later story picks this up.","w":["AA","RI"]}]},{"id":"ring","t":"The Koronatus Ring","s":"History of the Ring on Vytarn / Redemption. 8 stops across 5 stories.","steps":[{"f":["vytarn","lastcandle","tornprophet","incarnates"],"h":"The Ring under the Last Candle","x":"Source: _Requiem Infernal_.\n\nThe Koronatus Ring on [[vytarn|Vytarn]] is seven spires around a central mount. For about 1,000 years it has been ruled by the [[lastcandle|Last Candle]], a breakaway Ecclesiarchy sect founded by the [[tornprophet|Torn Prophet]].\n\nThe Ring has three layers: Imperial buildings, older native shrines, and Eldar wraithbone at the core.","w":["RI"]},{"f":["jonah","vedas","asenath","feizt","incarnates","tome","truenight","tristesse"],"h":"Requiem Infernal","x":"Source: _Requiem Infernal_.\n\nMain characters:\n• [[jonah|Jonah Tythe]], a time-cursed man from [[sarastus|Sarastus]] forced to write the book.\n• [[asenath|Asenath Hyades]], an ex-Sister with a murderous second personality, Mercy.\n• [[feizt|Toland Feizt]], a Void Breacher who becomes a Nurgle construct.\n• [[vedas|Olber Vedas]], a servant of Tzeentch who has inserted himself into the sect's history.\n\nA warp storm destroys [[vytarn|the Ring]].","w":["RI"]},{"f":["verlaine","satori","lastcandle","rhapEternal","rhapArcane","aphelion"],"h":"The storm seen by the Angels Resplendent","x":"Source: _Aria Arcana_.\n\nThe same storm, seen from an [[resplendent|Angels Resplendent]] gunship. The [[rhapEternal|Rhapsody Eternal]] is garrisoned on [[vytarn|the Ring]]. [[satori|Satori]] sends [[verlaine|Verlaine]]'s squad into the storm; Verlaine is transformed into a Tzeentch-coded herald at the summit.","w":["AA"]},{"f":["deadrock","asenath","scorched","jonah"],"h":"After the storm: Redemption","x":"Sources: _Requiem Infernal_, _Cast a Hungry Shadow_.\n\nThe central mount is sheared off. What remains of it is a black monolith, [[deadrock|the Deadrock]], with [[asenath|Asenath]] and Mercy sealed inside. [[jonah|Jonah]]'s rage has created a fire deity, [[scorched|the Scorched God]]. The ocean becomes lava. The planet is renamed [[vytarn|Redemption 219]].","w":["RI","CHS"]},{"f":["thorn","aveline","etelka","spiraldawn","underspire","tristesse"],"h":"The Thorn Eternal and Etelka","x":"Sources: _Cast a Hungry Shadow_, _Cult of the Spiral Dawn_.\n\nThe Sororitas order [[thorn|Thorn Eternal]] guards the ruined Ring for more than three centuries, under a covenant with the [[resplendent|Angels Resplendent]].\n\nOne sister, [[etelka|Etelka Arkanto]], defects to the genestealer cult. In _Cast a Hungry Shadow_ she is impaled by a shard of metal when a [[gharth|Scorched Creed]] truck bomb hits her convoy. While she lies in a coma, the ghost of Canoness [[aveline|Aveline]] questions her in a vision of darkness. “Redemption's shadow” fills her and she becomes a crimson-scaled, horned daemon.","w":["CHS","CSD"]},{"f":["gharth","scorched","calavera","deadrock","needle"],"h":"The Scorched Creed","x":"Source: _Cast a Hungry Shadow_.\n\n_Requiem Infernal_'s afterword predicts a cult of the [[scorched|Scorched God]]. It appears here as the Scorched Creed, led by the blind prophet [[gharth|Gharth]], whose axe is cut from the [[deadrock|Deadrock]].\n\nGharth was led to the fire by “his god's one-eyed herald”, also called “the ancient”. This is probably [[calavera|the Calavera]] of _Fire and Ice_. The Creed's chant is “The Black Needle unweaves the world” (compare [[needle|the Needle]] on [[sarastus|Sarastus]]).","w":["CHS"]},{"f":["spiraldawn","spiralfather","talasca","cross","mordaine","darkcoil","calaveraC","templeton","ariken","omazet"],"h":"Cult of the Spiral Dawn","x":"Source: _Cult of the Spiral Dawn_. About 80 years after _Cast a Hungry Shadow_.\n\nThe genestealer cult [[spiraldawn|Spiral Dawn]] controls [[vytarn|the Ring]]. The Inquisition, under [[mordaine|Mordaine]], sends in the [[blackflags|8th Vassago Black Flags]].\n• Colonel [[talasca|Talasca]] paints a spiral pattern across his tower walls and calls it “the [[darkcoil|Dark Coil]]”. He believes it shows a hidden pattern behind events. This is where the fandom's name for the setting comes from.\n• Captain [[cross|Cross]] is identified as Ambrose [[templeton|Templeton]] from _Fire Caste_.\n• The Patriarch, the [[spiralfather|Spiral Father]], is killed on top of a spire.","w":["CSD","CHS"]},{"f":["underspire","talasca","aveline","ariken","spiralfather"],"h":"The Underspire","x":"Source: _Cult of the Spiral Dawn_.\n\nBeneath the seven spires is one shared space, the [[underspire|Underspire]]. At its core is a bound entity, “the Other”, which feeds on slaughter. Whoever controls the Ring inherits the job of keeping it bound.\n\nAt the end of the novel [[talasca|Talasca]] goes through a portal into the Underspire with the ogryn Karolus. [[aveline|Aveline]]'s ghost is still active there, calling herself “[[vytarn|Redemption]]”.","w":["CSD"]}]},{"id":"phaedra","t":"Phaedra","s":"The Phaedran war in story order. 7 stops across 6 stories.","steps":[{"f":["yuxa","cogeternal","seishin","akuryo","canker","voyle","m_circle"],"h":"Origin of the war: Yuxa","x":"Source: _The Greater Evil_.\n\nA young [[seishin|Por'o Seishin]] sends a tau embassy to the skyhive Scitalyss-Altus in the [[yuxa|Yuxa system]] ([[phaedra|Phaedra]]'s system) to accept its conversion to the Greater Good. The hive is actually run by a genestealer cult, the [[cogeternal|Cog Eternal]].\n\nAt the end, Commander [[akuryo|Akuryo]] (crimson armour, five-armed sunburst) goes into the hive with the Ethereal Kyuhai and two kroot, Rukh and Zeljukh.","w":["GE"]},{"f":["jhikaara","obarai","m_mirror"],"h":"Jhi'kaara's origin","x":"Source: _Out Caste_.\n\nTau fire warrior [[jhikaara|Jhi'kaara]] is scarred on [[obarai|Oba'rai]], a world the tau conquered brutally, and renames herself “the broken mirror”.\n\nThe name “Oberai” recurs elsewhere. Notably, the 77th Oberai Redeemers defect to the tau on [[phaedra|Phaedra]] in _Fire Caste_.","w":["OC"]},{"f":["coil","sleeper","jhikaara","brinedogs","polycaptain","abel","tome"],"h":"Altar of Maws","x":"Source: _Altar of Maws_. During the war.\n\nA tau convoy, including [[jhikaara|Jhi'kaara]], is escorting Imperial prisoners along a river in [[coil|the Coil]]. The convoy leaves the river and enters a lake that is not on any map. The mad captain of the gunboat _Polyphemus_ sacrifices the convoy to wake [[sleeper|the Sleeper Beneath]], a soul-eating entity in the lake.\n\nThe prisoners are [[brinedogs|Brine Dogs]] from Hook's Sink, the regiment of _Cold Covenant_.","w":["AM"]},{"f":["asharil","bunker","jhikaara","lem","seishin"],"h":"A Sanctuary of Wyrms","x":"Source: _A Sanctuary of Wyrms_. During the war.\n\n[[seishin|O'Seishin]] sends the envoy [[asharil|Asharil]], with [[jhikaara|Jhi'kaara]] as guide, into [[coil|the Coil]]. She finds an [[bunker|Inquisition bunker]] containing tyranid specimens and a dead Deathwatch team. The tyranid strain has merged with [[phaedra|Phaedra]]'s fungus.\n\nThis may be the facility the Inquisition built for [[lem|Magos Lem]] in _The Walker in Fire_.","w":["SW"]},{"f":["iverson","cutler","templeton","gurdjief","akuryo","abel","bell","canker","reve","m_condemns"],"h":"Fire Caste","x":"Source: _Fire Caste_. About 50 years into the war.\n\nThe Imperial commander and [[seishin|O'Seishin]] are secretly keeping the war in stalemate. The [[arkan|19th Arkan Confederates]] arrive.\n• Commissar [[iverson|Iverson]] loses an arm and eye to [[jhikaara|Jhi'kaara]] and finds [[akuryo|Akuryo]]'s armour as a kroot totem.\n• Captain [[templeton|Templeton]] walks into a coral temple and disappears (later [[cross|Cross]]).\n• Confessor [[gurdjief|Gurdjief]], who met Akuryo inside [[coil|the Coil]], is killed by Colonel [[cutler|Cutler]] and sinks into the water (later the [[martyr|Undying Martyr]]).","w":["FC"]},{"f":["requiemship","cutler","seishin","iverson","abel","darkman"],"h":"The Requiem of Virtue enters the warp","x":"Source: _Fire Caste_.\n\n[[cutler|Cutler]] forces the flagship [[requiemship|Requiem of Virtue]] into the warp with no Navigator. Aboard are Cutler, [[seishin|O'Seishin]], [[iverson|Iverson]]'s body and the remainder of the 19th. Destination unknown.","w":["FC"]},{"f":["kaul","roach","reve","phaedra","iverson"],"h":"Vanguard: after the war","x":"Source: _Vanguard_.\n\nThe war stops: both sides' supplies and communications cease without explanation. Magos [[kaul|Caul]] (Kaul in _Fire Caste_) has rebuilt dead [[arkan|Arkan]] soldiers as skitarii, including [[roach|Roach and Van Hal]]. His Alpha Primus may be [[reve|Reve]]. A warp storm forms over the planet. Caul is killed by the Navigator he captured to escape.","w":["VG"]}]},{"id":"sarastus","t":"Sarastus","s":"Hive Carceri before and after its fall. 7 stops across 6 stories.","steps":[{"f":["sarastus","chel","vedas","vlg","m_within","m_lie"],"h":"Nightbleed: before the fall","x":"Source: _Nightbleed_.\n\nHive Carceri on [[sarastus|Sarastus]], under its dome. Blackouts are increasing. The poor are fed “Vita Ephemera”, processed from the dead (souls included). A new additive, [[vlg|VLG-01]], arrives from an ancient barrel engraved “[[m_within|As within, so without]]”, on a requisition signed “Vedas” (see [[vedas|Olber Vedas]]).","w":["NB"]},{"f":["chel","needle","vlg","m_legion","truenight"],"h":"Chel Jarrow becomes the Needleman","x":"Source: _Nightbleed_.\n\nThe cultist Skreech dresses as “the Needleman”, a figure from local myth, and predicts that the “Night Below” will rise like an obsidian needle and break the dome. [[chel|Chel Jarrow]] drinks [[vlg|VLG-01]], kills Skreech, takes his mask, and physically becomes a real Needleman. The story ends: “[[truenight|True Night]] drew a little closer.”","w":["NB"]},{"f":["izaq","mothersneddon","nineteen","bosch","canopic","sunlights","barka","truenight","tome"],"h":"Nightshift Nineteen: the Lightkeepers","x":"Source: _Nightshift Nineteen_. Some years after _Nightbleed_, before [[truenight|True Night]].\n\n[[izaq|Izaq Sneddon]], raised in [[barka|Barka Tower]] by the psychic zealot [[mothersneddon|Mother Sneddon]], is ordained a Lightkeeper of the [[canopic|Canopic Congregation]] and assigned the number 19. As a boy he investigated the floor-131 murder from the end of _Nightbleed_ and met [[nineteen|Nineteen Ascendant]] in the sealed apartment 19. It has waited in him since, to be carried “to the stars it loathes”.\n\nHis shift chief [[bosch|Bryn Bosch]] is haunted by a crewman who died in the shrine of a dead [[sunlights|Sunlight]]. The dome's Sunlights are failing and nobody can fix them.","w":["NN","NB"]},{"f":["jonah","sarastus","blacksun","truenight","m_lie"],"h":"True Night","x":"Source: _Requiem Infernal_ (backstory).\n\nPermanent darkness falls on [[sarastus|Carceri]]. [[jonah|Jonah Tythe]]'s twin sister Mina dies on the first night; the dead of [[truenight|True Night]] do not decay.","w":["RI"]},{"f":["needle","yehzod","zeth","nightlords","darkman","escher","m_lie"],"h":"Nightfall","x":"Source: _Nightfall_.\n\nCarceri is the last living hive on [[sarastus|Sarastus]]. Every 13 years the [[nightlords|Night Lords]] of Lord Vassaago come for tribute: children thrown into the hive's top tier. In the plaza stands [[needle|the Needle]], a daemonseed planted by the sorcerer [[yehzod|Yehzod]].\n\nThe boy [[zeth|Zeth]] was taught to listen to the Needle by a “scarred prophet”. Possibly [[darkman|the scarred dark man]] (speculative). Vassaago takes Zeth with him.","w":["NF"]},{"f":["killteam","malvoisin","lem","hauko","templeton"],"h":"The Walker in Fire","x":"Source: _The Walker in Fire_. Centuries after the fall.\n\nDeathwatch [[killteam|Kill Team Sabatine]] is sent to dead [[sarastus|Carceri]] to kill a rogue magos. One member falls into a bottomless pit. [[malvoisin|Malvoisin]] is wounded and disappears. The magos, [[lem|Nedezdha Lem]], is in fact defecting to the Inquisition with xenos specimens. The mission was arranged by [[escher|Escher]]'s agent [[hauko|Hauko]].","w":["WF"]},{"f":["needle","gharth","calaveraC"],"h":"The Needle named elsewhere","x":"Sources: _Cast a Hungry Shadow_, _Cult of the Spiral Dawn_, _Fire Caste_.\n\nOn [[vytarn|Redemption]], the Scorched Creed of [[gharth|Gharth]] chants “The [[needle|Black Needle]] unweaves the world”. In _Cult of the Spiral Dawn_ the Inquisition's corrupted orbital station broadcasts the same words. In _Fire Caste_ [[templeton|Templeton]] speaks of “the needle-storm that unstitched time”.","w":["CHS","CSD","FC"]}]},{"id":"dark","t":"The scarred dark man","s":"Every appearance, and the case for Iverson. 6 stops across 4 stories.","steps":[{"f":["providence","darkman","cutler","bell","m_unfold"],"h":"Trinity, Providence","x":"Source: _Fire Caste_ (backstory).\n\nIn the frontier town of Trinity on [[providence|Providence]] there is a [[bell|daemon bell]] (“The bell tolls, the world unfolds”). At the centre of the town's corruption is [[darkman|a tall man]] in a black greatcoat and wide-brimmed hat, with a lattice of glowing scars, one dead eye and one augmetic eye. He says he is “just a man who found his way back home”.\n\nColonel Cutler, the witch [[cutler|Skjoldis]] and Kjordal fight him. Kjordal cuts the bell's chain and the man falls “somewhere else”.","w":["FC"]},{"f":["iverson","darkman","bell","m_lie","arkan"],"h":"Iverson","x":"Source: _Fire Caste_.\n\nCommissar [[iverson|Holt Iverson]] is from [[providence|Providence]]. He has razorvine scars that form a “strange geometry”, and he loses an eye (replaced by an augmetic). [[cutler|Skjoldis]] recognises him as a younger version of the man at Trinity and warns him not to go home. As he dies he tells [[abel|Abel]] “It's a lie” and “[[m_lie|It's all a lie]]”, and hears a bell tolling.","w":["FC"]},{"f":["darkman","mordaine","bell","m_lie","unity"],"h":"Mordaine's sickbed","x":"Source: _Fire and Ice_.\n\nOn [[oblazt|Oblazt]], the same [[darkman|scarred man]] appears beside [[mordaine|Mordaine]]'s bed. He says “[[m_lie|It's a lie]]” and is pulled away to a place where a [[bell|daemon bell]] is ringing.","w":["FI"]},{"f":["darkman","omazet","oblazt","blackflags"],"h":"Omazet's dream","x":"Sources: _Fire and Ice_, _Cult of the Spiral Dawn_.\n\n[[omazet|Omazet]] jumps into [[oblazt|Oblazt]]'s Ghostlands in _Fire and Ice_. In _Cult of the Spiral Dawn_, in a coma, she dreams of walking that tundra beside a shadowy figure whose face has “harrowed geometry”. Probably the [[darkman|scarred man]].","w":["FI","CSD"]},{"f":["darkman","zeth","needle","m_lie","nightlords"],"h":"The “scarred prophet” of Nightfall","x":"Source: _Nightfall_. Speculative.\n\n[[zeth|Zeth]] learned to listen to the [[needle|Needle]] from a “scarred prophet”. “[[m_lie|It's a lie]]” is also a slogan on [[sarastus|Sarastus]]. No physical description is given, so this link is weak.","w":["NF"]},{"f":["darkman","jonah","m_circle"],"h":"Comparison with Jonah Tythe","x":"Source: _Requiem Infernal_. Echo only.\n\n[[jonah|Jonah]]'s scar is caused by a bullet he fires himself, centuries later. The [[darkman|dark man]] is (probably) [[iverson|Iverson]] returning to his home world. Both are closed time loops.","w":["RI"]}]},{"id":"calavera","t":"The Calavera and the Inquisition","s":"Escher, Mordaine and the one-eyed ancient. 6 stops across 6 stories.","steps":[{"f":["escher","calavera","aphelion","m_legion","mordaine"],"h":"Escher and the Calavera","x":"Source: _Fire and Ice_.\n\n[[escher|Aion Escher]] is Grand Master of the Damocles Conclave of the Ordo Xenos. [[calavera|The Calavera]], a Space Marine with a bronze skull riveted over his face and a single crystal eye, reveals that he infiltrated the conclave two decades earlier and that Escher was his agent. He says he has no Chapter because he is “Legion” (suggesting, but never stating, the Alpha Legion).","w":["FI"]},{"f":["calavera","mordaine","farsight","ujurakh","omazet","unity","kreeger"],"h":"Fire and Ice","x":"Source: _Fire and Ice_.\n\nOn a train across [[oblazt|Oblazt]] during the [[unity|Unity uprising]], [[calavera|the Calavera]]:\n• escorts [[farsight|Commander Farsight]] on a long walk between worlds;\n• controls the kroot shaper [[ujurakh|Ujurakh]];\n• heals [[mordaine|Haniel Mordaine]] and reveals that [[escher|Escher]]'s mind was implanted in him;\n• offers [[omazet|Omazet]] death or a leap of faith (she jumps).","w":["FI"]},{"f":["mordaine","calaveraC","cross","vytarn","spiraldawn"],"h":"The Calavera Conclave on Redemption","x":"Source: _Cult of the Spiral Dawn_.\n\n[[mordaine|Mordaine]], now an inquisitor, runs the [[calaveraC|Calavera Conclave]], named after [[calavera|the Calavera]] and using [[escher|Escher]]'s sayings as passwords. It has watched [[vytarn|Redemption]] for over a century, deliberately luring pilgrims there as test subjects. He ends the novel allied with [[cross|Cross]].","w":["CSD"]},{"f":["calavera","gharth","tornprophet","scorched","m_eye"],"h":"The “one-eyed ancient”","x":"Sources: _Cast a Hungry Shadow_, _Requiem Infernal_.\n\n• [[gharth|Gharth]] was led to the fire by “his god's one-eyed herald”, also called “the ancient”.\n• The narrator of _Requiem Infernal_'s afterword, “a Torn Prophet” (see [[tornprophet|the Torn Prophet]]), says it glimpsed “the one-eyed ancient in a parable of fire and ice” and has been tracked by him since.\n\nBoth descriptions fit [[calavera|the Calavera]]. Not stated.","w":["CHS","RI"]},{"f":["escher","hauko","lem","killteam","sarastus"],"h":"The Walker in Fire","x":"Source: _The Walker in Fire_.\n\n[[escher|Escher]]'s agent [[hauko|Hauko]] lets a Deathwatch team believe they are killing a rogue magos. The real objective is to extract [[lem|Magos Lem]] and her four-armed, blue-shelled xenos specimens. The Inquisition is building her a “sanctuary” on a backwater world.","w":["WF"]},{"f":["escher","phaedra","bunker","kreeger","asharil"],"h":"Escher and Phaedra","x":"Sources: _Fire and Ice_, _A Sanctuary of Wyrms_.\n\n[[escher|Escher]] previously led an Inquisition taskforce to [[phaedra|Phaedra]]. _A Sanctuary of Wyrms_ finds an [[bunker|Inquisition xenos lab]] on Phaedra with a dead Deathwatch team. It may be [[lem|Lem]]'s “sanctuary” (strong inference, not stated).","w":["FI","SW"]}]},{"id":"crossings","t":"Connections between stories","s":"Objects, places and phrases that link the books. 5 stops.","steps":[{"f":["tome","jonah","polycaptain","verlaine"],"h":"The Requiem Infernal as a book in the setting","x":"[[jonah|Jonah]]'s book [[tome|_The Requiem Infernal_]] is quoted as an in-universe text in the epigraphs of _Altar of Maws_ (section “Crossing the Mire World”, on [[phaedra|Phaedra]]) and _Aria Arcana_ (section “Resplendent Shadows”, on the Angels).","w":["AM","AA"]},{"f":["coil","gurdjief","martyr","malpertuis","tristesse","templeton","cross"],"h":"The Coil connects Phaedra and Malpertuis","x":"[[gurdjief|Gurdjief]] sinks in [[coil|the Coil]] on [[phaedra|Phaedra]] and emerges from the River [[tristesse|Tristesse]] on [[malpertuis|Malpertuis]]. The Coil also distorts time: Gurdjief's decades inside took under a year, and [[templeton|Templeton]] vanishes in a coral temple there and reappears decades later as [[cross|Cross]].","w":["FC","SW","AM","CT","SB","RV","TP","RI","CSD"]},{"f":["aphelion","esseker","calavera","verlaine","caravaggio","reverie"],"h":"The Aphelion","x":"The name [[aphelion|Aphelion]] is used for: the crystal web at the core of the [[reverie|Reverie]] (also called the Razor); a painting sold by [[esseker|Alina Esseker]]; the crystal in [[calavera|the Calavera]]'s eye; and the web of light [[verlaine|Verlaine]] is taken into.","w":["RV","RI","FI","AA","TP","CHS","SB"]},{"f":["vedas","sarastus","lastcandle","vlg","truenight"],"h":"Vedas on Vytarn and Sarastus","x":"[[vedas|Olber Vedas]] inserted himself into the history of the [[lastcandle|Last Candle]] on [[vytarn|Vytarn]]. In _Nightbleed_ a requisition signed “Vedas” brings the corrupting additive [[vlg|VLG-01]] to [[sarastus|Sarastus]]. Both worlds fall.","w":["NB"]},{"f":["lem","spiralfather","cogeternal","voyle","kliest","bunker"],"h":"Genestealer strains","x":"Genestealers move between stories on derelict ships: the _Halvorsen_ near [[kliest|Kliest]] ([[voyle|Voyle]]), the _Obariyon_ on [[vytarn|Redemption]], and the freighter that escapes at the end of _Cult of the Spiral Dawn_.\n\nRelated four-armed, blue- or indigo-shelled creatures appear in [[lem|Lem]]'s tanks, frozen in the [[aphelion|Aphelion]] (_The Reverie_), and as the [[spiralfather|Spiral Father]]. The [[cogeternal|Cog Eternal]] at [[yuxa|Yuxa]] is a separate cult. Whether these are one strain is not stated.","w":["CSD"]}]}];
const QUESTIONS=[{"q":"Is the scarred dark man Holt Iverson?","b":"For: he has [[iverson|Iverson]]'s scar lattice and a dead eye beside an augmetic one; [[cutler|Skjoldis]] recognises Iverson as a younger version of the man at Trinity; both are tied to a tolling bell; the [[darkman|dark man]]'s words to [[mordaine|Mordaine]] (“[[m_lie|It's a lie]]”) are what Iverson says as he dies. In 2015 Fehervari spoke of “unfinished business” with Iverson. Against: nothing in the text names him. Open: what he wants, and whether he is also the “scarred prophet” of _Nightfall_ (no description is given there)."},{"q":"Is the Undying Martyr Yosiv Gurdjief?","b":"For: same build and hair; a stomach wound matching [[cutler|Cutler]]'s sabre; “Is this a dream?” followed by “Do I still dream?”; the [[sunken|Lethean]] creed “[[m_condemns|The Emperor condemns]]”. Against: never stated. Timing: in the author's reading order [[martyr|the Martyr]] reaches [[malpertuis|Kanvolis]] before _Fire Caste_, where [[gurdjief|Gurdjief]] sinks. Fehervari has said time in [[coil|the Coil]] does not run entirely in a straight line, so this need not be a contradiction."},{"q":"Where does Athanazius end?","b":"_The Sins of My Brothers_ shows his body killed in [[purge|the Purge]] and then his host, Carriére, stabbed at the colonnade. Yet _Requiem Infernal_'s epigraph calls him “Chief Librarian Illuminant”, and he foresaw himself performing a ritual on the [[deadrock|Deadrock]]. He also says he is “lost on some spins of the Great Wheel”, which may allow for more than one outcome."},{"q":"Who is the Torn Prophet?","b":"[[castaneda|Castaneda]] is the main candidate: he “tore himself from the thread of being… Or was torn”, and one [[lastcandle|Last Candle]] origin myth makes the Prophet a fallen Space Marine who beat a daemon. Against: the afterword of _Requiem Infernal_ uses “a [[tornprophet|Torn Prophet]]” as though it were a title others can hold, and its narrator is a wanderer between stories rather than a founder."},{"q":"Who and what is the Calavera?","b":"A Space Marine with a bronze skull riveted to his own, whose single crystal eye he calls the [[aphelion|Aphelion]]. He says “I have no Chapter… for [[m_legion|I am Legion]]”, owned a Grand Master of the Inquisition, and escorts [[farsight|Farsight]]. Fehervari's favourite Legions are the Thousand Sons and the Alpha Legion, but no story names his. He is very probably the “one-eyed ancient” of _Requiem Infernal_'s afterword and [[gharth|Gharth]]'s “one-eyed herald”."},{"q":"What is the Aphelion?","b":"The name covers a crystal web at the core of the [[reverie|Reverie]] ([[aphelion|the Razor]] of _Requiem Infernal_), a painting sold by an [[esseker|Esseker]], [[calavera|the Calavera]]'s eye, and the web [[verlaine|Verlaine]] is carried into. Whether these are one thing seen from different angles, or the name is simply recurring, is not stated."},{"q":"What are the Rhapsody Arcane for?","b":"[[satori|Satori]] says they will be kept “in the substrata” until required and will one day carry their message “back into the Grey”. Fehervari has said the [[resplendent|Angels Resplendent]] and Penitent are among the threads he plans in advance."},{"q":"How are the genestealer strains connected?","b":"The [[cogeternal|Cog Eternal]] at [[yuxa|Yuxa]]; the derelict _Halvorsen_ near [[kliest|Kliest]]; [[lem|Lem]]'s four-armed, blue-shelled specimens on [[sarastus|Sarastus]]; the four-armed blue creature frozen in the [[aphelion|Aphelion]]; the [[spiraldawn|Spiral Dawn]] on [[vytarn|Redemption]]; and the cult freighter that escapes at the end of _Cult of the Spiral Dawn_. Whether these are one lineage is not stated."},{"q":"Is Lem's 'sanctuary' the bunker in A Sanctuary of Wyrms?","b":"For: the Inquisition is building [[lem|Lem]] a facility on a backwater world for her xenos research; the bunker on [[phaedra|Phaedra]] is an Inquisition xenos lab with a dead Deathwatch team. Against: the dead magos in the bunker is male, and the bunker's specimens are tyranid, not described like Lem's."},{"q":"Where did the Requiem of Virtue go?","b":"Cutler forced it into the warp with no Navigator, carrying [[cutler|Skjoldis]]'s soul, [[seishin|O'Seishin]], [[iverson|Iverson]]'s body and the remnant of the [[arkan|19th Arkan]]. If the [[darkman|dark man]] is Iverson, something aboard came out again."},{"q":"What happened to Malvoisin on Sarastus?","b":"He arrived with “an iron barb” already in his soul; an irradiated bullet cut a crown into his brow, he said “[[m_lie|It's a lie]]… We condemn ourselves”, and his body vanished. He next appears as the Master Chaplain who proclaims [[martyr|the Martyr]]. What happened in between is not told."},{"q":"How many times did True Night fall, and which one killed Jonah's sister?","b":"_Nightfall_ says [[truenight|True Night]] “had touched [[sarastus|Sarastus]] three times”, each time killing more of the hives. _Requiem Infernal_ does not say which of these was Mina's first night."},{"q":"What is Nineteen Ascendant?","b":"For it being Chel: it is met in her apartment soon after her husband's murder; it is drawn as the flower-mandala she followed in _Nightbleed_; it has the [[chel|Needleman]]'s multi-jointed body and rhyme. For something larger: _Nightbleed_ presents the Needleman as an imitation of a “supernal entity”; Nineteen is also inside Izaq, appears years later in the watchtower lift, and rewrites Bosch's past. Open: whether carrying it “to the stars it loathes” is how the Sunlights fail and [[truenight|True Night]] falls."},{"q":"How old is the Diadem?","b":"_Fire Caste_ dates the refinery to [[phaedra|Phaedra]]'s “first pacification”, “almost a thousand years old”. _Vanguard_ says [[kaul|Caul]] built it around his explorator ship “nearly two centuries ago”. Either the books disagree or the two describe different things."},{"q":"Vassago and Vassaago","b":"The [[blackflags|8th Vassago Black Flags]] (with their “Lays of Vassago”) and the Night Lord [[nightlords|Vassaago]]. Vassago is also a demon in the _Ars Goetia_. Any connection between the regiment and the Night Lord is unconfirmed."},{"q":"Who is the black-feathered king?","b":"From [[zeth|Zeth]]'s vision in _Nightfall_: “a black-feathered king dying from within and without”. Candidates include [[cutler|Cutler]], “the Whitecrow”, and Sevastin, “the Black Wing”, who dies on [[sarastus|Sarastus]]. Neither fits cleanly."},{"q":"What does 'VLG' stand for?","b":"The additive that poisons [[sarastus|Carceri]] in _Nightbleed_ comes from a barrel marked “VLG”, requisitioned under the name “[[vedas|Vedas]]”. The letters are never explained."},{"q":"What happened on Oblazt?","b":"The [[unity|Unity revolution]], [[calavera|the Calavera]]'s train, [[omazet|Omazet]]'s leap, the [[esseker|Esseker]] mansion and the [[mirror|Mirror of Athanazius]] all belong to one ice world, and the [[blackflags|Black Flags]] were later betrayed there. _Cold Covenant_, set on [[oblazt|Oblazt]], is not yet covered here."}];
const REFS={"czervantes":[["lit","S","Miguel de Cervantes, _Don Quixote_. The Knight Resplendent leaves on “dream quests” and is declared lost, like Cervantes's knight-errant chasing visions."],["lit","S","Birth name Darioc Graal: “graal” is the French form of “grail” (the Arthurian quest object)."],["lit","C","Varzival: Parzival, the grail knight of Wolfram von Eschenbach (and Wagner's _Parsifal_). Fits his birth name Graal and his dream quests."]],"castaneda":[["ideas","S","Carlos Castaneda, whose books (from _The Teachings of Don Juan_, 1968) describe an apprenticeship in sorcery and entry into a “separate reality”. Xøren Castaneda deliberately opens a rift into another reality and then leaves this one."],["ideas","P","Xøren: the spelling recalls Søren Kierkegaard, philosopher of faith, despair and the “leap”."]],"satori":[["ideas","S","Satori: Zen Buddhist term for sudden enlightenment. Compare [[verlaine|Verlaine]]'s “revelation” at the end of _Aria Arcana_, which the story frames as false."],["arts","P","Hanzo Gyguerre, the champion Satori kills: H. R. Giger, and the ninja Hattori Hanzo."]],"gurdjief":[["ideas","S","G. I. Gurdjieff (died 1949), mystic teacher of the “Fourth Way”, which holds that people live in a kind of waking sleep and must be woken. Compare “Is this a dream?” / “Do I still dream?”"]],"martyr":[["ideas","S","Christ imagery: a wound in the side, rising from water, a prophet of suffering. “Crown of thorns” completes the set."]],"vedas":[["ideas","S","The Vedas: Hindu scriptures; “veda” means knowledge. Fits a collector of knowledge and secrets."],["ideas","P","Olbers' paradox: the astronomical question of why the night sky is dark. Vedas's barrel helps bring permanent darkness to [[sarastus|Sarastus]]."],["ideas","T","His full name, Olber Immanuel Vedas: Immanuel Kant."]],"reverie":[["lit","S","Jorge Luis Borges (labyrinths, mirrors, forking time). Much of _The Reverie_ is the log of Apothecary Juan Borges."],["lit","S","The Otranto Fjordlands on [[malpertuis|Malpertuis]]: _The Castle of Otranto_ (1764), considered the first Gothic novel."],["lit","C","Edgar Allan Poe: _The Reverie_ quotes “The Raven” as the work of “Lord Po, Ancient Terran Heretic”."],["lit","S","Ennio Zann, the composer: Erich Zann, the doomed musician of Lovecraft's “The Music of Erich Zann”. Possibly also Ennio Morricone."],["ideas","C","Zann begins his symphony “both Alpha and Omega” (Revelation 22:13)."],["ideas","C","Anima Torquentor: Latin, roughly “tormentor of the soul”."],["ideas","P","“Until the Wheel of Fate is broken”: the Wheel of Fortune of Boethius and the tarot."],["lit","P","“A dark bell tolls in the abyss… And so, the bell tolls on”: John Donne's “for whom the bell tolls”. Compare [[bell|the daemon bell of Trinity]]."],["arts","P","Tourneur, “the pretender's creature”: Jacques Tourneur (director of _Cat People_) or Cyril Tourneur (_The Revenger's Tragedy_)."],["arts","P","Exemplars named together, Korda, Fuentes and Vonnegut: producer Alexander Korda, novelist Carlos Fuentes and Kurt Vonnegut. Also Goseki (Goseki Kojima, artist of _Lone Wolf and Cub_)."],["ideas","P","Inanna, a murdered woman [[czervantes|Varzival]] remembers: the Sumerian goddess who descends to the underworld."],["arts","T","Orzon Cassavius (John Cassavetes); Epistolary Frontiere (Dominic Frontiere, composer for _The Outer Limits_); Harlan Decker (Harlan Ellison; _Blade Runner_'s Deckard); Manzoni (Alessandro Manzoni); Exemplar Murakami here and Sister Haruki in _Requiem Infernal_ (Haruki Murakami)."]],"malpertuis":[["lit","C","_Malpertuis_ (1943), novel by the Belgian writer Jean Ray: a house in which the old Greek gods are trapped in human form. One of them is the Gorgon Euryale, the name [[marisol|Marisol]] takes."],["arts","S","The Chiaroscuro System: chiaroscuro is the painting technique of strong light and dark contrast."],["ideas","C","Hamartia Krye, a Kanvolis aristocrat: hamartia is Aristotle's “tragic flaw”."],["ideas","S","Alecto, one of a nobleman's bodywardens: one of the three Furies."],["arts","P","The Sable Kiss essence Yuzna: Brian Yuzna, body-horror director of _Society_."]],"marisol":[["lit","C","Euryale: one of the three Gorgons of Greek myth (immortal sister of Medusa). A disguised Euryale also appears in Jean Ray's _Malpertuis_."]],"caravaggio":[["arts","C","Caravaggio (1571–1610): painter known for chiaroscuro and a violent life; he killed a man. Compare the Chiaroscuro System and this Exemplar's murders."],["arts","P","His full name is Yukio Klaus Caravaggio. Klaus: perhaps Klaus Kinski, star of Herzog's _Aguirre_, which Fehervari recommends."],["lit","P","Yukio: Yukio Mishima, the novelist whose work fuses beauty, violence and ritual death. Compare the Angels' cult of beauty."]],"athanazius":[["lit","S","His “risen name” Calvino: Italo Calvino, author of _Invisible Cities_ and _If on a Winter's Night a Traveller_ (nested, self-aware fiction)."],["ideas","S","Athanasius: Greek for “immortal”. He survives his death by moving his soul into another body."],["ideas","P","Athanasius Kircher (17th-century Jesuit scholar of hieroglyphs and the occult). _Fire Caste_ separately has a Sky Marshal Kircher."]],"m_goes":[["lit","C","Refrain of Kurt Vonnegut's _Slaughterhouse-Five_ (1969), said after every death. Its hero, Billy Pilgrim, is “unstuck in time”. _The Reverie_ also has a Resplendent named Vonnegut, and [[czervantes|Czervantes]] paints [[satori|Satori]] as “the Pilgrim”."]],"verlaine":[["lit","C","Paul Verlaine, French Symbolist poet. His squad includes a Brother Rimbaud: Arthur Rimbaud was Verlaine's lover, whom Verlaine shot in 1873."],["arts","S","“It's full of scars”: echoes “My God, it's full of stars!” from Arthur C. Clarke's _2001: A Space Odyssey_."],["arts","S","Squad Mythodea: _Mythodea_ (1993), choral symphony by Vangelis, used by NASA for the 2001 Mars Odyssey mission."],["arts","S","Other squad names are artists and scientists: Visconti and Cimino (film directors), Uderzo (_Asterix_ illustrator), Huygens (astronomer)."]],"rhapArcane":[["arts","C","Musical naming throughout the Rhapsodies: aria, rhapsody, “arcane”. Each [[rhapEternal|Ninth Rhapsody]] vehicle has its own composed aria."],["w40k","S","The crystal disc is a Disc of Tzeentch; the manta-like sky beasts match Screamers of Tzeentch. [[verlaine|Verlaine]] ends as something like a Tzeentch herald."]],"aphelion":[["ideas","C","Astronomy: aphelion is the point of an orbit farthest from the sun; perihelion is the nearest. The Ring's central mount is the Perihelion."]],"resplendent":[["w40k","C","Blood Angels successor Chapter: Sanguinius, the Black Rage, the Death Company. Fehervari's own creation."],["w40k","S","The Angels Vermillion (in _The Reverie_ the Empyrean Rhapsody's Exemplar, Xalieri, has befriended one of their ambassadors) are a Blood Angels successor that exists in wider 40K background."],["arts","P","Giacommeti (_The Sins of My Brothers_): the sculptor Alberto Giacometti."]],"malvoisin":[["lit","P","Albert and Philip de Malvoisin, Templar characters in Walter Scott's _Ivanhoe_. The name is French for “bad neighbour”."],["lit","C","Icharos: Icarus, who flew too close to the sun on wings of wax and fell. The [[resplendent|Angels Resplendent]]'s battle cry is [[m_wings|'We rise on burning wings']]; Malvoisin falls and rises again as a Penitent."]],"montaig":[["lit","P","Michel de Montaigne, the essayist of scepticism and private reflection. Montaig keeps a forbidden book."]],"crown":[["ideas","C","The crown of thorns from the Passion of Christ. The Penitents' Paths of Chains and Thorns recall medieval flagellants."]],"tristesse":[["ideas","C","French for “sadness”."]],"jonah":[["ideas","C","Jonah: the biblical prophet who flees his mission, is swallowed, and is returned. “Tythe” suggests tithe (a tenth given up)."],["lit","S","His first daemon, the Ruzhalka, is the rusalka of Slavic folklore, a water spirit."],["lit","S","Jonah, whose sister is Mina: Jonathan and Mina Harker of _Dracula_. Compare the biblical Jonah above, and the other _Dracula_ names in the book (see [[vytarn|Vytarn]])."]],"asenath":[["lit","S","Asenath Waite in H. P. Lovecraft's “The Thing on the Doorstep” (1937), a woman whose body is shared with another mind. Also Asenath, wife of Joseph in Genesis."],["lit","P","Hyades: in Greek myth, sisters who wept themselves into a star cluster. Asenath and Mercy end as the “Sisters Discordant”."],["ideas","C","The hospital ship _Asclepius_: the Greek god of medicine."],["ideas","P","Canoness Sanghata, whom Asenath poisons “at their last supper”: Saṃghāta, the crushing hell of Buddhist cosmology. The “last supper” is a second, Christian echo."]],"deliverance":[["ideas","P","Puritan virtue names: Deliverance, [[asenath|Mercy]]."]],"incarnates":[["ideas","S","The Christian virtues. The Ring's list (Veritas, Clementia, Temperans, Vigilans, Humilitas, Caritas, Castitas) is a variant of the seven heavenly virtues."]],"vytarn":[["ideas","C","Koronatus: from Latin “coronatus”, crowned."],["w40k","C","Wraithbone and spirit stones are Eldar technology; the Ring's link to the webway is 40K Eldar lore."],["lit","C","Umberto Eco's _The Name of the Rose_: named by Fehervari as the main literary inspiration for _Requiem Infernal_."],["lit","C","Vampire fiction: Fehervari has said the Celestians Camille, Marcilla (an anagram of Carmilla) and Genevieve, and the Breacher Grout, are deliberately vampiric names."],["lit","S","A _Dracula_ cast is hidden in _Requiem Infernal_. [[asenath|Asenath]] crosses the storm-wracked Exodus Gulf on the _Blood of Demeter_ (the _Demeter_ carries Dracula to Whitby). Also: [[jonah|Jonah]]'s sister Mina (Mina Harker); Sister Lucette Vestrana (Lucy Westenra); Breacher Rem Rynfeld (Renfield); Blast Breacher Quinzy (Quincey Morris)."],["arts","S","Vampire film and fiction: Preacher Murnau (F. W. Murnau, director of _Nosferatu_); Bugaeve Krolock (Count von Krolock in Polanski's _The Fearless Vampire Killers_); Corporal Varney (_Varney the Vampire_); Commodore Barnabas Rand (Barnabas Collins of _Dark Shadows_); Chirurgeon Akaishi Bhatori (Elizabeth Báthory, the “blood countess”)."],["arts","P","Further vampire and horror names: Specialist Schroyder (Max Schreck, Murnau's Orlok); Sister Orlanda (Orlok); Sister Claudia, eldest of the hidden children (Anne Rice's child vampire); Hospitaller Madeleine (Madeline Usher); “Pretorius” (Dr Pretorius in _Bride of Frankenstein_)."],["arts","T","Avram Santino (Abraham Van Helsing); Lieutenant Vanzynt Reiss (a “Van”); Foree (Ken Foree of _Dawn of the Dead_)."],["arts","P","Lord Commissar Artemiev, whose memoirs are quoted: Eduard Artemyev, composer for Tarkovsky's _Solaris_ and _Stalker_."],["lit","P","Verloc, who says “There are changes coming”: the anarchist in Conrad's _The Secret Agent_."],["ideas","C","Preceptor Hagalaz: the rune of hail and disruption."],["ideas","C","The Tabula Rasa, the surgical table on which people are remade: Locke's “blank slate”."]],"m_within":[["ideas","C","Hermeticism. “As above, so below” paraphrases the _Emerald Tablet_ attributed to Hermes Trismegistus. “As within, so without” is a common modern occult extension of it."]],"spiraldawn":[["ideas","S","The name echoes the Hermetic Order of the Golden Dawn (Victorian occult society); the cult's liturgy uses the Hermetic maxim."],["lit","S","Cult names come from world folklore: Gualichu (Gualicho, an evil spirit of Patagonian folklore); Tizheruk (a sea monster of Alaskan Inuit folklore); Iaoguai (yaoguai, Chinese demons); Chrysaor (in Greek myth the son of Medusa, “golden sword”; the cult's Primus wields a bonesword)."],["lit","S","The freighter _Obariyon_: a Japanese yōkai that leaps onto a traveller's back and grows heavier."],["arts","P","Junji Ito's manga _Uzumaki_, about a town consumed by spirals."],["w40k","C","Released alongside Games Workshop's 2016 Genestealer Cults range. The cult structure (Patriarch, Magus, Primus, Purestrains, Aberrants) is standard 40K."],["ideas","S","Trazgo, a cultist: the _trasgo_, a goblin of Iberian folklore. Fits the cult's folklore names."],["ideas","S","Hajnal, a cultist: Hungarian for “dawn”, in the Spiral Dawn."],["ideas","P","Sergeant Alonzo Grijalva and Captain Quezada: the conquistadors Juan de Grijalva and Gonzalo Jiménez de Quesada."],["lit","T","Virgilio: Virgil, Dante's guide."]],"etelka":[["ideas","C","Her misborn son Cicatryx: “cicatrix” is Latin for scar."]],"calavera":[["ideas","C","“Calavera”: Spanish for skull (as in Day of the Dead skulls)."],["w40k","S","“I have no Chapter… for [[m_legion|I am Legion]]” and the infiltration of an Inquisition conclave point to the Alpha Legion, whose members all claim to be Alpharius. Never stated."]],"escher":[["arts","S","M. C. Escher, artist of impossible geometry and self-referencing loops (_Drawing Hands_). This Escher's mind is reproduced inside his own protégé."],["ideas","S","Aion: the Greek god of unbounded, cyclic time, often shown inside a zodiac wheel. Fits the Escher loops."]],"lem":[["lit","S","Stanisław Lem, author of _Solaris_, about scientists trying to study an incomprehensible alien life. “Nadezhda” is Russian for “hope”."],["w40k","C","Stygies VIII and its Xenarites (tech-priests who study xenos technology) are established 40K. Her guardians (Sicarian Ruststalkers and Infiltrators, Ironstrider dragoon) are 2015 Skitarii units."]],"hauko":[["w40k","S","Grey skin, black eyes and shark teeth point to the Carcharodons (Carcharodon Astra), a reclusive void-dwelling Chapter. His remark that they thought him “too soft” would be ironic given their reputation."]],"killteam":[["w40k","C","Deathwatch, Black Shields, Salamanders Firedrakes and the White Consuls (an Ultramarines successor) are established 40K."],["w40k","S","Brotherhood of A Thousand: not known from other sources; the details point to the Thousand Sons. The Chapter “always numbers precisely one thousand”. Its badge is a black “M”, like the giant “M” of the original (pre-Prospero) Thousand Sons livery, and also the Roman numeral for a thousand. When Anzahl-M636's skull is opened, his irises are “angular rather than round – almost crystalline”, and Branatar wonders whether they are “augmetics or a mutation” (compare the Thousand Sons' flesh-change)."],["ideas","C","Anzahl: German for “number” or “count”."],["ideas","S","Gharuda, the shrine world in Branatar's memory: Garuda, the bird-king of Hindu myth."],["w40k","P","Iron Hands: also possible for the Brotherhood. Anzahl-M636 “sounded more machine than man” and reworked his armour into “geodesic shapes that venerated the Machine God”. As a Techmarine, though, some of this comes with the role."],["w40k","S","Sevastin, “the Black Wing”, is presumably of the Black Wings Chapter, which has its own Lexicanum entry. Paranoid, reclusive, and (Branatar guesses) seeking absolution, with the credo “Divided we endure”. The secrecy and the search for absolution suggest the Dark Angels and their successors, but the text gives no lineage."]],"kaul":[["ideas","P","A caul: membrane over a newborn's head, traditionally a sign of second sight or protection from drowning."],["w40k","C","_Vanguard_ features 2015 Skitarii units: Vanguard, Rangers, Ironstrider Ballistarii."]],"reve":[["lit","S","French “rêve”: dream. Compare _The Reverie_."],["lit","P","Her nickname, “Raven”: Poe again."]],"templeton":[["lit","S","Ambrose Bierce, writer of “An Occurrence at Owl Creek Bridge” (a dying man imagines his escape) who vanished in Mexico in 1914. Templeton vanishes; as [[cross|Cross]] he tells [[talasca|Talasca]] “I thought I died, but perhaps [[m_chance|nothing is chance]]”. _Fire Caste_ also has a Commissar Bierce."],["lit","S","His full name is Ambrose Phillips Templeton: Ambrose Bierce and Howard Phillips Lovecraft."]],"arkan":[["lit","S","Weird-fiction writers among the 19th's names: Machen (Arthur Machen), Blackwood (Algernon Blackwood; General Thaddeus Blackwood, Director of Internal Affairs, who covers up Trinity), Bierce (Ambrose Bierce)."],["lit","S","“Confederates”, a frontier town, a broken republic: the American Civil War and the Western."],["arts","S","Western names: Sergeant Hickox (Wild Bill Hickok); Hardin Vendrake (John Wesley Hardin); Arness (James Arness of _Gunsmoke_); Jaques Valance, ex-trapper (Liberty Valance); Gordy Boone (Daniel Boone); Willis Calhoun (John C. Calhoun, ideologue of the Confederacy); Beauregard [[roach|Van Hal]] (Confederate general P. G. T. Beauregard)."],["lit","S","More weird-fiction names: Belknap (Frank Belknap Long, of Lovecraft's circle); Major Elias Waite (Lovecraft's Waite family; compare [[asenath|Asenath Waite]]); Captain Jon Milton Machen (Milton and Arthur Machen)."],["ideas","S","Yethsemane Falls, the Arkans' great battle: Gethsemane. The Methuselah Swamplands: Methuselah."],["arts","P","Professor Chaney: Lon Chaney. Verne Loomis: Jules Verne, and Dr Loomis of _Halloween_."],["lit","P","Verne Loomis stutters “The pendulum falls… three days”, and [[abel|Abel]]'s code is “The Pendulum must fall upon the Crown”: Poe's “The Pit and the Pendulum”."],["ideas","P","Preacher Hawthorne (Nathaniel Hawthorne); Deacon Jericho, who preached it would rain frogs (Jericho; the plague of frogs in Exodus)."],["arts","T","Pericles Quint (Peter Quint, the ghost of _The Turn of the Screw_); Kletus Modine (Matthew Modine of _Full Metal Jacket_); Audie Joyce (Audie Murphy); Leonora (Poe's Lenore); Dryden; Lomax (Alan Lomax, folklorist)."],["lit","S","Arkan: close to Arkham, Lovecraft's fictional Massachusetts town. Fits the weird-fiction surnames in the regiment."]],"coil":[["lit","S","Coppola's _Apocalypse Now_: Fehervari has said it loosely inspired _Fire Caste_'s river journey. He also recommends Herzog's _Aguirre, the Wrath of God_ (conquistadors going mad on a river; compare the Verzante Konquistadores). He has said Conrad's _Heart of Darkness_ was not a direct influence."],["lit","C","Although Fehervari says _Heart of Darkness_ was not a direct influence, the phrase appears: Audie Joyce says “He asked us to follow him into the heart of darkness”."]],"providence":[["ideas","P","Trinity: name of the first atomic bomb test (New Mexico, 1945), also on a frontier."],["lit","S","Providence: Lovecraft's home city (Providence, Rhode Island). Paired with the Lovecraftian names of the [[arkan|Arkan]] Confederates."]],"phaedra":[["lit","P","The Saathlaa (“Fish”), degenerate descendants of human colonists living by the water, recall the Deep Ones of Lovecraft's _The Shadow over Innsmouth_."],["ideas","S","Dolorosa: “sorrowful”, as in the Via Dolorosa."],["arts","S","The Verzante Konquistadores: Ignatz Cabeza (Cabeza de Vaca); Aguilla de Caravajal (Gaspar de Carvajal, chronicler of the Amazon expedition and the monk-narrator of Herzog's _Aguirre_); Capitán Velasquez and his clan brother Greko (the painters Velázquez and El Greco)."],["arts","P","Gonzalo, another Konquistador: Gonzalo Pizarro, leader of the expedition in _Aguirre_."],["lit","C","The battle cruiser _Sisyphus_: Sisyphus."],["ideas","C","Commissar Niemand: German for “nobody”, the name Odysseus gives the Cyclops. Compare [[polycaptain|Polyphemus]]."],["ideas","C","Phaedra: Greek for “bright”, for a world of grey-green murk. In myth, Phaedra is the queen of Racine's _Phèdre_."]],"sleeper":[["lit","S","Lovecraft's Cthulhu: a god “dead but dreaming” under the water, served by a mad cult."],["ideas","S","Krol: Polish for “king”."]],"polycaptain":[["lit","C","Polyphemus: the cyclops of Homer's _Odyssey_."]],"sunken":[["lit","C","Lethe: the river of forgetfulness in the Greek underworld."],["lit","P","Ctholl, “the deepest of Vassago's Sunken Worlds”: Cthulhu."]],"omazet":[["ideas","S","Kalfu (Kalfou): a Vodou lwa of the crossroads and the night, associated with dangerous passages. “Le Mal Kalfu”. The [[iwujii|Iwujii]] also worship Grandfather Death."]],"oblazt":[["lit","S","_Fire and Ice_: Robert Frost's poem “Fire and Ice” (1920), on whether the world ends in fire or ice."],["ideas","C","Oblazt: from the Russian _oblast_, an administrative province."]],"sarastus":[["lit","S","Isaac Asimov's “Nightfall” (1941): a world where rare total darkness drives civilisation mad, foretold by a cult. Fehervari's story about Sarastus is also called _Nightfall_."],["arts","P","Sarastro, high priest of the sun in Mozart's _The Magic Flute_, opposed by the Queen of the Night. Sarastro's name comes from Zoroaster; see [[paladins|Zorastro]]."],["ideas","C","The Canopic Congregation (Carceri's dome-keepers): canopic jars held organs in Egyptian embalming."],["lit","S","Sarastus: close to Jukka Sarasti, the vampire who commands the ship in Peter Watts's _Blindsight_ (2006). Fehervari's short story with the special edition of _Cold Covenant_ is also called _Blindsight_, and he has used deliberately vampiric names before (see [[vytarn|Vytarn]]). Blindness recurs on Sarastus: the [[truenight|True Night]] cult's “The Blind and the Bound” (_Nightfall_) and the blind ghouls of dead Carceri (_The Walker in Fire_)."],["ideas","C","Carceri: Italian for “prisons” (Latin _carcer_)."],["arts","S","Giovanni Battista Piranesi's etchings _Carceri d'invenzione_ (“Imaginary Prisons”, 1750s): vast, dark, vaulted interiors of stairs and walkways leading nowhere."]],"chel":[["lit","C","“Will you, won't you”: from the Lobster Quadrille in Lewis Carroll's _Alice's Adventures in Wonderland_."],["arts","S","_Candyman_ (1992, from Clive Barker's “The Forbidden”): an urban-legend killer in a decaying tower block, traced through graffiti."],["arts","S","_Soylent Green_ (1973): food for the poor made from the dead. Compare Vita Ephemera."],["arts","P","The title _Nightbleed_ echoes Barker's _Nightbreed_."],["ideas","C","Her victim Rozalia Temető: “temető” is Hungarian for “cemetery”."]],"nightlords":[["w40k","C","Night Lords: the VIII Legion of Konrad Curze; raptors, talonmasters and the “Long War” are established 40K."],["ideas","S","Vassago: a demon of the _Ars Goetia_ (the Lesser Key of Solomon) who finds lost things and tells past and future. Compare Lord Vassaago and the [[blackflags|8th Vassago Black Flags]]."]],"blackflags":[["ideas","S","Vassago: a demon of the _Ars Goetia_. See the [[nightlords|Night Lords]] entry."]],"blacksun":[["ideas","P","The Sol Niger (“black sun”) of alchemy: the nigredo, the stage of decay and darkness."]],"farsight":[["w40k","C","Commander Farsight is an established 40K character (Arthas Moloch, the Dawn Blade, the Farsight Enclaves). Fehervari leaves his loyalty open; Mont'shasaar and the vash'yatol are Fehervari's additions."]],"akuryo":[["ideas","S","Akuryō: Japanese for a vengeful or evil spirit. Akuryo ends as a lost “ghost” in [[coil|the Coil]]."]],"abel":[["ideas","S","Cain and Abel. “Abel” is killed by [[iverson|Iverson]], who also murders his own comrades."],["lit","P","His code “The Pendulum must fall upon the Crown”: Poe's “The Pit and the Pendulum”."]],"thorn":[["w40k","C","Adepta Sororitas, Repentia, Canoness: established 40K."]],"esseker":[["w40k","C","The Calixis Sector, where Alina Esseker trades, is the setting of the _Dark Heresy_ roleplaying game."]],"calaveraC":[["w40k","C","Ordo Xenos and the Inquisition's conclaves are established 40K."],["lit","S","Tempestor Aickman: Robert Aickman, writer of “strange stories”. Fits the weird-fiction naming elsewhere."],["ideas","T","Logis Cheopz: Cheops."]],"darkcoil":[["ideas","P","[[talasca|Talasca]]'s painting is a picture of pattern-seeking: seeing a face and a design in the chaos of events. Fehervari leaves open whether the pattern is real."],["ideas","C","Fehervari has said the Coil concept traces back to the [[coil|Dolorosa Coil]] of _Fire Caste_, and that the name “Dark Coil” came from fans."],["ideas","C","Hungarian names run through [[coil|the Coil]]: Temető (“cemetery”), Hajnal (“dawn”), Ibolja (“violet”), Zsolt, Zsombor, Boldiszar Hörka, [[etelka|Etelka]], Benedek, Galantai, Nyulaszi. Fehervari's own surname is Hungarian."],["arts","S","Naming after film directors and artists is one of the strongest habits: [[tarsem|Tarsem]], Visconti, Cimino, Murnau, Satoshi, Yuzna, [[caravaggio|Caravaggio]], [[escher|Escher]], Bosch, Velázquez, El Greco, Giacometti."],["lit","P","“Coil”: Hamlet's “mortal coil”. The name “Dark Coil” itself came from fans."]],"m_eye":[["lit","C","Polyphemus, the cyclops."]],"tome":[["lit","C","Edgar Allan Poe: _Requiem Infernal_ quotes “A Dream Within a Dream” as an “Antediluvian Terran heresy”."]],"izaq":[["lit","S","“Step on a crack, break your mother's back”: the children's rhyme. Izaq avoids cracks in the floor, and his guilt centres on his mother."],["ideas","S","Isaac: the son Abraham binds for sacrifice (the Akedah). Izaq's mother tells him their calling is “what binds us”, and he makes blood sacrifices himself."]],"mothersneddon":[["ideas","C","“Accursed are the meek!” inverts “Blessed are the meek” (Matthew 5:5)."],["w40k","C","Her “Prime Arches” and the “Hour's Heresy” that “tore the old galactic order apart in an hour exactly” are folk garblings of the Primarchs and the Horus Heresy."],["lit","P","Her view of time (“Everything happens all at once… forever and always”) resembles the Tralfamadorians of Kurt Vonnegut's _Slaughterhouse-Five_, who see all moments at once."]],"nineteen":[["lit","C","“Will you, won't you”: Lewis Carroll's Lobster Quadrille, as in _Nightbleed_ (see [[chel|Chel]])."]],"canopic":[["ideas","C","In Egyptian embalming, canopic jars held the organs of the dead."],["ideas","C","“[[m_within|As above, so below]]” paraphrases the Hermetic _Emerald Tablet_."]],"sunlights":[["arts","P","The walled-off “Night Zones”, entered by people “looking for things nobody ought to want”, recall the Zone of the Strugatskys' _Roadside Picnic_ and Tarkovsky's _Stalker_."],["lit","P","Jeanne DuPrau's _The City of Ember_ (2003): a sealed city lit only by failing lamps that nobody knows how to repair, while its rulers pretend otherwise. Young people are given their jobs by lot on Assignment Day; compare Izaq's ordination, where crew numbers appear “seemingly at random”."]],"exordio":[["arts","S","Commissar Lemarché: Lemarchand, maker of the puzzle box in Clive Barker's _Hellraiser_. Barker is cited elsewhere on the map (see [[chel|Chel]])."]],"rhapEternal":[["arts","P","Sergeant Satoshi Atienza: Satoshi Kon, director of _Paprika_, in which dreams leak into reality."]],"aveline":[["ideas","S","Vetala: in Indian folklore, a spirit that possesses corpses. Canoness Vetala Aveline “clawed her way out” at night."]],"cross":[["lit","S","He thinks of “hollow men like Clavel”: T. S. Eliot's “The Hollow Men”. Cross is the poet [[templeton|Templeton]]."],["ideas","P","The Tetraktys gang wars of his past: the sacred triangle of the Pythagoreans."]],"voyle":[["lit","P","The story is divided into Circles (First, Second, Third, the Invisible Circle, then the Spiral): Dante's circles."],["lit","P","Captain Bester, who killed himself before the boarding: Alfred Bester."],["ideas","P","Erzul: Erzulie, a Vodou lwa. Compare Kalfu ([[omazet|Omazet]])."],["ideas","S","Rukh, an avian warrior: the roc (_rukh_), the giant bird of Middle Eastern legend."]],"jhikaara":[["ideas","C","Shas'vre Ibolja (_Altar of Maws_): Hungarian for “violet”."],["lit","T","Coraline, an ogryn: Neil Gaiman's _Coraline_."]],"mordaine":[["arts","P","Trooper Mifune (_Fire and Ice_): Toshiro Mifune."]],"paladins":[["ideas","S","Zorastro: Zoroaster (Zarathustra), the Persian prophet of a cosmic war between light and darkness. Mozart's Sarastro is named after him too, so Zorastro, Sarastro and [[sarastus|Sarastus]] may share a root. [[satori|Satori]] last met Zorastro “in the night-bound ruins of a fallen hive city”."],["lit","P","Nietzsche's _Thus Spoke Zarathustra_, whose prophet announces that God is dead. Zorastro tells [[satori|Satori]] their prophet “is lost to us” and that “Enlightenment is a fable”."]],"tarsem":[["arts","S","Tarsem Singh, director of _The Cell_ (2000), in which an investigator enters another mind's dreamscape, and _The Fall_ (2006). Tarsem Veyd spends 41 years inside the [[reverie|Reverie]]. Fehervari names other characters after film directors (Visconti, Cimino)."]],"seishin":[["ideas","C","Seishin: Japanese for “spirit” or “mind”. Other tau names here are also Japanese ([[akuryo|Akuryo]])."]],"bosch":[["arts","S","Hieronymus Bosch, painter of crowded, tormented hellscapes. Bosch's ordeal comes through a picture (the drawing in the lift), his wife paints, and Fehervari names other characters after painters ([[caravaggio|Caravaggio]], [[escher|Escher]])."]],"vita":[["ideas","C","Latin: “ephemeral life”, literally life for a day."]]};

</script>
<script>
(function(){
const CONF={C:"Confirmed",S:"Strong inference",P:"Speculative",E:"Echo",m:"Motif"};
const TYPE={person:"Person",place:"Place",faction:"Faction or group",entity:"Object or power",event:"Event",motif:"Recurring phrase or image"};
const RCAT={lit:"Literature & myth",ideas:"Philosophy, religion & language",arts:"Film, music & art",w40k:"Wider Warhammer 40,000"};
const RCONF={C:"Clear",S:"Likely",P:"Possible",T:"Tenuous"};
const CL={ring:[0,0,"The Koronatus Ring"],angels:[-1.25,-0.2,"Malpertuis & the Angels"],inq:[0.2,-1.05,"Oblazt & the Ordo"],phaedra:[1.25,-0.05,"Phaedra & Yuxa"],prov:[0.85,1.0,"Providence & the Arkan"],sarastus:[-0.75,1.0,"Sarastus"],motif:[-1.0,-1.1,""]};
const SC=500;
let _seed=20261121;const rand=()=>{_seed|=0;_seed=_seed+0x6D2B79F5|0;let t=Math.imul(_seed^_seed>>>15,1|_seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const ALLW=Object.keys(WORKS);
let READ=new Set(ALLW);try{const s=JSON.parse(localStorage.getItem("dc-read")||"null");
  // Saved as {read,known}; older saves are a plain array made before Nightshift Nineteen was added.
  const read=Array.isArray(s)?s:(s&&s.read),known=Array.isArray(s)?ALLW.filter(w=>w!=="NN"):(s&&s.known);
  if(Array.isArray(read)){READ=new Set(read.filter(w=>WORKS[w]));
    if(Array.isArray(known)&&known.every(w=>!WORKS[w]||READ.has(w)))ALLW.forEach(w=>{if(!known.includes(w))READ.add(w);});}
}catch(e){}
const allRead=()=>ALLW.every(w=>READ.has(w));
const okW=ws=>ws.every(w=>READ.has(w));
const unreadOf=ws=>ws.filter(w=>!READ.has(w));
const revealed=new Set();
const state={on:{C:true,S:true,P:true,E:true,m:false},work:"",sel:null,tab:"tour",thread:null,step:0,view:"map"};

const nodes=NODES.map(n=>({...n}));
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const links=LINKS.map(([s,t,c,k,why,w],i)=>({i,source:s,target:t,c:k==="m"?"m":c,conf:c,kind:k,why,w}));
nodes.forEach(n=>n.deg=0);
links.forEach(l=>{byId[l.source].deg++;byId[l.target].deg++;});
nodes.forEach(n=>{n.r=n.t==="motif"?6:Math.max(5,Math.min(17,4+Math.sqrt(n.deg)*2.6));const c=CL[n.c];n.x=c[0]*SC+(rand()-.5)*80;n.y=c[1]*SC+(rand()-.5)*80;});
links.forEach(l=>{l.far=byId[l.source].c!==byId[l.target].c;});

// ---------- controls ----------
const ws=document.getElementById("workSel");
Object.entries(WORKS).sort((a,b)=>a[1].y-b[1].y||a[1].t.localeCompare(b[1].t)).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v.t+" ("+v.y+")";ws.appendChild(o);});
const dl=document.getElementById("names");
function fillNames(){dl.innerHTML="";nodes.filter(n=>n.w.some(w=>READ.has(w))).sort((a,b)=>a.n.localeCompare(b.n)).forEach(n=>{const o=document.createElement("option");o.value=n.n;dl.appendChild(o);});}
fillNames();
document.querySelectorAll(".chip[data-k]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k;state.on[k]=!state.on[k];b.setAttribute("aria-pressed",state.on[k]);applyFilters();}));
ws.addEventListener("change",()=>{state.work=ws.value;applyFilters();if(state.tab==="works")renderWorks();});
document.getElementById("search").addEventListener("change",e=>{const v=e.target.value.trim().toLowerCase();if(!v)return;const n=nodes.find(n=>n.n.toLowerCase()===v)||nodes.find(n=>n.n.toLowerCase().includes(v));if(n){if(n.t==="motif"&&!state.on.m)toggleMotifs(true);select(n.id,true);}});
function toggleMotifs(v){state.on.m=v;document.getElementById("f-m").setAttribute("aria-pressed",v);applyFilters();}

// ---------- graph ----------
const svg=d3.select("#graph");
const root=svg.append("g");
let T=d3.zoomIdentity;let labelPri=null;
let relaxK=null,simReady=false;
const zoom=d3.zoom().scaleExtent([.25,6]).on("zoom",e=>{T=e.transform;draw();layoutLabels();if(typeof relax==="function")relax();});
svg.call(zoom);
const linkSel=root.append("g").selectAll("path").data(links).join("path").attr("class",d=>"link "+d.c+(d.kind==="id"?" id":"")+(d.far?" far":""));
const nodeSel=root.append("g").selectAll("g").data(nodes).join("g").attr("class",d=>"node "+d.t).attr("tabindex",0).attr("role","button").attr("aria-label",d=>d.n);
nodeSel.append("circle").attr("r",d=>d.r);
nodeSel.append("text").attr("dy",d=>d.r+13).attr("text-anchor","middle").text(d=>d.n.length>28?d.n.slice(0,27)+"…":d.n);
const clLabels=root.append("g").selectAll("text").data(Object.entries(CL).filter(d=>d[1][2])).join("text").attr("class","cluster-label").attr("role","button").attr("tabindex",0).text(d=>d[1][2])
  .on("click",(e,d)=>{e.stopPropagation();zoomTo(nodes.filter(n=>n.c===d[0]),1.8);})
  .on("keydown",(e,d)=>{if(e.key==="Enter")zoomTo(nodes.filter(n=>n.c===d[0]),1.8);});
nodeSel.on("click",(e,d)=>{e.stopPropagation();select(d.id);})
  .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d.id);}})
  .on("mouseenter",(e,d)=>{state.hover=d.id;refresh();})
  .on("mouseleave",()=>{state.hover=null;refresh();});
svg.on("click",()=>{if(state.sel){state.sel=null;refresh();if(state.tab==="dossier")renderDossier();}});
nodeSel.call(d3.drag().subject((e,d)=>({x:T.applyX(d.x),y:T.applyY(d.y)})).on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;}).on("drag",(e,d)=>{d.fx=T.invertX(e.x);d.fy=T.invertY(e.y);}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

const dist={C:70,S:95,P:120,E:140,m:150};
const sim=d3.forceSimulation(nodes)
  .force("link",d3.forceLink(links).id(d=>d.id).distance(l=>dist[l.c]+(l.far?60:0)).strength(l=>l.c==="m"?.02:l.far?.03:.45))
  .force("charge",d3.forceManyBody().strength(d=>d.t==="motif"?-120:-420))
  .force("x",d3.forceX(d=>CL[d.c][0]*SC).strength(d=>d.t==="motif"?.02:.2))
  .force("y",d3.forceY(d=>CL[d.c][1]*SC).strength(d=>d.t==="motif"?.02:.2))
  .force("collide",d3.forceCollide(d=>d.r+30).iterations(2))
  .stop();
for(let i=0;i<600;i++)sim.tick();
// place region labels above each cluster
Object.keys(CL).forEach(k=>{const ns=nodes.filter(n=>n.c===k);if(!ns.length)return;CL[k].lx=d3.mean(ns,n=>n.x);CL[k].ly=d3.min(ns,n=>n.y)-34;});

// Zoom-dependent layout: the computed layout above is each entry's home position.
// As you zoom in, entries push apart until their names have room, then settle back as you zoom out.
nodes.forEach(n=>{n.hx=n.x;n.hy=n.y;});
function spreadAmt(){return Math.max(0,Math.min(1,(T.k-.55)/.35));}
function labelForce(alpha){
  const k=T.k,f=spreadAmt(),fs=fontPx(),rs=nodeScale(),pad=5,act=nodes.filter(visibleNode);
  const B=act.map(n=>{const r=n.r*rs,len=n.n.length>28?28:n.n.length,w=len*fs*.46+4;
    return{n,hw:Math.max(r+pad,f*(w/2+pad))/k,top:(r+pad)/k,bot:(r+pad+f*(fs+4))/k};});
  for(let it=0;it<3;it++){
  for(let i=0;i<B.length;i++){const a=B[i];
    for(let j=i+1;j<B.length;j++){const b=B[j];
      const dx=b.n.x-a.n.x,ox=a.hw+b.hw-Math.abs(dx);if(ox<=0)continue;
      const dy=b.n.y-a.n.y,oy=Math.min(a.n.y+a.bot,b.n.y+b.bot)-Math.max(a.n.y-a.top,b.n.y-b.top);if(oy<=0)continue;
      if(ox<oy){const m=ox*.5*(dx<0?-1:1);a.n.x-=m;b.n.x+=m;}
      else{const m=oy*.5*(dy<0?-1:1);a.n.y-=m;b.n.y+=m;}
    }}}
}
sim.force("link",null).force("charge",null).force("collide",null)
  .force("x",d3.forceX(d=>d.hx).strength(.08)).force("y",d3.forceY(d=>d.hy).strength(.08))
  .force("label",labelForce).velocityDecay(.45).alphaDecay(.04);
let visSig="";
function relax(force){
  if(!simReady)return;
  const sig=nodes.filter(visibleNode).length+"";
  if(!force&&relaxK!==null&&Math.abs(Math.log(T.k/relaxK))<.02&&sig===visSig)return;
  relaxK=T.k;visSig=sig;sim.alpha(Math.max(sim.alpha(),.6)).restart();
}
sim.on("tick",()=>{draw();layoutLabels();});simReady=true;draw();
// Semantic zoom: positions scale with zoom; dots and text grow only gently, so the map spreads out as you zoom in.
function nodeScale(){return Math.max(.7,Math.min(1.9,Math.pow(T.k,.5)));}
function fontPx(){return Math.max(12,Math.min(16.5,13*Math.pow(T.k,.28)));}
function draw(){
  const X=v=>T.applyX(v),Y=v=>T.applyY(v),rs=nodeScale(),fs=fontPx();
  linkSel.attr("d",d=>{const sx=X(d.source.x),sy=Y(d.source.y),tx=X(d.target.x),ty=Y(d.target.y),dr=Math.hypot(tx-sx,ty-sy)*1.8;return d.kind==="id"?`M${sx},${sy}L${tx},${ty}`:`M${sx},${sy}A${dr},${dr} 0 0,1 ${tx},${ty}`;});
  nodeSel.attr("transform",d=>`translate(${X(d.x)},${Y(d.y)})`);
  nodeSel.select("circle").attr("r",d=>d.r*rs);
  nodeSel.select("text").attr("dy",d=>d.r*rs+fs+1).style("font-size",fs+"px");
  Object.keys(CL).forEach(k=>{const ns=nodes.filter(n=>n.c===k&&visibleNode(n));if(ns.length){CL[k].lx=d3.mean(ns,n=>n.x);CL[k].ly=d3.min(ns,n=>n.y)-34/Math.max(1,T.k);}});
  const cs=Math.max(13,Math.min(30,17*Math.pow(T.k,.55)));
  clLabels.attr("x",d=>X(CL[d[0]].lx)).attr("y",d=>Y(CL[d[0]].ly)-(cs-17)).style("font-size",cs+"px").style("opacity",T.k>2.6?.35:null);
}
// Labels: placed greedily by importance, skipping any that would overlap one already placed.

function layoutLabels(){
  // A label is shown only when its box overlaps no other label and no other dot.
  // The hovered or selected entry always keeps its label.
  const fs=fontPx(),rs=nodeScale(),W=svg.node().clientWidth,H=svg.node().clientHeight,pad=3;
  const pool=nodes.filter(n=>visibleNode(n)&&!(labelPri&&labelPri.dim.has(n.id)));
  const items=[];
  for(const n of pool){
    const x=T.applyX(n.x),y=T.applyY(n.y);
    if(x<-80||x>W+80||y<-40||y>H+40)continue;
    const r=n.r*rs,len=n.n.length>28?28:n.n.length,w=len*fs*.46+4,top=y+r+2;
    items.push({n,x,y,r,b:{x0:x-w/2,x1:x+w/2,y0:top,y1:top+fs+2}});
  }
  const hitBox=(a,b)=>a.x0<b.x1+pad&&a.x1>b.x0-pad&&a.y0<b.y1+pad&&a.y1>b.y0-pad;
  const hitDot=(b,it)=>{const cx=Math.max(b.x0,Math.min(it.x,b.x1)),cy=Math.max(b.y0,Math.min(it.y,b.y1));return Math.hypot(it.x-cx,it.y-cy)<it.r+pad;};
  const always=new Set([state.hover,state.sel].filter(Boolean));
  const show=new Set();
  for(const it of items){
    if(always.has(it.n.id)){show.add(it.n.id);continue;}
    // Overview: no names until the map starts spreading, except entries lit by a tour, story filter or selection.
    if(spreadAmt()<.15&&!(labelPri&&labelPri.top.has(it.n.id)))continue;
    let ok=true;
    for(const o of items){
      if(o===it)continue;
      if(hitBox(it.b,o.b)||hitDot(it.b,o)){ok=false;break;}
    }
    if(ok)show.add(it.n.id);
  }
  nodeSel.select("text").style("display",n=>show.has(n.id)?null:"none");
}
function zoomTo(arr,maxK,instant){
  const w=svg.node().clientWidth,h=svg.node().clientHeight;if(!arr.length)return;
  const xs=arr.map(n=>n.x),ys=arr.map(n=>n.y);
  const x0=Math.min(...xs)-90,x1=Math.max(...xs)+90,y0=Math.min(...ys)-70,y1=Math.max(...ys)+60;
  const k=Math.min(w/(x1-x0),h/(y1-y0),maxK||1.4);
  const tr=d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2).scale(k);
  if(instant||!w)svg.call(zoom.transform,tr);else svg.transition().duration(500).call(zoom.transform,tr);
}

// One function decides what is lit: hover beats selection beats tour step beats work filter.
function refresh(){
  const k=d3.zoomTransform(svg.node()).k;
  let lit=null,hiLink=null,center=null;
  const focusId=state.hover||state.sel;
  if(focusId){
    lit=new Set([focusId]);center=focusId;
    links.forEach(l=>{if(!visibleLink(l))return;if(l.source.id===focusId)lit.add(l.target.id);if(l.target.id===focusId)lit.add(l.source.id);});
    hiLink=l=>l.source.id===focusId||l.target.id===focusId;
  }else if(state.thread&&state.tab==="tour"){
    const st=THREADS.find(t=>t.id===state.thread).steps[state.step];
    lit=new Set(st.f);
    hiLink=l=>lit.has(l.source.id)&&lit.has(l.target.id);
  }else if(state.work){
    lit=new Set(nodes.filter(n=>n.w.includes(state.work)).map(n=>n.id));
    hiLink=l=>l.w.includes(state.work);
  }
  nodeSel.classed("dim",n=>lit?!lit.has(n.id):false).classed("sel",n=>n.id===state.sel||(n.id===center&&!!state.hover));
  linkSel.classed("dim",l=>hiLink?!hiLink(l):false).classed("hi",l=>hiLink?hiLink(l):false);
  labelPri=lit?{top:lit,dim:new Set(nodes.filter(n=>!lit.has(n.id)).map(n=>n.id))}:null;
  if(state.sel&&!lit)labelPri={top:new Set([state.sel]),dim:new Set()};
  layoutLabels();if(typeof relax==="function")relax();
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// inline: [[id|label]] -> link, [[id]] -> link with entry name, _Title_ -> italic
function inl(s){
  return esc(s)
    .replace(/\[\[([a-zA-Z_]+)(?:\|([^\]]+))?\]\]/g,(m,id,label)=>byId[id]?`<a class="xref" data-id="${id}" tabindex="0">${label||esc(byId[id].n)}</a>`:(label||id))
    .replace(/(^|[^\w])_([^_]+?)_(?=[^\w]|$)/g,'$1<i>$2</i>');
}
// block: blank-line paragraphs, "• " bullets, "1. " numbered lists
function md(s){
  const out=[];let list=null;
  const close=()=>{if(list){out.push(`<${list.t} class="rich-list">${list.items.map(i=>`<li>${i}</li>`).join("")}</${list.t}>`);list=null;}};
  String(s).split("\n").forEach(line=>{
    const b=line.match(/^•\s+(.*)/),n=line.match(/^\d+\.\s+(.*)/);
    if(b||n){const t=b?"ul":"ol";if(!list||list.t!==t){close();list={t,items:[]};}list.items.push(inl((b||n)[1]));return;}
    close();if(line.trim())out.push(`<p>${inl(line)}</p>`);
  });
  close();return `<div class="rich">${out.join("")}</div>`;
}

}
function renderDocs(){
  let h=`<div class="alt-inner"><h2>In-universe documents</h2><p class="lede">Books, scriptures, logs and sayings that exist inside the setting, mostly known from epigraphs. ${DOCS.length} documents.</p><div class="docs">`;
  DOCS.forEach((d,i)=>{
    const body=`<div class="kind">${esc(d.k)}</div><b class="doc-t">${esc(d.n)}</b><div class="src">By ${esc(d.by)} · quoted or named in ${wlist(d.w)}</div>${md(d.x)}${chips(d.f)}`;
    h+=`<article class="doc">${gate("d:"+i,d.w,body)}</article>`;
  });
  alt.innerHTML=h+`</div></div>`;bindAlt(renderDocs);
}
// ---------- spoilers ----------
const spBtn=document.getElementById("spoilBtn"),spDlg=document.getElementById("spoilDlg");
function spLabel(){spBtn.textContent=allRead()?"Spoilers: showing all":`Spoilers: ${READ.size} of ${ALLW.length} read`;}
function openSpoil(){
  const order=["NB","NN","RV","RI","AA","NF","WF","CT","SB","GE","OC","SW","AM","FC","VG","FI","TP","CHS","CSD"];
  spDlg.innerHTML=`<div class="dlg"><h2>Which stories have you read?</h2><p>Entries, links, tour stops and timeline events that draw on unticked stories are hidden. Hidden text can still be shown one item at a time. Saved in this browser only.</p>
  <div class="spl">${order.concat(ALLW.filter(w=>!order.includes(w))).map(w=>`<label><input type="checkbox" id="sp-${w}" data-w="${w}" ${READ.has(w)?"checked":""}> <i>${esc(WORKS[w].t)}</i></label>`).join("")}</div>
  <div class="stepnav"><button id="spAll">Tick all</button><button id="spNone">Untick all</button><button id="spDone" class="primary">Done</button></div></div>`;
  spDlg.hidden=false;
  spDlg.querySelectorAll("input").forEach(c=>c.addEventListener("change",()=>{c.checked?READ.add(c.dataset.w):READ.delete(c.dataset.w);}));
  document.getElementById("spAll").onclick=()=>{ALLW.forEach(w=>READ.add(w));spDlg.querySelectorAll("input").forEach(c=>c.checked=true);};
  document.getElementById("spNone").onclick=()=>{READ.clear();spDlg.querySelectorAll("input").forEach(c=>c.checked=false);};
  document.getElementById("spDone").onclick=closeSpoil;
  spDlg.querySelector("input").focus();
}
function closeSpoil(){spDlg.hidden=true;try{localStorage.setItem("dc-read",JSON.stringify({read:[...READ],known:ALLW}));}catch(e){}revealed.clear();spLabel();fillNames();applyFilters();
  if(state.sel&&!readNode(byId[state.sel]))state.sel=null;setTab(state.tab,true);if(state.view!=="map")setView(state.view);fit();}
spBtn.addEventListener("click",openSpoil);
spDlg.addEventListener("click",e=>{if(e.target===spDlg)closeSpoil();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!spDlg.hidden)closeSpoil();});
spLabel();
applyFilters();setTab("tour");
fit(true);requestAnimationFrame(()=>fit(true));
window.addEventListener("resize",()=>{clearTimeout(window.__r);window.__r=setTimeout(fit,200);});
})();

</script>
